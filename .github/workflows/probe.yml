name: Batch SSA segv probe

# Diagnostic-only workflow (v3). v1/v2 localized the exit-139 crash to
# CompiledRateLaw::compile -> Expression::toString -> ostream::_M_insert<double>
# with statically-linked libstdc++ locale code inside the extension. This
# version proves the causal chain in one job:
#   1. build the baseline (origin/main flags: -static-libgcc -static-libstdc++
#      on the extension), collect link/maps evidence and crash counts,
#   2. build with the extension linking libstdc++ dynamically, collect the
#      same evidence, expect zero crashes,
#   3. run the real CI test against the fixed build.

on:
  push:
    branches: ['ci/**']
  workflow_dispatch:

concurrency:
  group: probe-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify-fix:
    name: Baseline vs fixed build
    runs-on: ubuntu-22.04
    env:
      CC: gcc-12
      CXX: g++-12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          python -m pip install pytest numpy scipy

      - name: Baseline build (origin/main link flags)
        run: |
          git fetch origin main
          git show origin/main:cpp/CMakeLists.txt > cpp/CMakeLists.txt
          cmake -B build-baseline -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -DBUILD_PYTHON_BINDINGS=ON \
            -DBUILD_CLI=OFF \
            -DBUILD_NFSIM_CLI=OFF \
            -DBUILD_TESTS=OFF
          cmake --build build-baseline

      - name: Baseline link and runtime evidence
        shell: bash
        run: |
          echo "== ldd of baseline extension =="
          ldd build-baseline/cpp/_bionetgen_cpp*.so || true
          echo "== which SciPy modules link libstdc++.so.6 =="
          python - <<'EOF'
          import glob, os, scipy, subprocess
          hits = []
          for f in glob.glob(os.path.join(os.path.dirname(scipy.__file__), '**', '*.so'), recursive=True):
              out = subprocess.run(['ldd', f], capture_output=True, text=True).stdout
              if 'libstdc++' in out:
                  hits.append(os.path.basename(f))
          print('scipy modules linking libstdc++.so.6:', hits[:10] or 'NONE')
          EOF
          echo "== /proc/self/maps: C++ runtimes in a process with numpy+scipy+baseline extension =="
          python - <<'EOF'
          import numpy, scipy, sys
          sys.path.insert(0, 'build-baseline/cpp')
          import _bionetgen_cpp
          seen = [l.strip() for l in open('/proc/self/maps') if 'libstdc++' in l or 'libc++.so' in l]
          print('\n'.join(seen) or '(no dynamic C++ runtime mapped)')
          EOF

      - name: Fixed build (extension links libstdc++ dynamically)
        run: |
          git checkout HEAD -- cpp/CMakeLists.txt
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -DBUILD_PYTHON_BINDINGS=ON \
            -DBUILD_CLI=OFF \
            -DBUILD_NFSIM_CLI=OFF \
            -DBUILD_TESTS=OFF
          cmake --build build

      - name: Fixed link evidence
        run: |
          echo "== ldd of fixed extension =="
          ldd build/cpp/_bionetgen_cpp*.so | grep -E "stdc|gcc" || echo "ERROR: still no dynamic libstdc++ dependency"

      - name: "Crash counts - baseline vs fixed, with and without numpy/scipy"
        shell: bash
        run: |
          python - <<'EOF'
          import subprocess, sys
          TPL = ("import sys\n{pre}\n"
                 "sys.path.insert(0, {bdir!r})\n"
                 "sys.path.insert(0, 'python')\n"
                 "import _bionetgen_cpp as cpp\n"
                 "m = cpp.parse_file('models/isomerization.bngl')\n"
                 "n = cpp.generate_network(m)\n"
                 "print('ok', n.num_species, n.num_reactions)\n")
          cases = [
              ("baseline, no numpy/scipy", "build-baseline/cpp", "pass"),
              ("baseline, numpy+scipy imported", "build-baseline/cpp", "import numpy, scipy"),
              ("fixed, no numpy/scipy", "build/cpp", "pass"),
              ("fixed, numpy+scipy imported", "build/cpp", "import numpy, scipy"),
          ]
          for label, bdir, pre in cases:
              bad = 0
              rcs = []
              for _ in range(10):
                  r = subprocess.run([sys.executable, "-c",
                                      TPL.format(bdir=bdir, pre=pre)],
                                     capture_output=True, text=True)
                  rcs.append(r.returncode)
                  if r.returncode != 0:
                      bad += 1
              print(f"{label}: {bad}/10 failed (rcs={rcs})", flush=True)
          EOF

      - name: Real CI test against the fixed build
        shell: bash
        run: |
          PYTHONUNBUFFERED=1 python -X faulthandler tests/test_batch_ssa_statistical_parity.py --mode cpu
