name: Release policy guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  anti-gaming:
    name: Base-revision anti-gaming checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check out trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch PR head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$PR_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head:refs/remotes/pull/$PR_NUMBER/head"
          fetched=$(git rev-parse refs/remotes/pull/$PR_NUMBER/head)
          [[ "$fetched" == "$PR_HEAD" ]] || { echo "fetched pull request revision differs from event revision"; exit 1; }
      - name: Run trusted base policy against candidate tree
        run: |
          python -m pip install "pyyaml==6.0.2"
          python tests/validation/policy/run_antigaming.py --root "$GITHUB_WORKSPACE" \
            --base "$BASE_REVISION" --head "$HEAD_REVISION" \
            --check release-protected-expectations --check release-no-product-fixture-names
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
