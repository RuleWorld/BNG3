name: Focused native issue acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/issue-acceptance.yml'
      - '.github/workflows/ci.yml'
      - 'tests/test_issue_acceptance_ci.py'
      - 'tests/validation/release/cases/issue-157/**'
      - 'tests/validation/release/cases/issue-161/**'
      - 'CMakeLists.txt'
      - 'cpp/CMakeLists.txt'
      - 'pyproject.toml'
      - 'cpp/**'
      - 'provenance/ssts-ci-linux-py312.lock'
      - 'provenance/upstreams.lock.yml'
      - 'python/bionetgen/atomizer/modern/**'
      - 'python/bionetgen/__init__.py'
      - 'python/bionetgen/model.py'
      - 'python/bionetgen/sbml.py'
      - 'tests/python/test_atomizer_dae_ida.py'
      - 'tests/python/test_atomizer_fast_reaction.py'
      - 'scripts/ci/checkout_oracle.py'
      - 'scripts/ci/oracle_sources.py'
      - 'scripts/cross_validate.py'
      - 'scripts/issue161_multi_contract.py'
      - 'scripts/issue161_multi_expected.py'
      - 'scripts/validate.py'
      - 'tests/validation/compare.py'
      - 'tests/validation/oracle_perl.py'
  workflow_dispatch:
    inputs:
      run_issue_157:
        description: Run the native dynamic-event trigger acceptance
        required: false
        type: boolean
        default: false
      run_issue_160:
        description: Run bounded native SBML Core execution regressions
        required: false
        type: boolean
        default: false
      run_issue_161:
        description: Run the authored SBML Multi export and reimport acceptance
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  CMAKE_BUILD_TYPE: Release
  CMAKE_ARGS: -DBUILD_CLI=ON -DBUILD_NFSIM_CLI=OFF -DBUILD_TESTS=OFF
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  issue-157:
    if: github.event_name == 'pull_request' || inputs.run_issue_157
    name: Issue 157 native dynamic-event acceptance
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools and locked SBML runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r provenance/ssts-ci-linux-py312.lock

      - name: Build fresh BNG3 native extension and CLI
        id: build_native
        run: |
          set -euo pipefail
          .venv/bin/python -m pip install --no-deps --no-build-isolation \
            --config-settings=build-dir=build .
          test -x build/cpp/bng_cpp

      - name: Run native event acceptance
        id: acceptance
        if: always() && steps.build_native.outcome == 'success'
        env:
          PYTHONPATH: python:build/cpp
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-157-artifacts"
          .venv/bin/python -m pytest -q \
            tests/validation/release/cases/issue-157/test_dynamic_threshold.py \
            --junitxml="$RUNNER_TEMP/issue-157-artifacts/pytest.xml"

      - name: Record product build identity
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-157-artifacts"
          {
            echo "product_revision=$(git rev-parse HEAD)"
            if test -x build/cpp/bng_cpp; then
              echo "bng_cpp_sha256=$(sha256sum build/cpp/bng_cpp | cut -d ' ' -f 1)"
            fi
            if test -f .venv/bin/python; then
              .venv/bin/python -m pip freeze > "$RUNNER_TEMP/issue-157-artifacts/runtime.txt"
            fi
          } > "$RUNNER_TEMP/issue-157-artifacts/provenance.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-157-native-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/issue-157-artifacts/
          if-no-files-found: warn
          retention-days: 30

  issue-161:
    if: github.event_name == 'pull_request' || inputs.run_issue_161
    name: Issue 161 SBML Multi acceptance
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools and locked SBML runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build perl
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r provenance/ssts-ci-linux-py312.lock

      - name: Checkout pinned BNG2 oracle
        run: |
          set -euo pipefail
          python scripts/ci/checkout_oracle.py \
            --name bionetgen \
            --destination "$RUNNER_TEMP/oracle-bionetgen" \
            --summary-file "$GITHUB_STEP_SUMMARY"
          test -f "$RUNNER_TEMP/oracle-bionetgen/bng2/BNG2.pl"

      - name: Build fresh BNG3 native extension and CLI
        id: build_native
        run: |
          set -euo pipefail
          .venv/bin/python -m pip install --no-deps --no-build-isolation \
            --config-settings=build-dir=build .
          test -x build/cpp/bng_cpp

      - name: Check Issue 161 provenance controls
        if: always() && steps.build_native.outcome == 'success'
        run: >-
          .venv/bin/python -m pytest -q -p no:cacheprovider -c /dev/null
          --confcutdir=tests/validation/release/cases/issue-161
          tests/validation/release/cases/issue-161/test_run_case.py

      - name: Check Multi rule-rate and component-map regressions
        if: always() && steps.build_native.outcome == 'success'
        env:
          PYTHONPATH: python:build/cpp
          BNG_CPP: ${{ github.workspace }}/build/cpp/bng_cpp
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-161-artifacts"
          .venv/bin/python -m pytest -q -p no:cacheprovider -c /dev/null \
            tests/python/test_sbml_multi_rule_rates.py \
            tests/python/test_modern_atomizer_multi.py \
            --junitxml="$RUNNER_TEMP/issue-161-artifacts/multi-regressions.xml"

      - name: Compare stateful Multi execution with independently authored SBML Core
        if: always() && steps.build_native.outcome == 'success'
        env:
          PYTHONPATH: python:build/cpp
          BNG_CPP: ${{ github.workspace }}/build/cpp/bng_cpp
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-161-artifacts"
          .venv/bin/python -m pytest -q -p no:cacheprovider -c /dev/null \
            --confcutdir=tests/validation/release/cases/issue-161 \
            tests/validation/release/cases/issue-161/test_stateful_binding.py \
            --junitxml="$RUNNER_TEMP/issue-161-artifacts/stateful-core-oracle.xml"

      - name: Compare Multi numericValue and sum kinetics with independently authored SBML Core
        if: always() && steps.build_native.outcome == 'success'
        env:
          PYTHONPATH: python:build/cpp
          BNG_CPP: ${{ github.workspace }}/build/cpp/bng_cpp
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-161-artifacts"
          .venv/bin/python -m pytest -q -p no:cacheprovider -c /dev/null \
            --confcutdir=tests/validation/release/cases/issue-161 \
            tests/validation/release/cases/issue-161/test_multi_math_representation.py \
            tests/validation/release/cases/issue-161/test_homodimer_same_type.py \
            tests/validation/release/cases/issue-161/test_multi_concentration_sum.py \
            tests/validation/release/cases/issue-161/test_multi_more_oracles.py \
            --junitxml="$RUNNER_TEMP/issue-161-artifacts/multi-math-core-oracle.xml"

      - name: Run authored Multi export and reimport acceptance
        id: acceptance
        if: always() && steps.build_native.outcome == 'success'
        env:
          BNGPATH: ${{ runner.temp }}/oracle-bionetgen/bng2
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-161-artifacts"
          .venv/bin/python tests/validation/release/cases/issue-161/run_case.py \
            --bng-cpp build/cpp/bng_cpp \
            --bng2 "$RUNNER_TEMP/oracle-bionetgen/bng2/BNG2.pl" \
            --report "$RUNNER_TEMP/issue-161-artifacts/report.json" \
            | tee "$RUNNER_TEMP/issue-161-artifacts/execution.log"

      - name: Record product and BNG2 identities
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-161-artifacts"
          {
            echo "product_revision=$(git rev-parse HEAD)"
            if test -x build/cpp/bng_cpp; then
              echo "bng_cpp_sha256=$(sha256sum build/cpp/bng_cpp | cut -d ' ' -f 1)"
            fi
            if test -f .venv/bin/python; then
              .venv/bin/python -m pip freeze > "$RUNNER_TEMP/issue-161-artifacts/runtime.txt"
            fi
            if test -d "$RUNNER_TEMP/oracle-bionetgen"; then
              echo "bng2_revision=$(git -C "$RUNNER_TEMP/oracle-bionetgen" rev-parse HEAD)"
              echo "bng2_dirty=$(git -C "$RUNNER_TEMP/oracle-bionetgen" status --porcelain | wc -l)"
            fi
          } > "$RUNNER_TEMP/issue-161-artifacts/provenance.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-161-multi-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/issue-161-artifacts/
          if-no-files-found: warn
          retention-days: 30

  issue-160:
    if: github.event_name == 'pull_request' || inputs.run_issue_160
    name: Issue 160 bounded native Core execution
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CMAKE_ARGS: -DBUILD_PYTHON_BINDINGS=ON -DBUILD_CLI=OFF -DBUILD_NFSIM_CLI=OFF -DBUILD_TESTS=OFF
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools and locked SBML runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r provenance/ssts-ci-linux-py312.lock

      - name: Build fresh BNG3 native extension
        id: build_native
        run: |
          set -euo pipefail
          .venv/bin/python -m pip install --no-deps --no-build-isolation \
            --config-settings=build-dir=build .

      - name: Run bounded Core execution regressions
        if: always() && steps.build_native.outcome == 'success'
        env:
          PYTHONPATH: python:build/cpp
          BNG3_PYTHON_TEST_MODE: source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-160-artifacts"
          .venv/bin/python -m pytest -q \
            tests/python/test_atomizer_dae_ida.py \
            tests/python/test_atomizer_fast_reaction.py \
            --junitxml="$RUNNER_TEMP/issue-160-artifacts/pytest.xml"

      - name: Record exact product identity
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue-160-artifacts"
          git rev-parse HEAD > "$RUNNER_TEMP/issue-160-artifacts/product-revision.txt"
          sha256sum provenance/upstreams.lock.yml provenance/ssts-ci-linux-py312.lock > "$RUNNER_TEMP/issue-160-artifacts/inputs.sha256"
          if test -d build/cpp; then
            find build/cpp -name '*bionetgen_cpp*.so' -exec sha256sum {} + > "$RUNNER_TEMP/issue-160-artifacts/native.sha256"
          fi
          if test -x .venv/bin/python; then
            .venv/bin/python -m pip freeze > "$RUNNER_TEMP/issue-160-artifacts/runtime.txt"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-160-core-slices-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/issue-160-artifacts/
          if-no-files-found: warn
          retention-days: 30
