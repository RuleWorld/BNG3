name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  qualify:
    name: Qualify exact main commit
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm tagged commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "Release tag commit is not reachable from origin/main." >&2
            exit 1
          }

      - name: Enforce strict provenance gate for H01 (#179)
        id: provenance
        run: |
          python scripts/validate_provenance.py --require-approved
          python scripts/check_provenance_ratchet.py

      - name: Require the exact-main weekly mutation artifact and ratchet
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/weekly.yml/runs?head_sha=${GITHUB_SHA}&branch=main&per_page=100" \
            > "$RUNNER_TEMP/weekly-runs.json"
          run_id=$(python - "$RUNNER_TEMP/weekly-runs.json" "$GITHUB_SHA" <<'PY'
          import json, sys
          pages = json.load(open(sys.argv[1]))
          runs = [r for page in pages for r in page.get("workflow_runs", [])
                  if r.get("head_sha") == sys.argv[2]
                  and r.get("head_branch") == "main"
                  and r.get("event") in {"schedule", "workflow_dispatch"}
                  and r.get("status") == "completed"
                  and r.get("conclusion") == "success"]
          if not runs:
              raise SystemExit("no completed exact-main weekly mutation campaign (schedule or workflow_dispatch)")
          print(max(runs, key=lambda r: r.get("run_number", 0))["id"])
          PY
          )
          artifact="release-product-mutation-ratchet-${GITHUB_SHA}"
          gh run download "$run_id" --name "$artifact" --dir "$RUNNER_TEMP/mutation-artifact"
          python tests/validation/policy/run_antigaming.py --root "$GITHUB_WORKSPACE" \
            --check release-scheduled-mutation-ratchet \
            --mutation-report "$RUNNER_TEMP/mutation-artifact/mutation-report.json" \
            --expected-mutation-revision "$GITHUB_SHA" \
            --mutation-baseline tests/validation/policy/mutation-baseline.json

      - name: Read exact-SHA main push workflow results
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&branch=main&event=push&per_page=100" \
            > "$RUNNER_TEMP/push-workflow-runs.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&branch=main&event=workflow_dispatch&per_page=100" \
            > "$RUNNER_TEMP/sbml-workflow-runs.json"
          evidence="$RUNNER_TEMP/release-sbml-evidence"
          mkdir -p "$evidence"
          jq -r '.[].workflow_runs[]
            | select(.name == "Official SBML conformance subset" and
                     .status == "completed" and .conclusion == "success")
            | [.id, .run_attempt] | @tsv' \
            "$RUNNER_TEMP/sbml-workflow-runs.json" > "$RUNNER_TEMP/sbml-attempts.tsv"
          while IFS=$'\t' read -r run attempt; do
            destination="$evidence/$run/$attempt"
            if ! gh run download "$run" --name "ssts-release-consumers-$GITHUB_SHA-$attempt" \
                --dir "$destination/ssts"; then
              continue
            fi
            if ! gh run download "$run" --name "curated-biomodels-$GITHUB_SHA-$attempt" \
                --dir "$destination/biomodels"; then
              continue
            fi
          done < "$RUNNER_TEMP/sbml-attempts.tsv"
          python scripts/ci/qualify_release_candidate.py \
            --runs-json "$RUNNER_TEMP/push-workflow-runs.json" \
            --sbml-runs-json "$RUNNER_TEMP/sbml-workflow-runs.json" \
            --sbml-evidence-dir "$evidence" \
            --biomodels-inventory provenance/curated-biomodels-query-inventory.json \
            --sha "$GITHUB_SHA"

  # ═══════════════════════════════════════════════════════════════════════════
  # Build platform-specific CLI binaries
  # ═══════════════════════════════════════════════════════════════════════════

  build-binaries:
    name: Build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [qualify]
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: bionetgen-linux-x86_64
            binary_ext: ""
          - os: ubuntu-24.04-arm
            artifact_name: bionetgen-linux-aarch64
            binary_ext: ""
          # macos-13 is retired; macos-15-intel is the supported x86_64 label
          # for public GitHub-hosted runners.
          - os: macos-15-intel
            artifact_name: bionetgen-macos-x86_64
            binary_ext: ""
          - os: macos-15
            artifact_name: bionetgen-macos-arm64
            binary_ext: ""
          - os: windows-2022
            artifact_name: bionetgen-windows-x86_64
            binary_ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: which cmake ninja > /dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y cmake ninja-build; }

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install cmake ninja

      - name: Setup MSVC (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_CLI=ON \
            -DBUILD_NFSIM_CLI=ON \
            -DBUILD_TESTS=OFF
        shell: bash

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke test release executables
        shell: bash
        run: |
          set -euo pipefail
          build/cpp/bng_cpp${{ matrix.binary_ext }} --version
          build/cpp/NFsim${{ matrix.binary_ext }} -help \
            > "$RUNNER_TEMP/nfsim-help.txt" 2>&1
          grep -q "To run NFsim" "$RUNNER_TEMP/nfsim-help.txt"

      - name: Package binaries
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}
          cp build/cpp/bng_cpp${{ matrix.binary_ext }} dist/${{ matrix.artifact_name }}/
          cp build/cpp/NFsim${{ matrix.binary_ext }} dist/${{ matrix.artifact_name }}/
          cp README.md dist/${{ matrix.artifact_name }}/
          cd dist && tar czf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}/

      - name: Upload binary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════════════════
  # Build Python wheels for all platforms
  # ═══════════════════════════════════════════════════════════════════════════

  build-wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [qualify]
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            macos_arch: x86_64
            macos_deployment_target: "11.0"
          - os: ubuntu-24.04-arm
            macos_arch: arm64
            macos_deployment_target: "11.0"
          # 11.0, not 10.13: libc++ annotates all of <filesystem> with
          # availability(macos, introduced = 10.15), so anything below that
          # turns std::filesystem::path into a hard compile error.
          - os: macos-15-intel
            macos_arch: x86_64
            macos_deployment_target: "11.0"
          - os: macos-15
            macos_arch: arm64
            macos_deployment_target: "11.0"
          - os: windows-2022
            macos_arch: x86_64
            macos_deployment_target: "11.0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup MSVC (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install cibuildwheel
        run: pip install cibuildwheel==4.2.1

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          # musllinux is skipped because python-libsbml>=5.21.2 (required by
          # bionetgen[full] and CI wheel verification) and libroadrunner publish
          # no musllinux wheels on PyPI.
          CIBW_SKIP: "*-musllinux_* *-manylinux_i686 *-win32"
          CIBW_TEST_REQUIRES: pytest numpy click
          CIBW_TEST_COMMAND: >-
            pytest {project}/tests/python/test_cpp_backend.py -v --tb=short &&
            bionetgen --version &&
            bionetgen --help
          CIBW_ENVIRONMENT: CMAKE_ARGS="-DBUILD_TESTS=OFF -DBUILD_CLI=OFF"
          CIBW_ARCHS_MACOS: ${{ matrix.macos_arch }}
          CIBW_ENVIRONMENT_MACOS: >-
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}
            CMAKE_ARGS="-DBUILD_TESTS=OFF -DBUILD_CLI=OFF
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28

      - name: Upload wheels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════════════════
  # Build source distribution
  # ═══════════════════════════════════════════════════════════════════════════

  build-sdist:
    name: Source Distribution
    runs-on: ubuntu-22.04
    needs: [qualify]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build
      - run: python -m build --sdist

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════════════════
  # Create GitHub Release with all artifacts
  # ═══════════════════════════════════════════════════════════════════════════

  release:
    name: Create Release
    needs: [qualify, build-binaries, build-wheels, build-sdist]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install release tag parser dependency
        run: python -m pip install packaging==26.3

      - name: Classify release tag with PEP 440 rules
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/ci/release_tag.py --tag "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Organize release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Fail closed before any copy: two sources with one basename but
          # different bytes would silently overwrite in release-assets/.
          # Identical duplicates (the same universal wheel built on several
          # OSes) are staged once; cp would abort on the second just-created
          # file even though the bytes agree.
          python3 - <<'PYCODE'
          import hashlib, pathlib, shutil, sys
          dest = pathlib.Path('release-assets')
          groups = {}
          sources = []
          patterns = ('artifacts/bionetgen-*/*.tar.gz',
                      'artifacts/wheels-*/*.whl', 'artifacts/sdist/*.tar.gz')
          for pattern in patterns:
              matches = [p for p in sorted(pathlib.Path('.').glob(pattern)) if p.is_file()]
              if not matches:
                  sys.exit(f'missing release assets for {pattern}')
              for p in matches:
                  sources.append(p)
                  groups.setdefault(p.name, []).append(
                      (str(p), hashlib.sha256(p.read_bytes()).hexdigest()))
          collisions = {n: rows for n, rows in groups.items()
                        if len({digest for _, digest in rows}) > 1}
          if collisions:
              for name, rows in sorted(collisions.items()):
                  print(f'release asset basename collision {name}: {rows}', file=sys.stderr)
              sys.exit(1)
          for p in sources:
              target = dest / p.name
              if not target.exists():
                  shutil.copy2(p, target)
          PYCODE
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}

  # ═══════════════════════════════════════════════════════════════════════════
  # Publish to PyPI
  # ═══════════════════════════════════════════════════════════════════════════

  publish-pypi:
    name: Publish to PyPI
    needs: [release]
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download wheels and sdist
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: "{wheels-*,sdist}"
          # Keep each artifact in its own directory. merge-multiple: true would
          # collapse them into dist/ and let a duplicate basename overwrite
          # another artifact before the guard in the next step can see both.
          merge-multiple: false

      - name: Flatten dist directory
        run: |
          set -euo pipefail
          # Fail closed before any copy: PyPI file uploads are immutable, so a
          # flattened duplicate basename must never silently overwrite.
          # Identical duplicates are copied once; cp would abort on the second
          # just-created file even when the bytes agree.
          python3 - <<'PYCODE'
          import hashlib, pathlib, shutil, sys
          dest = pathlib.Path('flat-dist')
          groups = {}
          sources = []
          for p in sorted(pathlib.Path('dist').rglob('*')):
              if p.is_file() and p.name.endswith(('.whl', '.tar.gz')):
                  sources.append(p)
                  groups.setdefault(p.name, []).append(
                      (str(p), hashlib.sha256(p.read_bytes()).hexdigest()))
          collisions = {n: rows for n, rows in groups.items()
                        if len({digest for _, digest in rows}) > 1}
          if collisions:
              for name, rows in sorted(collisions.items()):
                  print(f'PyPI dist basename collision {name}: {rows}', file=sys.stderr)
              sys.exit(1)
          dest.mkdir(parents=True, exist_ok=True)
          for p in sources:
              target = dest / p.name
              if not target.exists():
                  shutil.copy2(p, target)
          PYCODE
          ls flat-dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: flat-dist/
