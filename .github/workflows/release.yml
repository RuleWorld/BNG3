name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  qualify:
    name: Qualify exact main commit
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm tagged commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "Release tag commit is not reachable from origin/main." >&2
            exit 1
          }

      - name: Read exact-SHA main push workflow results
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&branch=main&event=push&per_page=100" \
            > "$RUNNER_TEMP/workflow-runs.json"
          python scripts/ci/qualify_release_candidate.py \
            --runs-json "$RUNNER_TEMP/workflow-runs.json" \
            --sha "$GITHUB_SHA"

  # ═══════════════════════════════════════════════════════════════════════════
  # Build platform-specific CLI binaries
  # ═══════════════════════════════════════════════════════════════════════════

  build-binaries:
    name: Build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [qualify]
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: bionetgen-linux-x86_64
            binary_ext: ""
          # macos-13 is retired; macos-15-intel is the supported x86_64 label
          # for public GitHub-hosted runners.
          - os: macos-15-intel
            artifact_name: bionetgen-macos-x86_64
            binary_ext: ""
          - os: macos-14
            artifact_name: bionetgen-macos-arm64
            binary_ext: ""
          - os: windows-2022
            artifact_name: bionetgen-windows-x86_64
            binary_ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install cmake ninja

      - name: Setup MSVC (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_CLI=ON \
            -DBUILD_NFSIM_CLI=ON \
            -DBUILD_TESTS=OFF
        shell: bash

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke test release executables
        shell: bash
        run: |
          set -euo pipefail
          build/cpp/bng_cpp${{ matrix.binary_ext }} --version
          build/cpp/NFsim${{ matrix.binary_ext }} -help \
            > "$RUNNER_TEMP/nfsim-help.txt" 2>&1
          grep -q "To run NFsim" "$RUNNER_TEMP/nfsim-help.txt"

      - name: Package binaries
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}
          cp build/cpp/bng_cpp${{ matrix.binary_ext }} dist/${{ matrix.artifact_name }}/
          cp build/cpp/NFsim${{ matrix.binary_ext }} dist/${{ matrix.artifact_name }}/
          cp README.md dist/${{ matrix.artifact_name }}/
          cd dist && tar czf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.tar.gz

  # ═══════════════════════════════════════════════════════════════════════════
  # Build Python wheels for all platforms
  # ═══════════════════════════════════════════════════════════════════════════

  build-wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [qualify]
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            macos_arch: x86_64
            macos_deployment_target: "11.0"
          - os: macos-15-intel
            macos_arch: x86_64
            macos_deployment_target: "10.13"
          - os: macos-14
            macos_arch: arm64
            macos_deployment_target: "11.0"
          - os: windows-2022
            macos_arch: x86_64
            macos_deployment_target: "11.0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup MSVC (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install cibuildwheel
        run: pip install cibuildwheel==4.2.1

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_* *-manylinux_i686 *-win32"
          CIBW_TEST_REQUIRES: pytest numpy click
          CIBW_TEST_COMMAND: >-
            pytest {project}/tests/python/test_cpp_backend.py -v --tb=short &&
            bionetgen --version &&
            bionetgen --help
          CIBW_ENVIRONMENT: CMAKE_ARGS="-DBUILD_TESTS=OFF -DBUILD_CLI=OFF"
          CIBW_ARCHS_MACOS: ${{ matrix.macos_arch }}
          CIBW_ENVIRONMENT_MACOS: >-
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}
            CMAKE_ARGS="-DBUILD_TESTS=OFF -DBUILD_CLI=OFF
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # ═══════════════════════════════════════════════════════════════════════════
  # Build source distribution
  # ═══════════════════════════════════════════════════════════════════════════

  build-sdist:
    name: Source Distribution
    runs-on: ubuntu-22.04
    needs: [qualify]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build
      - run: python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ═══════════════════════════════════════════════════════════════════════════
  # Create GitHub Release with all artifacts
  # ═══════════════════════════════════════════════════════════════════════════

  release:
    name: Create Release
    needs: [qualify, build-binaries, build-wheels, build-sdist]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Organize release assets
        run: |
          mkdir -p release-assets
          # CLI binaries
          cp artifacts/bionetgen-*/*.tar.gz release-assets/
          # Python wheels
          cp artifacts/wheels-*/*.whl release-assets/
          # Source dist
          cp artifacts/sdist/*.tar.gz release-assets/
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  # ═══════════════════════════════════════════════════════════════════════════
  # Publish to PyPI
  # ═══════════════════════════════════════════════════════════════════════════

  publish-pypi:
    name: Publish to PyPI
    needs: [release]
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download wheels and sdist
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
          pattern: "{wheels-*,sdist}"

      - name: Flatten dist directory
        run: |
          mkdir -p flat-dist
          find dist -name "*.whl" -exec cp {} flat-dist/ \;
          find dist -name "*.tar.gz" -exec cp {} flat-dist/ \;
          ls flat-dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: flat-dist/
