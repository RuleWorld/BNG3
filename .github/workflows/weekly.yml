name: Weekly Validation

on:
  schedule:
    - cron: "23 4 * * 0"  # 4:23 AM UTC every Sunday
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Full BNG Network and action-output Validation
  # ═══════════════════════════════════════════════════════════════════════════

  bng-validation:
    name: BNG Validation (full corpus, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install numpy

      - name: Install build deps (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install build deps (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install cmake ninja

      - name: Setup MSVC (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build bng_cpp
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_CLI=ON \
            -DBUILD_TESTS=OFF
          cmake --build build --config Release

      - name: Run full validation corpus with no exclusions
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == *windows* ]]; then
            BNG=build/cpp/bng_cpp.exe
          else
            BNG=build/cpp/bng_cpp
          fi
          python scripts/validate.py --bng-cpp "$BNG" --strict-references \
            --validation-manifest tests/validation/validation_manifest.json \
            --summary-file "$GITHUB_STEP_SUMMARY" --verbose

  # ═══════════════════════════════════════════════════════════════════════════
  # NFsim execution smoke test (not a statistical parity check)
  # ═══════════════════════════════════════════════════════════════════════════

  nfsim-execution-smoke:
    name: NFsim Execution Smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          pip install numpy scipy

      - name: Build NFSim
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_CLI=ON \
            -DBUILD_NFSIM_CLI=ON \
            -DBUILD_TESTS=OFF
          cmake --build build --config Release

      - name: Run NFsim once per XML model with a fixed seed
        run: |
          set -euo pipefail
          NFSIM=build/cpp/NFsim
          PASS=0
          FAIL=0
          TOTAL=0

          while IFS= read -r -d '' xml; do
            TOTAL=$((TOTAL + 1))
            model_name=$(basename "$xml" .xml)

            if timeout 60 "$NFSIM" -xml "$xml" -sim 10 -oSteps 10 -seed 1 > /dev/null 2>&1; then
              echo "PASS  $model_name"
              PASS=$((PASS + 1))
            else
              echo "FAIL  $model_name"
              FAIL=$((FAIL + 1))
            fi
          done < <(find models -type f -name '*.xml' -print0)

          SOURCE_REVISION="${BNG3_SOURCE_REVISION:-${GITHUB_SHA:-unknown}}"
          NFSIM_DIGEST=$(sha256sum "$NFSIM" | cut -d ' ' -f 1)
          {
            echo "### NFsim Execution Smoke"
            echo ""
            echo "This check verifies fixed-seed execution only; it is not statistical parity evidence."
            echo ""
            echo "| Source revision | NFsim SHA-256 |"
            echo "| --- | --- |"
            echo "| `$SOURCE_REVISION` | `$NFSIM_DIGEST` |"
            echo ""
            echo "| Total | Passed | Failed |"
            echo "| ---: | ---: | ---: |"
            echo "| $TOTAL | $PASS | $FAIL |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$TOTAL" -eq 0 ] || [ "$FAIL" -gt 0 ]; then
            exit 1
          fi
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

  # ═══════════════════════════════════════════════════════════════════════════
  # Python Full Test Suite (all optional deps)
  # ═══════════════════════════════════════════════════════════════════════════

  python-full:
    name: Python Full Suite
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          pip install scikit-build-core pybind11
          pip install -e .[full,dev]
        env:
          CMAKE_ARGS: "-DBUILD_TESTS=OFF -DBUILD_CLI=OFF"

      - name: Configure native extension
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -DBUILD_PYTHON_BINDINGS=ON \
            -DBUILD_CLI=OFF \
            -DBUILD_TESTS=OFF

      - name: Build native extension
        run: cmake --build build --parallel 2

      - name: Run full test suite
        run: pytest tests/python/ -v --tb=long

  release-mutation-ratchet:
    name: Release product mutation ratchet
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build native extension and install test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          python -m pip install scikit-build-core pybind11 pytest numpy scipy
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON_BINDINGS=ON -DBUILD_CLI=OFF -DBUILD_TESTS=OFF
          cmake --build build --parallel 2
          python -m pip install -e .[full,dev]
        env:
          CMAKE_ARGS: "-DBUILD_TESTS=OFF -DBUILD_CLI=OFF"
      - name: Run isolated curated product mutants
        run: |
          mkdir -p "$RUNNER_TEMP/antigaming-mutations"
          python tests/validation/policy/run_antigaming.py --root "$GITHUB_WORKSPACE" \
            --check release-scheduled-mutation-ratchet \
            --mutation-output "$RUNNER_TEMP/antigaming-mutations/mutation-report.json"
      - name: Publish mutation classifications and score
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-product-mutation-ratchet-${{ github.sha }}
          path: ${{ runner.temp }}/antigaming-mutations/
          if-no-files-found: error
          retention-days: 90

  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          pip install scikit-build-core pybind11

      - name: Install package
        run: pip install -e .[full,dev]
        env:
          CMAKE_ARGS: "-DBUILD_TESTS=OFF -DBUILD_CLI=OFF"

      - name: Run benchmarks
        timeout-minutes: 360
        run: python benchmarks/run_benchmarks.py --json benchmarks/results/latest.json --markdown benchmarks/results/latest.md

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/latest.json

  # ═══════════════════════════════════════════════════════════════════════════
  # Cross-validation: C++ vs Perl (requires Perl)
  # ═══════════════════════════════════════════════════════════════════════════

  cross-validation:
    name: C++ vs Perl Cross-Validation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Perl and dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y perl cmake ninja-build build-essential
          python -m pip install numpy python-libsbml pyyaml

      - name: Checkout locked BNG2 oracle
        run: |
          python scripts/ci/checkout_oracle.py \
            --name bionetgen \
            --destination "$RUNNER_TEMP/oracle-bionetgen" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Build locked BNG2 Network3 oracle
        shell: bash
        run: |
          set -euo pipefail
          network3="$RUNNER_TEMP/oracle-bionetgen/bng2/Network3"
          make -C "$network3" -f Makefile.cmake
          run_network="$RUNNER_TEMP/oracle-bionetgen/bng2/bin/run_network"
          test -x "$run_network"
          echo "$(dirname "$run_network")" >> "$GITHUB_PATH"

      - name: Provide sbmlTranslator
        run: |
          mkdir -p "$RUNNER_TEMP/oracle-bionetgen/bng2/bin"
          printf '%s\n' '#!/bin/sh' 'PYTHONPATH="$GITHUB_WORKSPACE/python${PYTHONPATH:+:$PYTHONPATH}" exec python "$GITHUB_WORKSPACE/python/bionetgen/atomizer/sbmlTranslator.py" "$@"' > "$RUNNER_TEMP/oracle-bionetgen/bng2/bin/sbmlTranslator"
          chmod +x "$RUNNER_TEMP/oracle-bionetgen/bng2/bin/sbmlTranslator"

      - name: Build bng_cpp
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_CLI=ON \
            -DBUILD_TESTS=OFF
          cmake --build build --config Release

      - name: Run cross-validation
        run: |
          set -euo pipefail
          python scripts/cross_validate.py \
            --bng-cpp build/cpp/bng_cpp \
            --bng-perl "$RUNNER_TEMP/oracle-bionetgen/bng2/BNG2.pl" \
            --models-dir tests/validation/Validate \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --verbose
        env:
          BNG2_PERL: ${{ runner.temp }}/oracle-bionetgen/bng2/BNG2.pl
          BNGPATH: ${{ runner.temp }}/oracle-bionetgen/bng2
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
