name: Lean semantic kernel

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Keep formal evidence attached to the exact PR head under review.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lean-kernel:
    name: Lean 4.33.1 kernel and NFnext contracts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: formal/lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: false

      - name: Run static Lean and NFnext contract checks
        working-directory: formal/lean
        run: |
          python3 scripts/static_validate.py
          python3 scripts/check_nfnext_header_contract.py
          ./scripts/run_nfnext_contract.sh

      - name: Kernel-build Lean project
        working-directory: formal/lean
        run: lake build

      - name: Run Lean semantic smoke checks
        working-directory: formal/lean
        run: lake env lean tests/Smoke.lean
