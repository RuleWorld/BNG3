name: Lean semantic kernel

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

concurrency:
  # Replace superseded PR work; isolate every manual/scheduled/main run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lean-kernel:
    name: Lean 4.33.1 kernel and NFnext contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: formal/lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: false

      - name: Run static Lean and NFnext contract checks
        working-directory: formal/lean
        run: |
          python3 scripts/static_validate.py
          python3 scripts/check_nfnext_header_contract.py
          ./scripts/run_nfnext_contract.sh

      - name: Kernel-build Lean project
        working-directory: formal/lean
        run: lake build

      - name: Run Lean semantic smoke checks
        working-directory: formal/lean
        run: lake env lean tests/Smoke.lean

      - name: Run Lean coverage assertions
        working-directory: formal/lean
        # `lake build` does NOT compile this file: lakefile.lean declares only
        # `@[default_target] lean_lib BNG` with root `BNG/`.  It must therefore
        # be named explicitly, or its assertions are never executed by anything.
        run: lake env lean tests/Coverage.lean

      - name: Audit axiom dependencies
        working-directory: formal/lean
        # Makes the kernel-checked / native_decide split measurable rather than a
        # claim in a docstring, and fails on any axiom that is neither one of
        # Lean's three standard ones nor a declared native_decide extension.
        run: ./scripts/check_axiom_dependencies.sh

      - name: Check graph identity bridge
        working-directory: formal/lean
        run: python3 scripts/check_graph_identity_bridge.py

      - name: Check bounded network species bridge
        working-directory: formal/lean
        run: python3 scripts/check_network_species_bridge.py

      - name: Check propensity counting bridge
        working-directory: formal/lean
        run: python3 scripts/check_propensity_counting_bridge.py

      - name: Check network reaction correspondence bridge
        working-directory: formal/lean
        run: PYTHONPATH=../.. python3 scripts/check_network_reaction_correspondence.py

      - name: Harness mutation self-test
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: formal/lean
        timeout-minutes: 20
        run: ./scripts/check_harness_itself.sh

  issue156-bngir-receipt:
    name: Issue 156 BNGIR exact equality receipt
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked runtime and build native BNG3 extension
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r provenance/ssts-ci-linux-py312.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation \
            --config-settings=build-dir=build .

      - name: Run issue #156 named checks
        env:
          PYTHONPATH: python:build/cpp
          BNG3_PYTHON_TEST_MODE: source
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q \
            --confcutdir=tests/validation/release/cases/issue-156 \
            tests/validation/release/cases/issue-156/test_bngir_release.py

      - name: Record issue #156 release receipt
        env:
          PYTHONPATH: python:build/cpp
          BNG3_PYTHON_TEST_MODE: source
        run: .venv/bin/python scripts/ci/record_issue156_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: issue156-release-receipt-${{ github.sha }}
          path: tests/validation/evidence/issue156-*.json
          if-no-files-found: error
          retention-days: 30
