name: Lean semantic kernel

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

concurrency:
  # Replace superseded PR work; isolate every manual/scheduled/main run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lean-kernel:
    name: Lean 4.33.1 kernel and NFnext contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: formal/lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: false

      - name: Run static Lean and NFnext contract checks
        working-directory: formal/lean
        run: |
          python3 scripts/static_validate.py
          python3 scripts/check_nfnext_header_contract.py
          ./scripts/run_nfnext_contract.sh

      - name: Kernel-build Lean project
        working-directory: formal/lean
        run: lake build

      - name: Run Lean semantic smoke checks
        working-directory: formal/lean
        run: lake env lean tests/Smoke.lean

      - name: Run Lean coverage assertions
        working-directory: formal/lean
        # `lake build` does NOT compile this file: lakefile.lean declares only
        # `@[default_target] lean_lib BNG` with root `BNG/`.  It must therefore
        # be named explicitly, or its assertions are never executed by anything.
        run: lake env lean tests/Coverage.lean

      - name: Run issue #167 exact stochastic semantics proofs
        working-directory: formal/lean
        run: lake env lean tests/Issue167Proofs.lean

      - name: Audit axiom dependencies
        working-directory: formal/lean
        # Makes the kernel-checked / native_decide split measurable rather than a
        # claim in a docstring, and fails on any axiom that is neither one of
        # Lean's three standard ones nor a declared native_decide extension.
        run: ./scripts/check_axiom_dependencies.sh

      - name: Check graph identity bridge
        working-directory: formal/lean
        run: python3 scripts/check_graph_identity_bridge.py

      - name: Check bounded network species bridge
        working-directory: formal/lean
        run: python3 scripts/check_network_species_bridge.py

      - name: Check propensity counting bridge
        working-directory: formal/lean
        run: python3 scripts/check_propensity_counting_bridge.py

      - name: Check network reaction correspondence bridge
        working-directory: formal/lean
        run: PYTHONPATH=../.. python3 scripts/check_network_reaction_correspondence.py

      - name: Harness mutation self-test
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: formal/lean
        timeout-minutes: 20
        run: ./scripts/check_harness_itself.sh

  issue167-correspondence:
    name: Issue 167 propensity and ensemble mean checks
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: formal/lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: false

      - name: Kernel-build the Lean library
        working-directory: formal/lean
        run: lake build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools and locked runtime
        run: |
          set -euo pipefail
          which cmake ninja gcc g++ > /dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y build-essential cmake ninja-build
          }
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r provenance/ssts-ci-linux-py312.lock

      - name: Build native BNG3 extension
        run: |
          set -euo pipefail
          .venv/bin/python -m pip install --no-deps --no-build-isolation \
            --config-settings=build-dir=build .

      - name: Compare compiled propensities and ensemble means with independent laws
        env:
          BNG3_PYTHON_TEST_MODE: installed
        run: |
          .venv/bin/python -m pytest -q tests/validation/release/cases/issue-167/ \
            --junitxml="$RUNNER_TEMP/issue167-results.xml"

      - name: Record Issue 167 formal stochastic release acceptance
        run: |
          .venv/bin/python scripts/ci/record_issue167_release.py \
            --source-revision "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output "$RUNNER_TEMP/issue-167-release-report.json"

      - name: Run Issue 166 production lowering correspondence
        run: |
          set -euo pipefail
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DBUILD_TESTS=ON -DBUILD_CLI=ON
          cmake --build build --target bng3_nfnext_bng_lowering_bridge --parallel 2
          BNG3_ARCH_TESTS_DIR="$GITHUB_WORKSPACE/build/tests/architecture_contracts" \
            .venv/bin/python -m pytest -q tests/validation/release/cases/issue-166/ \
            --junitxml="$RUNNER_TEMP/issue166-results.xml"

      - name: Retain Issue 166 lowering correspondence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue166-lowering-correspondence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/issue166-results.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Record native graph bridge
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          [[ "$revision" == "$SOURCE_REVISION" ]]
          [[ -z "$(git status --porcelain --untracked-files=no)" ]]
          extension="$(.venv/bin/python -c 'import bionetgen._bionetgen_cpp as cpp; print(cpp.__file__)')"
          {
            printf 'Source revision %s\n' "$revision"
            printf 'Scope: named graph identity and NET species cases\n'
            sha256sum "$extension" formal/lean/lean-toolchain
            .venv/bin/python formal/lean/scripts/check_graph_identity_bridge.py --require-native
          } 2>&1 | tee "$RUNNER_TEMP/issue168-native-graph-bridge.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue168-native-graph-bridge-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/issue168-native-graph-bridge.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Record Issue 166 lowering correspondence release acceptance
        env:
          BNG3_ARCH_TESTS_DIR: ${{ github.workspace }}/build/tests/architecture_contracts
        run: |
          .venv/bin/python scripts/ci/record_issue166_release.py \
            --source-revision "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output "$RUNNER_TEMP/issue-166-release-report.json" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue166-lowering-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/issue-166-release-report.json
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue167-comparisons-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/issue167-results.xml
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue167-release-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/issue-167-release-report.json
          if-no-files-found: error
          retention-days: 30
