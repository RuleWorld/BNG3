name: Formatting patch

on:
  push:
    branches: [main, develop]
    paths:
      - "python/**"
      - "tests/python/**"
      - "scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "python/**"
      - "tests/python/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  formatting-patch:
    name: Check formatting and suggest patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install formatters
        run: pip install black ruff

      - name: Apply Black locally
        run: black --target-version py312 python/ tests/python/ scripts/

      - name: Apply safe Ruff fixes locally
        run: ruff check --fix-only python/ tests/python/ scripts/

      - name: Create formatting patch
        id: patch
        run: |
          if git diff --quiet; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            git diff --binary > formatting.patch
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload formatting patch
        if: steps.patch.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: formatting-patch
          path: formatting.patch

      - name: Verify formatting
        run: |
          if ! git diff --quiet; then
            echo "Formatting changes are required. Download the formatting-patch artifact or run:"
            echo "  black --target-version py312 python/ tests/python/ scripts/"
            echo "  ruff check --fix python/ tests/python/ scripts/"
            exit 1
          fi
          black --check --target-version py312 python/ tests/python/ scripts/
          ruff check python/ tests/python/ scripts/
