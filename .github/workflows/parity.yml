name: Cross-tool parity

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

concurrency:
  # Preserve the evidence for each exact PR head.  A later documentation push
  # must not cancel a semantic parity run for the preceding head.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CMAKE_BUILD_TYPE: Release
  CTEST_OUTPUT_ON_FAILURE: 1
  BNG3_CI_STRICT_ORACLES: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  oracle-lock:
    name: Validate parity source lock
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI contract dependencies
        run: python -m pip install pytest numpy pyyaml

      - name: Validate locked sources
        run: python scripts/ci/checkout_oracle.py --validate-only

      - name: Validate provenance structure
        run: python scripts/validate_provenance.py

      - name: Run CI contract tests
        run: |
          python -m pytest \
            tests/test_ci_contract.py \
            tests/validation/test_harness_paths.py::test_required_oracle_fails_in_strict_ci \
            tests/validation/test_harness_paths.py::test_api_fixture_fails_in_strict_ci_and_skips_locally \
            -q -ra

  bng2-parity:
    name: BNG3 numerical, expression and export parity
    needs: oracle-lock
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      BNG3_PYTHON_TEST_MODE: installed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and comparison dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build perl
          python -m venv .venv
          .venv/bin/python -m pip install scikit-build-core pybind11 pytest numpy

      - name: Checkout locked BioNetGen oracle
        run: |
          python scripts/ci/checkout_oracle.py \
            --name bionetgen \
            --destination "$RUNNER_TEMP/oracle-bionetgen" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Build locked BNG2 Network3 oracle
        shell: bash
        run: |
          set -euo pipefail
          network3="$RUNNER_TEMP/oracle-bionetgen/bng2/Network3"
          make -C "$network3" -f Makefile.cmake
          run_network="$RUNNER_TEMP/oracle-bionetgen/bng2/bin/run_network"
          test -x "$run_network"
          echo "$(dirname "$run_network")" >> "$GITHUB_PATH"
          digest=$(sha256sum "$run_network" | cut -d ' ' -f 1)
          source_revision=$(.venv/bin/python -c 'import json; print(json.load(open("provenance/upstreams.lock.yml", encoding="utf-8"))["sources"]["bionetgen"]["revision"])')
          {
            echo "### BNG2 Network3 oracle build"
            echo ""
            echo "- Locked source revision: $source_revision"
            echo "- Linux run_network SHA-256: $digest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install BNG3 package, native extension and CLI in one build
        run: |
          .venv/bin/python -m pip install --no-build-isolation \
            --config-settings=build-dir=build \
            --config-settings=cmake.define.BUILD_CLI=ON \
            ".[full,dev]"
        env:
          CMAKE_ARGS: "-DBUILD_CLI=ON -DBUILD_NFSIM_CLI=OFF -DBUILD_TESTS=OFF"

      - name: Verify installed BNG3 package and native identity
        id: bng3_identity
        run: |
          set -euo pipefail
          test -x build/cpp/bng_cpp
          .venv/bin/python scripts/ci/check_python_package_identity.py \
            --source-revision "$BNG3_SOURCE_REVISION" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "bng_cpp SHA-256: $(sha256sum build/cpp/bng_cpp | cut -d ' ' -f 1)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          BNG3_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify spawned API worker uses the installed package
        id: bng3_worker_identity
        run: |
          .venv/bin/python -m pytest -c tests/validation/pytest.ini \
            tests/validation/test_worker_package_identity.py -q -ra

      - name: Compare graph-aware networks against BNG2
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python scripts/cross_validate.py \
            --bng-cpp build/cpp/bng_cpp \
            --bng-perl "$RUNNER_TEMP/oracle-bionetgen/bng2/BNG2.pl" \
            --models-dir "$RUNNER_TEMP/oracle-bionetgen/bng2/Validate" \
            --model simple_system \
            --model test_assignment \
            --model test_compartment_XML \
            --model test_time \
            --model test_tfun_observable \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --verbose
        env:
          BNG2_PERL: ${{ runner.temp }}/oracle-bionetgen/bng2/BNG2.pl
          BNGPATH: ${{ runner.temp }}/oracle-bionetgen/bng2
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run required RHS, ODE, stochastic-determinism and export parity
        id: numerical_expression_export_parity
        shell: bash
        env:
          BNG2_PERL: ${{ runner.temp }}/oracle-bionetgen/bng2/BNG2.pl
          BNGPATH: ${{ runner.temp }}/oracle-bionetgen/bng2
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -c tests/validation/pytest.ini \
            tests/validation/test_parity_rhs.py \
            tests/validation/test_parity_ode.py \
            tests/validation/test_parity_stochastic.py \
            tests/validation/test_export_formats.py \
            -m "not slow" \
            --bng-cpp build/cpp/bng_cpp \
            -q -ra \
            --junitxml="$RUNNER_TEMP/issue182-required-parity.xml"

      - name: Run frozen 200-member SSA ensemble parity (scheduled)
        id: ssa_ensemble_parity
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -c tests/validation/pytest.ini \
            tests/validation/test_parity_stochastic.py \
            -m "stochastic and slow" \
            --bng-cpp build/cpp/bng_cpp \
            -q -ra \
            --junitxml="$RUNNER_TEMP/issue182-ssa-ensemble.xml"
        env:
          BNG_ENSEMBLE_WORKERS: "2"

      - name: Upload Issue 182 parity test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue182-parity-${{ github.event_name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/issue182-*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Report Issue 182 executed scope and skips
        id: report_issue182_scope
        if: always()
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUIRED_OUTCOME: ${{ steps.numerical_expression_export_parity.outcome }}
          ENSEMBLE_OUTCOME: ${{ steps.ssa_ensemble_parity.outcome }}
          IDENTITY_OUTCOME: ${{ steps.bng3_identity.outcome }}
          WORKER_OUTCOME: ${{ steps.bng3_worker_identity.outcome }}
          REQUIRED_REPORT: ${{ runner.temp }}/issue182-required-parity.xml
          ENSEMBLE_REPORT: ${{ runner.temp }}/issue182-ssa-ensemble.xml
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          def counts(path_text):
              path = Path(path_text)
              if not path.is_file():
                  return None
              root = ElementTree.parse(path).getroot()
              cases = list(root.iter("testcase"))
              values = {
                  "tests": len(cases),
                  "failures": sum(case.find("failure") is not None for case in cases),
                  "errors": sum(case.find("error") is not None for case in cases),
                  "skipped": sum(case.find("skipped") is not None for case in cases),
              }
              values["passed"] = max(
                  values["tests"] - values["failures"] - values["errors"] - values["skipped"],
                  0,
              )
              return values

          rows = []
          for label, outcome_key, report_key in (
              ("Required RHS/ODE/SSA-determinism/export modules", "REQUIRED_OUTCOME", "REQUIRED_REPORT"),
              ("Scheduled 200-member SSA ensembles", "ENSEMBLE_OUTCOME", "ENSEMBLE_REPORT"),
          ):
              outcome = os.environ[outcome_key]
              result = counts(os.environ[report_key])
              if result is None:
                  detail = "report not produced"
              else:
                  detail = "{tests} total; {passed} passed; {failures} failed; {errors} errors; {skipped} skipped".format(**result)
              rows.append((label, outcome, detail))

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("### Issue 182 parity scope and result counts\n\n")
              summary.write(f"- Exact BNG3 candidate revision: {os.environ['BNG3_SOURCE_REVISION']}\n")
              summary.write(f"- Installed package identity: {os.environ['IDENTITY_OUTCOME']}; spawned worker identity: {os.environ['WORKER_OUTCOME']}.\n")
              summary.write('- Per-PR required modules: RHS, ODE, SSA determinism, and export (`-m "not slow"`).\n')
              summary.write('- Scheduled/manual-only: the unchanged 200-member SSA ensemble for `gene_expr`, `michment`, and `simple_system`. No additional model-name filter is applied; missing required engines/oracles fail under strict mode.\n\n')
              summary.write("| Lane | Step outcome | Pytest counts |\n| --- | --- | --- |\n")
              for label, outcome, detail in rows:
                  summary.write(f"| {label} | {outcome} | {detail} |\n")
              summary.write("\n`pytest -ra` records individual skip reasons in the log; JUnit reports are attached as an Issue 182 workflow artifact.\n")

  nfsim-parity:
    name: BNG3 vs independent NFsim
    needs: oracle-lock
    runs-on: ubuntu-22.04
    env:
      BNG3_PYTHON_TEST_MODE: installed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          python -m pip install pytest numpy scipy

      - name: Checkout locked NFsim oracle
        run: |
          python scripts/ci/checkout_oracle.py \
            --name nfsim \
            --destination "$RUNNER_TEMP/oracle-nfsim" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Build independent NFsim oracle
        run: |
          cmake -S "$RUNNER_TEMP/oracle-nfsim" \
            -B "$RUNNER_TEMP/oracle-nfsim/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DNFSIM_BUILD_EXECUTABLE=ON \
            -DNFSIM_BUILD_LIBRARY=OFF
          cmake --build "$RUNNER_TEMP/oracle-nfsim/build" --target NFsim --parallel 2

      - name: Install BNG3 Python API as a regular package
        run: |
          python -m pip install scikit-build-core pybind11
          python -m pip install ".[full,dev]"
        env:
          CMAKE_ARGS: "-DBUILD_TESTS=OFF -DBUILD_CLI=OFF -DBUILD_NFSIM_CLI=OFF"

      - name: Report installed BNG3 package and native identities
        run: |
          python scripts/ci/check_python_package_identity.py \
            --source-revision "$BNG3_SOURCE_REVISION" \
            | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          BNG3_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify spawned API worker identity
        run: |
          pytest -c tests/validation/pytest.ini \
            tests/validation/test_worker_package_identity.py -q

      - name: Run direct/XML NFsim construction checks
        shell: bash
        run: |
          set -euo pipefail
          NFSIM_BIN="$RUNNER_TEMP/oracle-nfsim/build/NFsim" \
            pytest -c tests/validation/pytest.ini \
              tests/validation/test_parity_nfsim.py \
              -m "nf and not slow" \
              -q

      - name: Run NFsim seed-state parity contracts
        shell: bash
        run: |
          set -euo pipefail
          NFSIM_BIN="$RUNNER_TEMP/oracle-nfsim/build/NFsim" \
            pytest -c tests/validation/pytest.ini \
              tests/validation/test_parity_nfsim_seed.py \
              -q

      - name: Run fixed-seed native NFsim parity
        shell: bash
        run: |
          set -euo pipefail
          NFSIM_BIN="$RUNNER_TEMP/oracle-nfsim/build/NFsim" \
            BNG_ENSEMBLE_WORKERS=2 \
            pytest -c tests/validation/pytest.ini \
              tests/validation/test_parity_nfsim.py \
              -k "test_nf_vs_native and simple_system" \
              -q
          NFSIM_BIN="$RUNNER_TEMP/oracle-nfsim/build/NFsim" \
            pytest -c tests/validation/pytest.ini \
              tests/validation/test_parity_nfsim.py \
              -k "test_nf_fixed_seed_direct_matches_native_at_final_endpoint" \
              -q
          NFSIM_DIGEST=$(sha256sum "$RUNNER_TEMP/oracle-nfsim/build/NFsim" | cut -d ' ' -f 1)
          {
            echo "### Native NFsim parity"
            echo ""
            echo "- BNG3 source revision: \`${BNG3_SOURCE_REVISION}\`"
            echo "- NFsim oracle SHA-256: \`${NFSIM_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

  nfsim-source-validation:
    name: NFsim historical validation (scheduled)
    needs: oracle-lock
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NFsim validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          python -m pip install numpy scipy seaborn

      - name: Checkout locked NFsim source
        run: |
          python scripts/ci/checkout_oracle.py \
            --name nfsim \
            --destination "$RUNNER_TEMP/oracle-nfsim" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Build independent NFsim executable
        run: |
          cmake -S "$RUNNER_TEMP/oracle-nfsim" \
            -B "$RUNNER_TEMP/oracle-nfsim/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DNFSIM_BUILD_EXECUTABLE=ON \
            -DNFSIM_BUILD_LIBRARY=OFF
          cmake --build "$RUNNER_TEMP/oracle-nfsim/build" --target NFsim --parallel 2

      - name: Install BNG3 package used by the historical validator
        run: |
          python -m pip install scikit-build-core pybind11
          python -m pip install -e ".[full,dev]"
        env:
          CMAKE_ARGS: "-DBUILD_TESTS=OFF -DBUILD_CLI=OFF -DBUILD_NFSIM_CLI=OFF"

      - name: Run the source NFsim validation framework
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/oracle-nfsim/validate/validate.py" \
            "$RUNNER_TEMP/oracle-nfsim/validate"

  pybionetgen-compat:
    name: PyBioNetGen API compatibility
    needs: oracle-lock
    runs-on: ubuntu-22.04
    env:
      BNG3_PYTHON_TEST_MODE: installed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install BNG3 compatibility dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          python -m pip install scikit-build-core pybind11 pytest numpy
          python -m pip install ".[full,dev]"
        env:
          CMAKE_ARGS: "-DBUILD_TESTS=OFF -DBUILD_CLI=OFF -DBUILD_NFSIM_CLI=OFF"

      - name: Checkout locked PyBioNetGen source
        run: |
          python scripts/ci/checkout_oracle.py \
            --name pybionetgen \
            --destination "$RUNNER_TEMP/oracle-pybionetgen" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Run source-derived compatibility contracts
        run: |
          set -euo pipefail
          python scripts/ci/check_pybionetgen_compat.py \
            --source-root "$RUNNER_TEMP/oracle-pybionetgen" \
            --summary-file "$GITHUB_STEP_SUMMARY"
        env:
          MPLBACKEND: Agg
          SYMPY_USE_GMPY: "0"
          BNG3_SOURCE_REVISION: ${{ github.sha }}
          BNG3_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
