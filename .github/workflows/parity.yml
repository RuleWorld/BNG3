name: Cross-tool parity

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      bounded:
        description: Use the finite PR scientific selection instead of the scheduled matrix
        required: false
        type: boolean
        default: false

concurrency:
  # Replace superseded PR work; isolate every manual/scheduled/main run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: read

env:
  CMAKE_BUILD_TYPE: Release
  CTEST_OUTPUT_ON_FAILURE: 1
  BNG3_CI_STRICT_ORACLES: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  oracle-lock:
    name: Validate parity source lock
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI contract dependencies
        run: python -m pip install pytest numpy pyyaml scipy jsonschema python-libsbml sympy

      - name: Validate locked sources
        run: python scripts/ci/checkout_oracle.py --validate-only

      - name: Validate provenance structure
        run: python scripts/validate_provenance.py

      - name: Run CI contract tests
        run: |
          python -m pytest \
            tests/test_ci_contract.py \
            tests/validation/test_parity_workflow_wiring.py \
            tests/validation/test_integrated_wiring.py \
            tests/validation/test_integrated.py \
            tests/validation/test_integrated_traces.py \
            tests/validation/test_integrated_cases.py \
            tests/validation/test_integrated_matrix.py \
            tests/validation/test_integrated_consumers.py \
            tests/validation/test_issue_queue.py \
            tests/validation/test_acceptance_queue.py \
            tests/validation/test_reporting.py \
            tests/validation/test_triage.py \
            tests/validation/test_replay.py \
            tests/validation/test_minimize.py \
            tests/validation/test_bngir_adversarial.py \
            tests/validation/test_integrated_boundaries.py \
            tests/validation/test_integrated_protocol.py \
            tests/validation/test_integrated_marginals.py \
            tests/validation/test_integrated_extensions.py \
            tests/validation/test_graph_identity.py \
            tests/validation/test_nfsim_sweep_gate.py \
            tests/validation/test_harness_paths.py::test_required_oracle_fails_in_strict_ci \
            tests/validation/test_harness_paths.py::test_api_fixture_fails_in_strict_ci_and_skips_locally \
            -q -ra

      - name: Run Issue 160 diagnostic controls (not capability acceptance)
        env:
          PYTHONPATH: python:.
        run: >-
          python -m pytest -q
          --confcutdir=tests/validation/release/cases/issue-160
          tests/validation/release/cases/issue-160/test_sbml_semantic_families.py

  bng2-parity:
    name: BNG3 numerical, expression and export parity
    needs: oracle-lock
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      BNG3_PYTHON_TEST_MODE: installed
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and comparison dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build perl
          python -m venv .venv
          .venv/bin/python -m pip install scikit-build-core pybind11 pytest numpy scipy

      - name: Checkout locked BioNetGen oracle
        run: |
          python scripts/ci/checkout_oracle.py \
            --name bionetgen \
            --destination "$RUNNER_TEMP/oracle-bionetgen" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Build locked BNG2 Network3 oracle
        shell: bash
        run: |
          set -euo pipefail
          network3="$RUNNER_TEMP/oracle-bionetgen/bng2/Network3"
          make -C "$network3" -f Makefile.cmake
          run_network="$RUNNER_TEMP/oracle-bionetgen/bng2/bin/run_network"
          test -x "$run_network"
          echo "$(dirname "$run_network")" >> "$GITHUB_PATH"
          digest=$(sha256sum "$run_network" | cut -d ' ' -f 1)
          source_revision=$(.venv/bin/python -c 'import json; print(json.load(open("provenance/upstreams.lock.yml", encoding="utf-8"))["sources"]["bionetgen"]["revision"])')
          {
            echo "### BNG2 Network3 oracle build"
            echo ""
            echo "- Locked source revision: $source_revision"
            echo "- Linux run_network SHA-256: $digest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout and build locked native NFsim oracle
        run: |
          set -euo pipefail
          python scripts/ci/checkout_oracle.py \
            --name nfsim \
            --destination "$RUNNER_TEMP/oracle-nfsim" \
            --summary-file "$GITHUB_STEP_SUMMARY"
          cmake -S "$RUNNER_TEMP/oracle-nfsim" \
            -B "$RUNNER_TEMP/oracle-nfsim/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DNFSIM_BUILD_EXECUTABLE=ON \
            -DNFSIM_BUILD_LIBRARY=OFF
          cmake --build "$RUNNER_TEMP/oracle-nfsim/build" --target NFsim --parallel 2
          nfsim="$RUNNER_TEMP/oracle-nfsim/build/NFsim"
          test -x "$nfsim"
          digest=$(sha256sum "$nfsim" | cut -d ' ' -f 1)
          echo "NFSIM_BIN=$nfsim" >> "$GITHUB_ENV"
          echo "- Conformance lane native NFsim SHA-256: $digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Install BNG3 package, native extension and CLI in one build
        run: |
          .venv/bin/python -m pip install --no-build-isolation \
            --config-settings=build-dir=build \
            --config-settings=cmake.define.BUILD_CLI=ON \
            ".[full,dev]"
        env:
          CMAKE_ARGS: "-DBUILD_CLI=ON -DBUILD_NFSIM_CLI=OFF -DBUILD_TESTS=OFF"

      - name: Verify installed BNG3 package and native identity
        id: bng3_identity
        run: |
          set -euo pipefail
          test -x build/cpp/bng_cpp
          .venv/bin/python scripts/ci/check_python_package_identity.py \
            --source-revision "$BNG3_SOURCE_REVISION" \
            --require-source-head \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "bng_cpp SHA-256: $(sha256sum build/cpp/bng_cpp | cut -d ' ' -f 1)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          BNG3_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify spawned API worker uses the installed package
        id: bng3_worker_identity
        run: |
          .venv/bin/python -m pytest -c tests/validation/pytest.ini \
            tests/validation/test_worker_package_identity.py -q -ra

      - name: Snapshot backlog metadata for issue evidence coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 10000 \
            --json number,title,state,url > "$RUNNER_TEMP/bng3-issues.tmp"; then
            mv "$RUNNER_TEMP/bng3-issues.tmp" "$RUNNER_TEMP/bng3-issues.json"
          else
            rm -f "$RUNNER_TEMP/bng3-issues.tmp"
            echo 'Backlog metadata query failed; semantic gates will still execute with mapped-only issue coverage.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish capability-linked bounded conformance evidence
        shell: bash
        run: |
          issue_args=()
          if [[ -s "$RUNNER_TEMP/bng3-issues.json" ]]; then
            issue_args=(--issues-json "$RUNNER_TEMP/bng3-issues.json")
          else
            echo 'Backlog snapshot unavailable; issue evidence scope is mapped-only.' >> "$GITHUB_STEP_SUMMARY"
          fi
          corpus_tier=s
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            corpus_tier=p
          fi
          .venv/bin/python scripts/validate.py --tier smoke \
            "${issue_args[@]}" \
            --corpus-tier "$corpus_tier" --report-only --simulate --net-reload \
            --bng-cpp build/cpp/bng_cpp \
            --bng2-root "$RUNNER_TEMP/oracle-bionetgen" \
            --bng2-network-sha256 "$(sha256sum "$RUNNER_TEMP/oracle-bionetgen/bng2/bin/run_network" | cut -d ' ' -f 1)" \
            --report-dir "$RUNNER_TEMP/bng3-conformance"

      - name: Summarize named conformance failures and investigation packets
        if: always()
        run: |
          .venv/bin/python -m tests.validation.ci_report \
            "$RUNNER_TEMP/bng3-conformance/report.json" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --revision "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Restore previous main conformance observations
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/triage-conformance-history
          key: triage-conformance-main-${{ github.sha }}
          restore-keys: triage-conformance-main-

      - name: Bounded named-check replay and portable conformance repair tasks
        if: always()
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/bng3-conformance"
          test -s "$evidence/report.json"
          python -m tests.validation.replay "$evidence/report.json" \
            --execute --output "$evidence/replays" --max-cases 2 --runs 1 --timeout 40 --budget 90
          args=()
          if [[ -f "$RUNNER_TEMP/triage-conformance-history/ledger.json" ]]; then
            args+=(--previous "$RUNNER_TEMP/triage-conformance-history/ledger.json")
          fi
          shopt -s nullglob
          for report in "$evidence"/replays/replicate-*.json; do
            args+=(--replicate "$report")
          done
          python -m tests.validation.triage "$evidence/report.json" \
            --output "$evidence/triage" "${args[@]}"
          cat "$evidence/triage/summary.md" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/triage-conformance-history"
          cp "$evidence/triage/ledger.json" "$RUNNER_TEMP/triage-conformance-history/ledger.json"

      - name: Retain main conformance observation history
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/triage-conformance-history
          key: triage-conformance-main-${{ github.sha }}

      - name: Upload conformance diagnostics and inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bng3-conformance-${{ github.event_name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bng3-conformance/
          if-no-files-found: warn
          retention-days: 30

      - name: Check constant and dynamic assignment-rate contracts
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -c tests/validation/pytest.ini \
            tests/validation/test_assignment_rate_parity.py \
            --bng-cpp build/cpp/bng_cpp -q -ra
        env:
          BNG2_PERL: ${{ runner.temp }}/oracle-bionetgen/bng2/BNG2.pl
          BNGPATH: ${{ runner.temp }}/oracle-bionetgen/bng2

      - name: Check hybrid child-rule refinement against pinned BNG2
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -c tests/validation/pytest.ini \
            tests/validation/test_hybrid_child_rule_parity.py \
            --bng-cpp build/cpp/bng_cpp -q -ra
        env:
          BNG2_PERL: ${{ runner.temp }}/oracle-bionetgen/bng2/BNG2.pl
          BNGPATH: ${{ runner.temp }}/oracle-bionetgen/bng2
          BNG3_CI_STRICT_ORACLES: "1"

      - name: Compare graph-aware networks against BNG2
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python scripts/cross_validate.py \
            --bng-cpp build/cpp/bng_cpp \
            --bng-perl "$RUNNER_TEMP/oracle-bionetgen/bng2/BNG2.pl" \
            --models-dir tests/validation/Validate \
            --model simple_system \
            --model test_assignment \
            --model test_compartment_XML \
            --model test_time \
            --model test_tfun_observable \
            --model ANx \
            --model hybrid_test \
            --model test_write_sbml_multi \
            --artifact-dir "$RUNNER_TEMP/bng3-authored-xml" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --verbose
        env:
          BNG2_PERL: ${{ runner.temp }}/oracle-bionetgen/bng2/BNG2.pl
          BNGPATH: ${{ runner.temp }}/oracle-bionetgen/bng2
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload authored XML parity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bng3-authored-xml-${{ github.event_name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bng3-authored-xml/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run required RHS, ODE, stochastic-determinism and export parity
        id: numerical_expression_export_parity
        shell: bash
        env:
          BNG2_PERL: ${{ runner.temp }}/oracle-bionetgen/bng2/BNG2.pl
          BNGPATH: ${{ runner.temp }}/oracle-bionetgen/bng2
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -c tests/validation/pytest.ini \
            tests/validation/test_parity_rhs.py \
            tests/validation/test_parity_ode.py \
            tests/validation/test_parity_stochastic.py \
            tests/validation/test_export_formats.py \
            tests/validation/test_ssa_functional_rates.py \
            -m "not slow" \
            --bng-cpp build/cpp/bng_cpp \
            -q -ra \
            --junitxml="$RUNNER_TEMP/issue182-required-parity.xml"

      - name: Check compiled unary state changes against pinned BNG2
        shell: bash
        env:
          BNG2_PERL: ${{ runner.temp }}/oracle-bionetgen/bng2/BNG2.pl
          BNGPATH: ${{ runner.temp }}/oracle-bionetgen/bng2
          BNG3_CI_STRICT_ORACLES: "1"
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -c tests/validation/pytest.ini \
            tests/validation/sprint_s3_unary.py \
            -o 'python_files=sprint_s3_*.py' \
            --bng-cpp build/cpp/bng_cpp \
            -q -ra \
            --junitxml="$RUNNER_TEMP/sprint-s3-unary.xml"

      - name: Run live pinned 200-member SSA ensemble parity (scheduled)
        id: ssa_ensemble_parity
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -c tests/validation/pytest.ini \
            tests/validation/test_parity_stochastic.py \
            -m "stochastic and slow" \
            --bng-cpp build/cpp/bng_cpp \
            -q -ra \
            --basetemp="$RUNNER_TEMP/ssa-live-ensembles" \
            --junitxml="$RUNNER_TEMP/issue182-ssa-ensemble.xml"
        env:
          BNG_ENSEMBLE_WORKERS: "2"
          BNG3_LIVE_SSA_ENSEMBLES: "1"
          BNG2_PERL: ${{ runner.temp }}/oracle-bionetgen/bng2/BNG2.pl
          BNGPATH: ${{ runner.temp }}/oracle-bionetgen/bng2

      - name: Upload Issue 182 parity test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue182-parity-${{ github.event_name }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/issue182-*.xml
            ${{ runner.temp }}/ssa-live-ensembles
          if-no-files-found: warn
          retention-days: 14

      - name: Report Issue 182 executed scope and skips
        id: report_issue182_scope
        if: always()
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUIRED_OUTCOME: ${{ steps.numerical_expression_export_parity.outcome }}
          ENSEMBLE_OUTCOME: ${{ steps.ssa_ensemble_parity.outcome }}
          IDENTITY_OUTCOME: ${{ steps.bng3_identity.outcome }}
          WORKER_OUTCOME: ${{ steps.bng3_worker_identity.outcome }}
          REQUIRED_REPORT: ${{ runner.temp }}/issue182-required-parity.xml
          ENSEMBLE_REPORT: ${{ runner.temp }}/issue182-ssa-ensemble.xml
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          def counts(path_text):
              path = Path(path_text)
              if not path.is_file():
                  return None
              root = ElementTree.parse(path).getroot()
              cases = list(root.iter("testcase"))
              values = {
                  "tests": len(cases),
                  "failures": sum(case.find("failure") is not None for case in cases),
                  "errors": sum(case.find("error") is not None for case in cases),
                  "skipped": sum(case.find("skipped") is not None for case in cases),
              }
              values["passed"] = max(
                  values["tests"] - values["failures"] - values["errors"] - values["skipped"],
                  0,
              )
              return values

          rows = []
          for label, outcome_key, report_key in (
              ("Required RHS/ODE/SSA-determinism/export modules", "REQUIRED_OUTCOME", "REQUIRED_REPORT"),
              ("Scheduled live 200-member SSA ensembles", "ENSEMBLE_OUTCOME", "ENSEMBLE_REPORT"),
          ):
              outcome = os.environ[outcome_key]
              result = counts(os.environ[report_key])
              if result is None:
                  detail = "report not produced"
              else:
                  detail = "{tests} total; {passed} passed; {failures} failed; {errors} errors; {skipped} skipped".format(**result)
              rows.append((label, outcome, detail))

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("### Issue 182 parity scope and result counts\n\n")
              summary.write(f"- Exact BNG3 candidate revision: {os.environ['BNG3_SOURCE_REVISION']}\n")
              summary.write(f"- Installed package identity: {os.environ['IDENTITY_OUTCOME']}; spawned worker identity: {os.environ['WORKER_OUTCOME']}.\n")
              summary.write('- Per-PR required modules: RHS, ODE, SSA determinism, and export (`-m "not slow"`).\n')
              summary.write('- Scheduled/manual-only: live pinned BNG2 200-member SSA ensembles with deterministic spread seeds for `gene_expr`, `michment`, and `simple_system`. No additional model-name filter is applied; missing required engines/oracles fail under strict mode.\n\n')
              summary.write("| Lane | Step outcome | Pytest counts |\n| --- | --- | --- |\n")
              for label, outcome, detail in rows:
                  summary.write(f"| {label} | {outcome} | {detail} |\n")
              summary.write("\n`pytest -ra` records individual skip reasons in the log; JUnit reports are attached as an Issue 182 workflow artifact.\n")

  integrated-semantic-validation:
    name: Integrated semantic validation (Atomizer, BNG3, BNG2, PyBioNetGen, NFsim)
    needs: oracle-lock
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      BNG3_PYTHON_TEST_MODE: installed
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot bounded GitHub issue backlog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 1000 \
            --json number,title,state,body,updatedAt > "$RUNNER_TEMP/bng3-issues.json"

      - name: Install native build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build perl
          python -m pip install scikit-build-core pybind11 pytest numpy scipy pyyaml python-libsbml libroadrunner

      - name: Checkout locked BioNetGen oracle
        run: |
          python scripts/ci/checkout_oracle.py \
            --name bionetgen \
            --destination "$RUNNER_TEMP/oracle-bionetgen" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Build locked BNG2 Network3 oracle
        run: |
          set -euo pipefail
          network3="$RUNNER_TEMP/oracle-bionetgen/bng2/Network3"
          make -C "$network3" -f Makefile.cmake
          run_network="$RUNNER_TEMP/oracle-bionetgen/bng2/bin/run_network"
          test -x "$run_network"
          digest=$(sha256sum "$run_network" | cut -d ' ' -f 1)
          echo "BNG2_NETWORK_SHA256=$digest" >> "$GITHUB_ENV"
          echo "- Integrated lane BNG2 Network3 SHA-256: $digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout and build locked native NFsim oracle
        run: |
          set -euo pipefail
          python scripts/ci/checkout_oracle.py \
            --name nfsim \
            --destination "$RUNNER_TEMP/oracle-nfsim" \
            --summary-file "$GITHUB_STEP_SUMMARY"
          cmake -S "$RUNNER_TEMP/oracle-nfsim" \
            -B "$RUNNER_TEMP/oracle-nfsim/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DNFSIM_BUILD_EXECUTABLE=ON \
            -DNFSIM_BUILD_LIBRARY=OFF
          cmake --build "$RUNNER_TEMP/oracle-nfsim/build" --target NFsim --parallel 2
          nfsim="$RUNNER_TEMP/oracle-nfsim/build/NFsim"
          test -x "$nfsim"
          digest=$(sha256sum "$nfsim" | cut -d ' ' -f 1)
          echo "NFSIM_SHA256=$digest" >> "$GITHUB_ENV"
          echo "- Integrated lane native NFsim SHA-256: $digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout locked PyBioNetGen source
        run: |
          python scripts/ci/checkout_oracle.py \
            --name pybionetgen \
            --destination "$RUNNER_TEMP/oracle-pybionetgen" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Create isolated upstream PyBioNetGen interpreter
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pybionetgen-venv"
          "$RUNNER_TEMP/pybionetgen-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/pybionetgen-venv/bin/python" -m pip install -r \
            "$RUNNER_TEMP/oracle-pybionetgen/requirements.txt"
          echo "PYBIONETGEN_PYTHON=$RUNNER_TEMP/pybionetgen-venv/bin/python" >> "$GITHUB_ENV"

      - name: Install BNG3 CLI and full Python package
        id: candidate_install
        run: |
          python -m pip install --no-build-isolation \
            --config-settings=build-dir=build \
            --config-settings=cmake.define.BUILD_CLI=ON \
            ".[full,dev]"
        env:
          CMAKE_ARGS: "-DBUILD_CLI=ON -DBUILD_NFSIM_CLI=OFF -DBUILD_TESTS=OFF"

      - name: Verify installed BNG3 package identity
        id: candidate_identity
        run: |
          python scripts/ci/check_python_package_identity.py \
            --source-revision "$BNG3_SOURCE_REVISION" \
            --require-source-head \
            | tee -a "$GITHUB_STEP_SUMMARY"
          test -x build/cpp/bng_cpp
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          BNG3_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify spawned scientific worker identity
        if: always() && steps.candidate_identity.outcome == 'success'
        run: python -m pytest -c tests/validation/pytest.ini tests/validation/test_worker_package_identity.py -q

      - name: Run integrated cross-component cases
        id: integrated_cases
        run: |
          set -euo pipefail
          full_args=()
          if [[ "${{ github.event_name }}" == "schedule" || ( "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.bounded }}" != "true" ) ]]; then
            full_args=(--full)
          fi
          python -m tests.validation.integrated \
            --bng-cpp build/cpp/bng_cpp \
            --bng2-root "$RUNNER_TEMP/oracle-bionetgen" \
            --bng2-network-sha256 "$BNG2_NETWORK_SHA256" \
            --nfsim-root "$RUNNER_TEMP/oracle-nfsim" \
            --nfsim-binary "$RUNNER_TEMP/oracle-nfsim/build/NFsim" \
            --nfsim-sha256 "$NFSIM_SHA256" \
            --pybionetgen-root "$RUNNER_TEMP/oracle-pybionetgen" \
            --pybionetgen-python "$PYBIONETGEN_PYTHON" \
            --report-dir "$RUNNER_TEMP/bng3-integrated-validation" \
            "${full_args[@]}"

      - name: Check independently authored native BNGIR controls
        if: always() && steps.candidate_identity.outcome == 'success'
        run: python -m pytest tests/validation/test_bngir_adversarial_native.py -q

      - name: Audit generated consumer matrix receipts
        if: always()
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/bng3-integrated-validation/report.json"
          python -m tests.validation.integrated_matrix \
            --report "$RUNNER_TEMP/bng3-integrated-validation/report.json" \
            --output "$RUNNER_TEMP/bng3-integrated-validation/matrix-report.json" \
            --revision "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Summarize integrated findings for the exact candidate
        if: always()
        run: |
          python -m tests.validation.ci_report \
            "$RUNNER_TEMP/bng3-integrated-validation/report.json" \
            --strict --summary "$GITHUB_STEP_SUMMARY" \
            --revision "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Build exact-revision issue and provenance evidence queue
        if: always()
        run: |
          head_args=()
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            head_args=(--collect-upstream-heads)
          fi
          python -m tests.validation.issue_queue \
            --issues-json "$RUNNER_TEMP/bng3-issues.json" \
            --report "$RUNNER_TEMP/bng3-integrated-validation/report.json" \
            --report "$RUNNER_TEMP/bng3-integrated-validation/matrix-report.json" \
            --revision "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output-dir "$RUNNER_TEMP/bng3-issue-queue" "${head_args[@]}"
          cat "$RUNNER_TEMP/bng3-issue-queue/issue-queue.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload issue queue and provenance observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bng3-issue-queue-${{ github.event_name }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bng3-issue-queue/
            ${{ runner.temp }}/bng3-issues.json
          if-no-files-found: warn
          retention-days: 30

      - name: Restore previous main integrated-validation observations
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/triage-integrated-validation-history
          key: triage-integrated-validation-main-${{ github.sha }}
          restore-keys: triage-integrated-validation-main-

      - name: Bounded named-check replay and portable integrated-validation repair tasks
        if: always()
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/bng3-integrated-validation"
          test -s "$evidence/report.json"
          python -m tests.validation.replay "$evidence/report.json" \
            --execute --output "$evidence/replays" --max-cases 2 --runs 1 --timeout 40 --budget 90
          args=()
          if [[ -f "$RUNNER_TEMP/triage-integrated-validation-history/ledger.json" ]]; then
            args+=(--previous "$RUNNER_TEMP/triage-integrated-validation-history/ledger.json")
          fi
          shopt -s nullglob
          for report in "$evidence"/replays/replicate-*.json; do
            args+=(--replicate "$report")
          done
          python -m tests.validation.triage "$evidence/report.json" \
            --output "$evidence/triage" "${args[@]}" --issues-json "$RUNNER_TEMP/bng3-issues.json" \
            --obligations-json "$RUNNER_TEMP/bng3-issue-queue/obligation-assessment.json"
          cat "$evidence/triage/summary.md" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/triage-integrated-validation-history"
          cp "$evidence/triage/ledger.json" "$RUNNER_TEMP/triage-integrated-validation-history/ledger.json"

      - name: Retain main integrated-validation observation history
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/triage-integrated-validation-history
          key: triage-integrated-validation-main-${{ github.sha }}

      - name: Upload integrated reports and replay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bng3-integrated-validation-${{ github.event_name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bng3-integrated-validation/
          if-no-files-found: warn
          retention-days: 30

  conformance-findings:
    name: Conformance findings (network, cdat, gdat)
    needs: bng2-parity
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: bng3-conformance-${{ github.event_name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bng3-conformance
      - name: Require every selected applicable diagnostic contract
        run: |
          python -m tests.validation.ci_report \
            "$RUNNER_TEMP/bng3-conformance/report.json" \
            --strict --summary "$GITHUB_STEP_SUMMARY" \
            --revision "${{ github.event.pull_request.head.sha || github.sha }}"

  nfsim-parity:
    name: BNG3 vs independent NFsim
    needs: oracle-lock
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      BNG3_PYTHON_TEST_MODE: installed
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build perl
          python -m pip install pytest numpy scipy

      - name: Checkout locked BNG2 translation oracle
        run: |
          python scripts/ci/checkout_oracle.py \
            --name bionetgen \
            --destination "$RUNNER_TEMP/oracle-bionetgen" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Checkout locked NFsim oracle
        run: |
          python scripts/ci/checkout_oracle.py \
            --name nfsim \
            --destination "$RUNNER_TEMP/oracle-nfsim" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Build independent NFsim oracle
        run: |
          cmake -S "$RUNNER_TEMP/oracle-nfsim" \
            -B "$RUNNER_TEMP/oracle-nfsim/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DNFSIM_BUILD_EXECUTABLE=ON \
            -DNFSIM_BUILD_LIBRARY=OFF
          cmake --build "$RUNNER_TEMP/oracle-nfsim/build" --target NFsim --parallel 2

      - name: Install BNG3 Python API as a regular package
        run: |
          python -m pip install scikit-build-core pybind11
          python -m pip install ".[full,dev]"
        env:
          CMAKE_ARGS: "-DBUILD_TESTS=OFF -DBUILD_CLI=OFF -DBUILD_NFSIM_CLI=OFF"

      - name: Report installed BNG3 package and native identities
        run: |
          python scripts/ci/check_python_package_identity.py \
            --source-revision "$BNG3_SOURCE_REVISION" \
            --require-source-head \
            | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          BNG3_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify spawned API worker identity
        run: |
          pytest -c tests/validation/pytest.ini \
            tests/validation/test_worker_package_identity.py -q

      - name: Run direct/XML NFsim construction checks
        shell: bash
        run: |
          set -euo pipefail
          NFSIM_BIN="$RUNNER_TEMP/oracle-nfsim/build/NFsim" \
            pytest -c tests/validation/pytest.ini \
              tests/validation/test_parity_nfsim.py \
              -m "nf and not slow" \
              -q

      - name: Run NFsim seed-state parity contracts
        shell: bash
        run: |
          set -euo pipefail
          NFSIM_BIN="$RUNNER_TEMP/oracle-nfsim/build/NFsim" \
            pytest -c tests/validation/pytest.ini \
              tests/validation/test_parity_nfsim_seed.py \
              -q

      - name: Run fixed-seed native NFsim parity
        shell: bash
        run: |
          set -euo pipefail
          NFSIM_BIN="$RUNNER_TEMP/oracle-nfsim/build/NFsim" \
            BNG_ENSEMBLE_WORKERS=2 \
            pytest -c tests/validation/pytest.ini \
              tests/validation/test_parity_nfsim.py \
              -k "test_nf_vs_native and simple_system" \
              -q
          NFSIM_BIN="$RUNNER_TEMP/oracle-nfsim/build/NFsim" \
            pytest -c tests/validation/pytest.ini \
              tests/validation/test_parity_nfsim.py \
              -k "test_nf_fixed_seed_direct_matches_native_at_final_endpoint" \
              -q
          NFSIM_DIGEST=$(sha256sum "$RUNNER_TEMP/oracle-nfsim/build/NFsim" | cut -d ' ' -f 1)
          {
            echo "### Native NFsim parity"
            echo ""
            echo "- BNG3 source revision: \`${BNG3_SOURCE_REVISION}\`"
            echo "- NFsim oracle SHA-256: \`${NFSIM_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run physical NFsim source-law controls
        shell: bash
        env:
          BNG2_PERL: ${{ runner.temp }}/oracle-bionetgen/bng2/BNG2.pl
          BNGPATH: ${{ runner.temp }}/oracle-bionetgen/bng2
          NFSIM_BIN: ${{ runner.temp }}/oracle-nfsim/build/NFsim
        run: |
          set -euo pipefail
          pytest -c tests/validation/pytest.ini \
            tests/validation/test_nfsim_physical_unimolecular.py \
            -q -ra --junitxml="$RUNNER_TEMP/nfsim-physical-rate-controls.xml"

      - name: Run hybrid particle-population parity and conservation
        shell: bash
        env:
          BNG2_PERL: ${{ runner.temp }}/oracle-bionetgen/bng2/BNG2.pl
          NFSIM_BIN: ${{ runner.temp }}/oracle-nfsim/build/NFsim
          BNG3_CI_STRICT_ORACLES: "1"
          BNG3_HYBRID_EVIDENCE_DIR: ${{ runner.temp }}/release-hybrid-evidence
        run: |
          set -euo pipefail
          pytest -c tests/validation/pytest.ini \
            tests/validation/test_hybrid_execution.py \
            -q -ra --junitxml="$RUNNER_TEMP/release-hybrid.xml"

      - name: Upload hybrid particle-population evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-hybrid-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release-hybrid.xml
            ${{ runner.temp }}/release-hybrid-evidence/
          if-no-files-found: error

      - name: Run all Tier-NF native ensembles (scheduled)
        if: (success() || failure()) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          NFSIM_BIN="$RUNNER_TEMP/oracle-nfsim/build/NFsim" \
            BNG_ENSEMBLE_WORKERS=2 \
            pytest -c tests/validation/pytest.ini \
              tests/validation/test_parity_nfsim.py::test_nf_vs_native \
              -q -ra --junitxml="$RUNNER_TEMP/nfsim-tier-nf.xml"

      - name: Measure Tier-P direct/XML outcomes (scheduled)
        if: (success() || failure()) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        timeout-minutes: 90
        shell: bash
        run: |
          set -euo pipefail
          pytest -c tests/validation/pytest.ini \
            tests/validation/test_parity_nfsim.py::test_tierp_direct_path_outcome_is_measured_and_attributed \
            -q -ra --junitxml="$RUNNER_TEMP/nfsim-tier-p.xml"

      - name: Upload NFsim qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsim-qualification-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nfsim-tier-*.xml
            build/validation/direct_path_sweep.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize NFsim qualification scope
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = Path('build/validation/direct_path_sweep.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### NFsim qualification scope\n\n')
              summary.write('PR checks retain bounded native coverage. Scheduled/manual runs select every Tier-NF native ensemble and the Tier-P direct/XML sweep.\n\n')
              summary.write('Direct/XML comparisons share embedded engine code; they supplement independent native checks. Declined, not-loadable, incomplete, and uncomparable models are not equivalence evidence.\n\n')
              summary.write('Tier-P trajectory mismatches fail this gate after retaining their classification report.\n\n')
              if report.exists():
                  counts = json.loads(report.read_text())
                  summary.write('Tier-P measured categories: ' + json.dumps({key: value for key, value in counts.items() if isinstance(value, int)}) + '\n')
              else:
                  summary.write('No Tier-P classification report produced; no Tier-P parity claim. Inspect step outcomes and attached JUnit reports.\n')
          PY

  nfsim-source-validation:
    name: NFsim historical validation (scheduled)
    needs: oracle-lock
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NFsim validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          python -m pip install numpy scipy seaborn

      - name: Checkout locked NFsim source
        run: |
          python scripts/ci/checkout_oracle.py \
            --name nfsim \
            --destination "$RUNNER_TEMP/oracle-nfsim" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Build independent NFsim executable
        run: |
          cmake -S "$RUNNER_TEMP/oracle-nfsim" \
            -B "$RUNNER_TEMP/oracle-nfsim/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DNFSIM_BUILD_EXECUTABLE=ON \
            -DNFSIM_BUILD_LIBRARY=OFF
          cmake --build "$RUNNER_TEMP/oracle-nfsim/build" --target NFsim --parallel 2

      - name: Install BNG3 package used by the historical validator
        run: |
          python -m pip install scikit-build-core pybind11
          python -m pip install -e ".[full,dev]"
        env:
          CMAKE_ARGS: "-DBUILD_TESTS=OFF -DBUILD_CLI=OFF -DBUILD_NFSIM_CLI=OFF"

      - name: Run the source NFsim validation framework
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/oracle-nfsim/validate/validate.py" \
            "$RUNNER_TEMP/oracle-nfsim/validate" \
            2>&1 | tee "$RUNNER_TEMP/nfsim-historical-validation.log"

      - name: Retain NFsim historical validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfsim-historical-validation-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nfsim-historical-validation.log
            ${{ runner.temp }}/oracle-nfsim/validate/basicModels/v42.bngl
            ${{ runner.temp }}/oracle-nfsim/validate/basicModels/v42.xml
            ${{ runner.temp }}/oracle-nfsim/validate/basicModels/v42_nf.gdat
            ${{ runner.temp }}/oracle-nfsim/validate/basicModels/v43.bngl
            ${{ runner.temp }}/oracle-nfsim/validate/basicModels/v43.xml
            ${{ runner.temp }}/oracle-nfsim/validate/basicModels/v43_nf.gdat
          if-no-files-found: warn
          retention-days: 14

