          }
          python -m pip install build scikit-build-core pybind11 pytest numpy
          python -m pip install ".[full,dev,notebook]" nbclient nbformat libroadrunner
        env:
          CMAKE_ARGS: "-DBUILD_TESTS=OFF -DBUILD_CLI=OFF -DBUILD_NFSIM_CLI=OFF"

