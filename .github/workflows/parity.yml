            --report "$RUNNER_TEMP/issue137-bng2/bng2-cases.json"

      - name: Upload Issue 137 BNG2 case receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue137-cases-bng2-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/issue137-bng2/bng2-cases.json
          if-no-files-found: warn
          retention-days: 30

  integrated-semantic-validation:
    name: Integrated semantic validation (Atomizer, BNG3, BNG2, PyBioNetGen, NFsim)
    # The release records for #171/#172/#186 are produced in sibling jobs; the
    # release records for #152/#174/#176/#178 are produced in nfsim-parity;
    # exact-revision #137 case receipts come from bng2-parity, nfsim-parity,
    # pybionetgen-compat, and issue-137-inventory.
    # Wait for them so the exact-revision issue queue can consume every live
    # acceptance receipt, even when one producer step failed.
    needs:
      - oracle-lock
      - release-obligation-142
      - upstream-reconciliation-history
      - bng2-parity
      - nfsim-parity
      - pybionetgen-compat
      - migration-docs
      - issue-137-inventory
      - issue-181-corpus
      - issue-471-oracle-protection
      - issue-184-cpu-release
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      BNG3_PYTHON_TEST_MODE: installed
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot bounded GitHub issue backlog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 1000 \
            --json number,title,state,body,updatedAt > "$RUNNER_TEMP/bng3-issues.json"

      - name: Install native build and validation dependencies
        run: |
          which cmake ninja gcc g++ perl > /dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y build-essential cmake ninja-build perl
          }
          python -m pip install scikit-build-core pybind11 pytest numpy scipy pyyaml python-libsbml libroadrunner

      - name: Checkout locked BioNetGen oracle
        run: |
          python scripts/ci/checkout_oracle.py \
            --name bionetgen \
            --destination "$RUNNER_TEMP/oracle-bionetgen" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Build locked BNG2 Network3 oracle
        run: |
          set -euo pipefail
          network3="$RUNNER_TEMP/oracle-bionetgen/bng2/Network3"
          make -C "$network3" -f Makefile.cmake
          run_network="$RUNNER_TEMP/oracle-bionetgen/bng2/bin/run_network"
          test -x "$run_network"
          digest=$(sha256sum "$run_network" | cut -d ' ' -f 1)
          echo "BNG2_NETWORK_SHA256=$digest" >> "$GITHUB_ENV"
          echo "- Integrated lane BNG2 Network3 SHA-256: $digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout and build locked native NFsim oracle
        run: |
          set -euo pipefail
          python scripts/ci/checkout_oracle.py \
            --name nfsim \
            --destination "$RUNNER_TEMP/oracle-nfsim" \
            --summary-file "$GITHUB_STEP_SUMMARY"
          cmake -S "$RUNNER_TEMP/oracle-nfsim" \
            -B "$RUNNER_TEMP/oracle-nfsim/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DNFSIM_BUILD_EXECUTABLE=ON \
            -DNFSIM_BUILD_LIBRARY=OFF
          cmake --build "$RUNNER_TEMP/oracle-nfsim/build" --target NFsim --parallel 2
          nfsim="$RUNNER_TEMP/oracle-nfsim/build/NFsim"
          test -x "$nfsim"
          digest=$(sha256sum "$nfsim" | cut -d ' ' -f 1)
          echo "NFSIM_SHA256=$digest" >> "$GITHUB_ENV"
          echo "- Integrated lane native NFsim SHA-256: $digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout locked PyBioNetGen source
        run: |
          python scripts/ci/checkout_oracle.py \
            --name pybionetgen \
            --destination "$RUNNER_TEMP/oracle-pybionetgen" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Create isolated upstream PyBioNetGen interpreter
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pybionetgen-venv"
          "$RUNNER_TEMP/pybionetgen-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/pybionetgen-venv/bin/python" -m pip install -r \
            "$RUNNER_TEMP/oracle-pybionetgen/requirements.txt"
          echo "PYBIONETGEN_PYTHON=$RUNNER_TEMP/pybionetgen-venv/bin/python" >> "$GITHUB_ENV"

      - name: Install BNG3 CLI and full Python package
        id: candidate_install
        run: |
          python -m pip install --no-build-isolation \
            --config-settings=build-dir=build \
            --config-settings=cmake.define.BUILD_CLI=ON \
            ".[full,dev]"
        env:
          CMAKE_ARGS: "-DBUILD_CLI=ON -DBUILD_NFSIM_CLI=OFF -DBUILD_TESTS=OFF"

      - name: Verify installed BNG3 package identity
        id: candidate_identity
        run: |
          python scripts/ci/check_python_package_identity.py \
            --source-revision "$BNG3_SOURCE_REVISION" \
            --require-source-head \
            | tee -a "$GITHUB_STEP_SUMMARY"
          test -x build/cpp/bng_cpp
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          BNG3_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify spawned scientific worker identity
        if: always() && steps.candidate_identity.outcome == 'success'
        run: python -m pytest -c tests/validation/pytest.ini tests/validation/test_worker_package_identity.py -q

      - name: Check the export-format tier against independent consumers
        if: always() && steps.candidate_identity.outcome == 'success'
        run: |
          python -m pytest -c tests/validation/pytest.ini \
            tests/validation/test_export_format_tier.py \
            --bng-cpp build/cpp/bng_cpp \
            -q -ra

      - name: Check Atomizer symbol resolution and seam ownership
        if: always() && steps.candidate_identity.outcome == 'success'
        run: |
          python -m pytest -c tests/validation/pytest.ini \
            tests/validation/test_atomizer_characterization.py \
            --bng-cpp build/cpp/bng_cpp \
            -q -ra

      - name: Run S6 simulate-option acceptance
        run: >-
          python -m pytest -c tests/validation/pytest.ini
          tests/validation/release/cases/sprint-s6-simulate-options/test_simulate_options.py
          --bng-cpp build/cpp/bng_cpp -q
        env:
          BNG3_CI_STRICT_ORACLES: "1"
          BNG2_PERL: ${{ runner.temp }}/oracle-bionetgen/bng2/BNG2.pl
          BNGPATH: ${{ runner.temp }}/oracle-bionetgen/bng2
          S6_RECEIPT_DIR: ${{ runner.temp }}/bng3-s6-receipts

      - name: Upload S6 simulate-option receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bng3-s6-simulate-option-receipts
          path: ${{ runner.temp }}/bng3-s6-receipts/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Run SBML nonconstant delay history acceptance
        if: always() && steps.candidate_identity.outcome == 'success'
        env:
          BNG3_PYTHON_TEST_MODE: installed
        run: >-
          python -m pytest -q
          --confcutdir=tests/validation/release/cases/sprint-s5-delay-history
          tests/validation/release/cases/sprint-s5-delay-history/test_delay_history.py

      - name: Validate independent issue-475 delayed semantics release acceptance
        if: always() && steps.candidate_identity.outcome == 'success'
        env:
          BNG3_PYTHON_TEST_MODE: installed
        run: >-
          python scripts/ci/record_delay_release.py
          --output "$RUNNER_TEMP/bng3-delay-release/report.json"
          --source-revision "${{ github.event.pull_request.head.sha || github.sha }}"
          --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Validate independent issue-153 native BNGIR release acceptance
        if: always() && steps.candidate_identity.outcome == 'success'
        env:
          BNG3_PYTHON_TEST_MODE: installed
        run: >-
          python scripts/ci/record_bngir_native_release.py
          --source-revision "${{ github.event.pull_request.head.sha || github.sha }}"
          --output-dir "$RUNNER_TEMP/bng3-bngir-native-release"

      - name: Execute independent EQ-* catalogue for issue 156
        if: always() && steps.candidate_identity.outcome == 'success'
        env:
          BNG3_PYTHON_TEST_MODE: installed
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bng3-bngir-release"
          python -m tests.validation.eq_catalogue \
            --output "$RUNNER_TEMP/bng3-bngir-release/eq-catalogue.json"

      - name: Validate independent issue-156 BNGIR semantic equality release acceptance
        if: always() && steps.candidate_identity.outcome == 'success'
        env:
          BNG3_PYTHON_TEST_MODE: installed
        run: >-
          python scripts/ci/record_bngir_release.py
          --output "$RUNNER_TEMP/bng3-bngir-release/report.json"
          --eq-catalogue "$RUNNER_TEMP/bng3-bngir-release/eq-catalogue.json"
          --source-revision "${{ github.event.pull_request.head.sha || github.sha }}"
          --summary-file "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eq-catalogue-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/bng3-bngir-release/
          if-no-files-found: warn
          retention-days: 14

      - name: Validate independent issue-154 BNGIR round trip release acceptance
        if: always() && steps.candidate_identity.outcome == 'success'
        env:
          BNG3_PYTHON_TEST_MODE: installed
        run: >-
          python scripts/ci/record_bngir_roundtrip_release.py
          --output "$RUNNER_TEMP/bng3-bngir-roundtrip-release/report.json"
          --source-revision "${{ github.event.pull_request.head.sha || github.sha }}"
          --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Validate independent issue-155 BNGIR adversarial release acceptance
        if: always() && steps.candidate_identity.outcome == 'success'
        env:
          BNG3_PYTHON_TEST_MODE: installed
        run: >-
          python scripts/ci/record_issue155_release.py
          --output "$RUNNER_TEMP/bng3-issue-155-release/report.json"
          --source-revision "${{ github.event.pull_request.head.sha || github.sha }}"
          --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Run integrated cross-component cases
        id: integrated_cases
        run: |
          set -euo pipefail
          full_args=()
          if [[ "${{ github.event_name }}" == "schedule" || ( "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.bounded }}" != "true" ) ]]; then
            full_args=(--full)
          fi
          python -m tests.validation.integrated \
            --bng-cpp build/cpp/bng_cpp \
            --bng2-root "$RUNNER_TEMP/oracle-bionetgen" \
            --bng2-network-sha256 "$BNG2_NETWORK_SHA256" \
            --nfsim-root "$RUNNER_TEMP/oracle-nfsim" \
            --nfsim-binary "$RUNNER_TEMP/oracle-nfsim/build/NFsim" \
            --nfsim-sha256 "$NFSIM_SHA256" \
            --pybionetgen-root "$RUNNER_TEMP/oracle-pybionetgen" \
            --pybionetgen-python "$PYBIONETGEN_PYTHON" \
            --report-dir "$RUNNER_TEMP/bng3-integrated-validation" \
            "${full_args[@]}"

      - name: Check independently authored native BNGIR controls
        if: always() && steps.candidate_identity.outcome == 'success'
        run: python -m pytest tests/validation/test_bngir_adversarial_native.py -q

      - name: Download Issue 142 receipt for issue queue
        if: always() && needs.release-obligation-142.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: issue142-release-obligation-142-${{ github.run_id }}
          path: ${{ runner.temp }}/issue142/queue

      - name: Download Issue 142 identity components for issue queue
        if: always() && needs.release-obligation-142.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: issue142-release-graph-identity-${{ github.run_id }}
          path: ${{ runner.temp }}/issue142/queue/identity

      - name: Download Issue 142 observable replay for issue queue
        if: always() && needs.release-obligation-142.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: issue142-release-graph-observables-${{ github.run_id }}
          path: ${{ runner.temp }}/issue142/queue/observables

      - name: Download Issue 150 hybrid release report for issue queue
        if: always() && needs.release-obligation-142.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: release-hybrid-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bng3-hybrid-release

      - name: Download Issue 147 NFnext lowering report for issue queue
        if: always() && needs.release-obligation-142.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: release-issue-147-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bng3-issue-147-release

      - name: Audit generated consumer matrix receipts
        if: always()
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/bng3-integrated-validation/report.json"
          python -m tests.validation.integrated_matrix \
            --report "$RUNNER_TEMP/bng3-integrated-validation/report.json" \
            --output "$RUNNER_TEMP/bng3-integrated-validation/matrix-report.json" \
            --revision "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Summarize integrated findings for the exact candidate
        if: always()
        run: |
          python -m tests.validation.ci_report \
            "$RUNNER_TEMP/bng3-integrated-validation/report.json" \
            --strict --summary "$GITHUB_STEP_SUMMARY" \
            --revision "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Execute Issue 138 compiled-model release case
        shell: bash
        run: |
          set -euo pipefail
          # Non-NFsim bngl.* family: 30 syntax rows + pinned BNG2 golden-network
          # parity, executed from the compiled model after AST destruction.
          python scripts/ci/record_issue138_release.py \
            --source-revision "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output "$RUNNER_TEMP/issue138-release-record.json" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Record Issue 473 JAX release acceptance for the issue queue
        if: always() && steps.candidate_identity.outcome == 'success'
        run: |
          set -euo pipefail
          python -m pip install 'jax>=0.4.30' 'jaxlib>=0.4.30'
          python scripts/ci/record_jax_release.py \
            --output "$RUNNER_TEMP/bng3-jax-release/report.json" \
            --source-revision "$BNG3_SOURCE_REVISION" \
            --summary-file "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/release-records/issue471-jax-receipts-$BNG3_SOURCE_REVISION"
          python scripts/ci/record_issue471_analytic_receipts.py \
            --root . \
            --revision "$BNG3_SOURCE_REVISION" \
            --only-jax \
            --receipts-dir "$RUNNER_TEMP/release-records/issue471-jax-receipts-$BNG3_SOURCE_REVISION/receipts" \
            --artifacts-dir "$RUNNER_TEMP/release-records/issue471-jax-receipts-$BNG3_SOURCE_REVISION/artifacts" \
            --summary-out "$RUNNER_TEMP/release-records/issue471-jax-receipts-$BNG3_SOURCE_REVISION/summary.json" || true
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          JAX_PLATFORMS: cpu
          JAX_ENABLE_X64: "true"

      - name: Download Issue 148 NFnext corpus release record
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: issue148-release-record-${{ github.run_id }}
          path: ${{ runner.temp }}/bng3-issue-148-release

      - name: Download Issue 149 NFcore consolidation release record
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: issue149-release-record-${{ github.run_id }}
          path: ${{ runner.temp }}/bng3-issue-149-release

      - name: Download release records for the exact-revision issue queue
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          # download-artifact@v4 takes ONE glob, not a newline-separated list.
          # A multiline pattern silently matched zero artifacts, so sibling
          # receipts were uploaded but never consumed by the issue queue.
          # This single glob also matches the issue-137/181/471/184 acceptance
          # records wired by this branch.
          pattern: issue*-*
          path: ${{ runner.temp }}/release-records

      - name: Download EQ catalogue for the exact-revision issue queue
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: eq-catalogue-*
          path: ${{ runner.temp }}/release-records

      - name: Download upstream reconciliation pins and behavior reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: upstream-reconciliation-history
          path: ${{ runner.temp }}/reconciliation-pins

      - name: Download reconciliation behavior and JUnit artifacts
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: reconciliation-*
          path: ${{ runner.temp }}/reconciliation-artifacts

      - name: Build exact-revision issue and provenance evidence queue
        if: always()
        run: |
          head_args=()
          issue138_args=()
          issue142_args=()
          issue148_args=()
          issue149_args=()
          issue473_args=()
          s6_args=()
          delay_args=()
          bngir_args=()
          bngir153_args=()
          bngir154_args=()
          issue155_args=()
          hybrid_args=()
          issue147_args=()
          release_report_args=()
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            head_args=(--collect-upstream-heads)
          fi
          if [[ -s "$RUNNER_TEMP/issue138-release-record.json" ]]; then
            issue138_args+=(--issue138-release-record "$RUNNER_TEMP/issue138-release-record.json")
          fi
          if [[ -s "$RUNNER_TEMP/issue142/queue/release-obligation-142.json" ]]; then
            issue142_args+=(
              --issue142-release-record "$RUNNER_TEMP/issue142/queue/release-obligation-142.json"
              --issue142-identity-report "$RUNNER_TEMP/issue142/queue/identity/identity-report.json"
              --issue142-observables-report "$RUNNER_TEMP/issue142/queue/observables/observables-report.json"
            )
          fi
          if [[ -s "$RUNNER_TEMP/bng3-jax-release/report.json" ]]; then
            issue473_args+=(--report "$RUNNER_TEMP/bng3-jax-release/report.json")
          fi
          if [[ -d "$RUNNER_TEMP/bng3-s6-receipts" ]]; then
            s6_args+=(--s6-simulate-receipt-dir "$RUNNER_TEMP/bng3-s6-receipts")
          fi
          if [[ -s "$RUNNER_TEMP/bng3-delay-release/report.json" ]]; then
            delay_args+=(--report "$RUNNER_TEMP/bng3-delay-release/report.json")
          fi
          if [[ -s "$RUNNER_TEMP/bng3-bngir-release/report.json" ]]; then
            bngir_args+=(--report "$RUNNER_TEMP/bng3-bngir-release/report.json")
          fi
          if [[ -s "$RUNNER_TEMP/bng3-bngir-native-release/report.json" ]]; then
            bngir153_args+=(--report "$RUNNER_TEMP/bng3-bngir-native-release/report.json")
          fi
          if [[ -s "$RUNNER_TEMP/bng3-bngir-roundtrip-release/report.json" ]]; then
            bngir154_args+=(--report "$RUNNER_TEMP/bng3-bngir-roundtrip-release/report.json")
          fi
          if [[ -s "$RUNNER_TEMP/bng3-issue-155-release/report.json" ]]; then
            issue155_args+=(--report "$RUNNER_TEMP/bng3-issue-155-release/report.json")
          fi
          if [[ -s "$RUNNER_TEMP/bng3-hybrid-release/issue-150-release-report.json" ]]; then
            hybrid_args+=(--report "$RUNNER_TEMP/bng3-hybrid-release/issue-150-release-report.json")
          elif [[ -s "$RUNNER_TEMP/bng3-hybrid-release/release-hybrid-evidence/issue-150-release-report.json" ]]; then
            hybrid_args+=(--report "$RUNNER_TEMP/bng3-hybrid-release/release-hybrid-evidence/issue-150-release-report.json")
          fi
          if [[ -s "$RUNNER_TEMP/bng3-issue-147-release/issue-147-release-report.json" ]]; then
            issue147_args+=(--issue147-release-record "$RUNNER_TEMP/bng3-issue-147-release/issue-147-release-report.json")
          elif [[ -s "$RUNNER_TEMP/bng3-issue-147-release/release-issue-147-evidence/issue-147-release-report.json" ]]; then
            issue147_args+=(--issue147-release-record "$RUNNER_TEMP/bng3-issue-147-release/release-issue-147-evidence/issue-147-release-report.json")
          fi
          if [[ -s "$RUNNER_TEMP/bng3-issue-148-release/report.json" ]]; then
            issue148_args+=(--report "$RUNNER_TEMP/bng3-issue-148-release/report.json")
          fi
          if [[ -s "$RUNNER_TEMP/bng3-issue-149-release/report.json" ]]; then
            issue149_args+=(--report "$RUNNER_TEMP/bng3-issue-149-release/report.json")
          fi
          # Each sibling-job release record is a standalone exact-revision
          # receipt; a missing/failed producer leaves its check unverified
          # rather than converting a passing process into a passing contract.
          shopt -s nullglob
          case_report_args=()
          for case_record in \
            "$RUNNER_TEMP"/release-records/issue137-*/structural-cases.json \
            "$RUNNER_TEMP"/release-records/issue137-*/bng2-cases.json \
            "$RUNNER_TEMP"/release-records/issue137-*/nfsim-cases.json \
            "$RUNNER_TEMP"/release-records/issue137-*/pybionetgen-cases.json; do
            if [[ -s "$case_record" ]]; then
              case_report_args+=(--case-report "$case_record")
            fi
          done
          if (( ${#case_report_args[@]} > 0 )); then
            mkdir -p "$RUNNER_TEMP/issue137-combined"
            python tests/validation/release/cases/issue-137/issue137_checks.py inventory \
              --root . --revision "${{ github.event.pull_request.head.sha || github.sha }}" \
              "${case_report_args[@]}" \
              --report "$RUNNER_TEMP/issue137-combined/report.json" || true
            if [[ -s "$RUNNER_TEMP/issue137-combined/report.json" ]]; then
              rm -f "$RUNNER_TEMP"/release-records/issue137-inventory-*/report.json
              mkdir -p "$RUNNER_TEMP/release-records/issue137-inventory-combined"
              mv "$RUNNER_TEMP/issue137-combined/report.json" \
                "$RUNNER_TEMP/release-records/issue137-inventory-combined/report.json"
            fi
          fi
          receipt_dirs=("$RUNNER_TEMP"/release-records/issue471-*-receipts-*/receipts)
          artifact_dirs=("$RUNNER_TEMP"/release-records/issue471-*-receipts-*/artifacts)
          tamper_reports=(
            "$RUNNER_TEMP"/release-records/issue471-acceptance-*/tamper.json
            "$RUNNER_TEMP"/release-records/issue471-acceptance-*/issue471-acceptance/tamper.json
          )
          topology_reports=(
            "$RUNNER_TEMP"/release-records/issue471-acceptance-*/topology.json
            "$RUNNER_TEMP"/release-records/issue471-acceptance-*/issue471-acceptance/topology.json
          )
          if (( ${#receipt_dirs[@]} > 0 && ${#artifact_dirs[@]} > 0 && ${#tamper_reports[@]} > 0 && ${#topology_reports[@]} > 0 )); then
            mkdir -p "$RUNNER_TEMP/issue471-all/receipts" "$RUNNER_TEMP/issue471-all/artifacts" "$RUNNER_TEMP/issue471-combined"
            for rdir in "${receipt_dirs[@]}"; do
              cp -R "$rdir"/. "$RUNNER_TEMP/issue471-all/receipts"/
            done
            for adir in "${artifact_dirs[@]}"; do
              cp -R "$adir"/. "$RUNNER_TEMP/issue471-all/artifacts"/
            done
            PYTHONPATH=. python tests/validation/release/cases/issue-471/issue471_checks.py oracle \
              --root . \
              --receipts "$RUNNER_TEMP/issue471-all/receipts" \
              --artifacts "$RUNNER_TEMP/issue471-all/artifacts" \
              --revision "${{ github.event.pull_request.head.sha || github.sha }}" \
              --report "$RUNNER_TEMP/issue471-combined/oracle.json" || true
            if [[ -s "$RUNNER_TEMP/issue471-combined/oracle.json" ]]; then
              PYTHONPATH=. python scripts/ci/record_issue471_release.py \
                --revision "${{ github.event.pull_request.head.sha || github.sha }}" \
                --oracle-report "$RUNNER_TEMP/issue471-combined/oracle.json" \
                --topology-report "${topology_reports[0]}" \
                --tamper-report "${tamper_reports[0]}" \
                --report "$RUNNER_TEMP/issue471-combined/report.json" || true
              if [[ -s "$RUNNER_TEMP/issue471-combined/report.json" ]]; then
                rm -f \
                  "$RUNNER_TEMP"/release-records/issue471-acceptance-*/report.json \
                  "$RUNNER_TEMP"/release-records/issue471-acceptance-*/issue471-acceptance/report.json
                mkdir -p "$RUNNER_TEMP/release-records/issue471-acceptance-combined"
                cp "$RUNNER_TEMP/issue471-combined/report.json" \
                  "$RUNNER_TEMP/release-records/issue471-acceptance-combined/report.json"
              fi
            fi
          fi
          reconciliation_args=()
          if [[ -s "$RUNNER_TEMP/reconciliation-pins/reconciliation-history.json" ]]; then
            reconciliation_args+=(--report "$RUNNER_TEMP/reconciliation-pins/reconciliation-history.json")
            junit_args=()
            while IFS= read -r -d '' junit_path; do
              junit_args+=(--junit "$junit_path")
            done < <(find "$RUNNER_TEMP/reconciliation-artifacts" -type f -name '*.xml' -print0 2>/dev/null)
            if (( ${#junit_args[@]} > 0 )); then
              python scripts/ci/record_reconciliation_deltas.py \
                --revision "${{ github.event.pull_request.head.sha || github.sha }}" \
                --pin-report "$RUNNER_TEMP/reconciliation-pins/reconciliation-history.json" \
                "${junit_args[@]}" \
                --output "$RUNNER_TEMP/reconciliation-deltas.json" || true
            fi
            recon_behavior_args=()
            if [[ -s "$RUNNER_TEMP/reconciliation-deltas.json" ]]; then
              recon_behavior_args+=(--behavior-report "$RUNNER_TEMP/reconciliation-deltas.json")
            fi
            while IFS= read -r -d '' beh_path; do
              recon_behavior_args+=(--behavior-report "$beh_path")
            done < <(find "$RUNNER_TEMP/reconciliation-artifacts" -type f -name '*reconciliation-nfsim-options*.json' -print0 2>/dev/null)
            for case_json in "${case_report_args[@]}"; do
              if [[ "$case_json" != "--case-report" && -s "$case_json" ]]; then
                recon_behavior_args+=(--behavior-report "$case_json")
              fi
            done
            issue471_recon_args=()
            if [[ -s "$RUNNER_TEMP/issue471-combined/oracle.json" && -d "$RUNNER_TEMP/issue471-all/receipts" ]]; then
              issue471_recon_args+=(
                --issue471-oracle-report "$RUNNER_TEMP/issue471-combined/oracle.json"
                --issue471-receipts-dir "$RUNNER_TEMP/issue471-all/receipts"
              )
            fi
            python scripts/ci/record_reconciliation_release.py \
              --revision "${{ github.event.pull_request.head.sha || github.sha }}" \
              --pin-report "$RUNNER_TEMP/reconciliation-pins/reconciliation-history.json" \
              "${recon_behavior_args[@]}" \
              ${issue471_recon_args[@]+"${issue471_recon_args[@]}"} \
              --output "$RUNNER_TEMP/reconciliation-acceptance.json" || true
            if [[ -s "$RUNNER_TEMP/reconciliation-acceptance.json" ]]; then
              reconciliation_args+=(--report "$RUNNER_TEMP/reconciliation-acceptance.json")
            fi
          fi
          GH_TOKEN="${{ github.token }}" PYTHONPATH=. python scripts/ci/collect_issue184_hosted_evidence.py \
            --root . \
            --repo "$GITHUB_REPOSITORY" \
            --revision "${{ github.event.pull_request.head.sha || github.sha }}" \
            --release-records "$RUNNER_TEMP/release-records" \
            --extra-scientific-receipt "$RUNNER_TEMP/issue138-release-record.json" \
            --extra-scientific-receipt "$RUNNER_TEMP/bng3-jax-release/report.json" \
            --extra-scientific-receipt "$RUNNER_TEMP/issue142/queue/release-obligation-142.json" \
            --output-dir "$RUNNER_TEMP/issue184-combined" || true
          for record in \
            "$RUNNER_TEMP"/release-records/issue137-inventory-*/report.json \
            "$RUNNER_TEMP"/release-records/issue181-corpus-*/report.json \
            "$RUNNER_TEMP"/release-records/issue181-corpus-*/issue181-corpus/report.json \
            "$RUNNER_TEMP"/release-records/issue471-acceptance-*/report.json \
            "$RUNNER_TEMP"/release-records/issue471-acceptance-*/issue471-acceptance/report.json \
            "$RUNNER_TEMP"/release-records/issue184-cpu-release-*/report.json \
            "$RUNNER_TEMP"/release-records/issue176-cpu-ensemble-*/issue-176-release-report.json \
            "$RUNNER_TEMP"/release-records/issue152-energy-protocol-release-*/issue-152-release-report.json \
            "$RUNNER_TEMP"/release-records/issue178-shared-decisions-release-*/issue-178-release-report.json \
            "$RUNNER_TEMP"/release-records/issue174-cpu-benchmark-*/issue174-benchmark-record.json \
            "$RUNNER_TEMP"/release-records/issue171-release-record-*/issue-171.json \
            "$RUNNER_TEMP"/release-records/issue172-release-record-*/issue-172.json \
            "$RUNNER_TEMP"/release-records/issue186-release-record-*/issue-186.json \
            "$RUNNER_TEMP"/release-records/eq-catalogue-*/report.json; do
            release_report_args+=(--report "$record")
          done
          shopt -u nullglob
          python -m tests.validation.issue_queue \
            --issues-json "$RUNNER_TEMP/bng3-issues.json" \
            --report "$RUNNER_TEMP/bng3-integrated-validation/report.json" \
            --report "$RUNNER_TEMP/bng3-integrated-validation/matrix-report.json" \
            "${issue138_args[@]}" \
            "${issue142_args[@]}" \
            "${issue473_args[@]}" \
            "${s6_args[@]}" \
            "${delay_args[@]}" \
            "${bngir_args[@]}" \
            "${bngir153_args[@]}" \
            "${bngir154_args[@]}" \
            "${issue155_args[@]}" \
            "${hybrid_args[@]}" \
            "${issue147_args[@]}" \
            "${issue148_args[@]}" \
            "${issue149_args[@]}" \
            "${reconciliation_args[@]}" \
            "${release_report_args[@]}" \
            --revision "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output-dir "$RUNNER_TEMP/bng3-issue-queue" "${head_args[@]}"
          cat "$RUNNER_TEMP/bng3-issue-queue/issue-queue.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload issue queue and provenance observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bng3-issue-queue-${{ github.event_name }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bng3-issue-queue/
            ${{ runner.temp }}/bng3-issues.json
            ${{ runner.temp }}/bng3-bngir-roundtrip-release/
            ${{ runner.temp }}/bng3-issue-155-release/
            ${{ runner.temp }}/reconciliation-deltas.json
            ${{ runner.temp }}/reconciliation-acceptance.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload combined Issue 471 oracle acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue471-acceptance-combined-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/issue471-combined/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce complete Issue 471 oracle grounding
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          oracle="$RUNNER_TEMP/issue471-combined/oracle.json"
          if [[ ! -s "$oracle" ]]; then
            echo "::error::Missing combined Issue 471 oracle report: $oracle"
            exit 1
          fi
          python - "$oracle" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          result = data.get("result")
          grounded = int(data.get("grounded_execution_rows", 0))
          total = int(data.get("row_count", 0))
          if result != "pass" or total <= 0 or grounded < total:
              print(
                  f"Issue 471 oracle grounding failed: result={result!r}, "
                  f"grounded_execution_rows={grounded}/{total}",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"Issue 471 oracle grounding verified: {grounded}/{total} rows pass")
          PY

      - name: Restore previous main integrated-validation observations
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/triage-integrated-validation-history
          key: triage-integrated-validation-main-${{ github.sha }}
          restore-keys: triage-integrated-validation-main-

      - name: Bounded named-check replay and portable integrated-validation repair tasks
        if: always()
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/bng3-integrated-validation"
          test -s "$evidence/report.json"
          python -m tests.validation.replay "$evidence/report.json" \
            --execute --output "$evidence/replays" --max-cases 2 --runs 1 --timeout 40 --budget 90
          args=()
          if [[ -f "$RUNNER_TEMP/triage-integrated-validation-history/ledger.json" ]]; then
            args+=(--previous "$RUNNER_TEMP/triage-integrated-validation-history/ledger.json")
          fi
          shopt -s nullglob
          for report in "$evidence"/replays/replicate-*.json; do
            args+=(--replicate "$report")
          done
          python -m tests.validation.triage "$evidence/report.json" \
            --output "$evidence/triage" "${args[@]}" --issues-json "$RUNNER_TEMP/bng3-issues.json" \
            --obligations-json "$RUNNER_TEMP/bng3-issue-queue/obligation-assessment.json"
          cat "$evidence/triage/summary.md" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/triage-integrated-validation-history"
          cp "$evidence/triage/ledger.json" "$RUNNER_TEMP/triage-integrated-validation-history/ledger.json"

      - name: Retain main integrated-validation observation history
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/triage-integrated-validation-history
          key: triage-integrated-validation-main-${{ github.sha }}

      - name: Upload integrated reports and replay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bng3-integrated-validation-${{ github.event_name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bng3-integrated-validation/
          if-no-files-found: warn
          retention-days: 30

  conformance-findings:
    name: Conformance findings (network, cdat, gdat)
    needs: bng2-parity
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bng3-conformance-${{ github.event_name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bng3-conformance
      - name: Require every selected applicable diagnostic contract
        run: |
          # A workflow_dispatch run does not execute the pull-request
          # conformance producer, so its artifact is legitimately absent.
          # Skip the strict consumer in that case instead of blocking the
          # downstream artifact-producing acceptance jobs.
          if [[ ! -s "$RUNNER_TEMP/bng3-conformance/report.json" ]]; then
            echo 'No conformance artifact for this event; strict diagnostic gate skipped.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m tests.validation.ci_report \
            "$RUNNER_TEMP/bng3-conformance/report.json" \
            --strict --summary "$GITHUB_STEP_SUMMARY" \
            --revision "${{ github.event.pull_request.head.sha || github.sha }}"

  nfsim-parity:
    name: BNG3 vs independent NFsim
    needs: oracle-lock
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      BNG3_PYTHON_TEST_MODE: installed
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and validation dependencies
        run: |
          which cmake ninja perl > /dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build perl
          }
          python -m pip install pytest numpy scipy

      - name: Checkout locked BNG2 translation oracle
        run: |
          python scripts/ci/checkout_oracle.py \
            --name bionetgen \
            --destination "$RUNNER_TEMP/oracle-bionetgen" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Build locked BNG2 Network3 oracle
        shell: bash
        run: |
          set -euo pipefail
          network3="$RUNNER_TEMP/oracle-bionetgen/bng2/Network3"
          make -C "$network3" -f Makefile.cmake
          run_network="$RUNNER_TEMP/oracle-bionetgen/bng2/bin/run_network"
          test -x "$run_network"
          echo "$(dirname "$run_network")" >> "$GITHUB_PATH"

      - name: Checkout locked NFsim oracle
        run: |
          python scripts/ci/checkout_oracle.py \
            --name nfsim \
            --destination "$RUNNER_TEMP/oracle-nfsim" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Build independent NFsim oracle
        run: |
          cmake -S "$RUNNER_TEMP/oracle-nfsim" \
            -B "$RUNNER_TEMP/oracle-nfsim/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DNFSIM_BUILD_EXECUTABLE=ON \
            -DNFSIM_BUILD_LIBRARY=OFF
          cmake --build "$RUNNER_TEMP/oracle-nfsim/build" --target NFsim --parallel 2

      - name: Checkout and build locked BNGSIM oracle
        run: |
          python scripts/ci/checkout_oracle.py \
            --name bngsim \
            --destination "$RUNNER_TEMP/oracle-bngsim" \
            --summary-file "$GITHUB_STEP_SUMMARY"
          cmake -S "$RUNNER_TEMP/oracle-bngsim" \
            -B "$RUNNER_TEMP/oracle-bngsim/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DBNGSIM_BUILD_PYTHON=OFF \
            -DBNGSIM_BUILD_NFSIM=OFF \
            -DBNGSIM_BUILD_RULEMONKEY=OFF \
            -DBNGSIM_BUILD_TESTS=OFF
          # The pinned BNGSIM oracle's vendored NFsim shared library has a
          # glibc teardown fault: its static std::queue destructor double-frees
          # at interpreter exit (gdb backtrace in hosted run 45359245523).
          # BNG3's BNGSIM adapter uses only the finite ODE/SSA routes; this
          # vendored NFsim component is unused. Excluding it keeps the pinned
          # source and ODE/SSA semantics while avoiding the abort that skipped
          # receipt generation and the NFnext test-contract build.
          cmake --build "$RUNNER_TEMP/oracle-bngsim/build" --target bngsim --parallel 2
          BNGSIM_LIBRARY_PATH=$(find "$RUNNER_TEMP/oracle-bngsim/build" -maxdepth 1 -name 'libbngsim.so*' | head -1)
          test -f "$BNGSIM_LIBRARY_PATH"
          echo "BNGSIM_LIBRARY_PATH=$BNGSIM_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Install BNG3 Python API as a regular package
        run: |
          python -m pip install scikit-build-core pybind11
          python -m pip install ".[full,dev]"
        env:
          SKBUILD_BUILD_DIR: build
          CMAKE_ARGS: "-DBUILD_TESTS=OFF -DBUILD_CLI=ON -DBUILD_NFSIM_CLI=ON"

      - name: Replay upstream NFsim XML and molecularity regressions
        env:
          NFSIM_SYNC_ORACLE: ${{ runner.temp }}/oracle-nfsim
          NFSIM_SYNC_CANDIDATE_BIN: ${{ github.workspace }}/build/cpp
        run: |
          python -m pytest --noconftest -q tests/validation/nfsim_upstream_sync.py \
            -o junit_family=xunit1 \
            --junitxml="$RUNNER_TEMP/reconciliation-nfsim-sync.xml"

      - name: Report installed BNG3 package and native identities
        run: |
          python scripts/ci/check_python_package_identity.py \
            --source-revision "$BNG3_SOURCE_REVISION" \
            --require-source-head \
            | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          BNG3_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check NFnext cross-species dynamic rate against independent SSA
        run: >-
          python -m pytest --noconftest -q
          tests/python/nfnext/test_nfnext_cross_species_dynamic_rate.py

      - name: Check NFnext physical bimolecular unit boundary
        run: >-
          python -m pytest --noconftest -q
          tests/python/nfnext/test_nfnext_bimolecular_unit_boundary.py

      - name: Check NFnext dynamic observable-dependent rate against independent exact SSA
        run: >-
          python -m pytest --noconftest -q
          tests/python/nfnext/test_nfnext_dynamic_rate_observable.py

      - name: Check NFnext dynamic energy Arrhenius rate against independent two-state law
        run: >-
          python -m pytest --noconftest -q
          tests/python/nfnext/test_nfnext_dynamic_energy_rate.py

      - name: Check NFnext dynamic population-map rate against independent exact SSA
        env:
          BNG2_PERL: ${{ runner.temp }}/oracle-bionetgen/bng2/BNG2.pl
        run: >-
          python -m pytest --noconftest -q
          tests/validation/release/cases/issue-147/test_dynamic_population_map_rate.py

      - name: Check NFnext dynamic map law against pinned native NFsim
        env:
          NFSIM_BIN: ${{ runner.temp }}/oracle-nfsim/build/NFsim
          BNG2_PERL: ${{ runner.temp }}/oracle-bionetgen/bng2/BNG2.pl
        run: >-
          python -m pytest --noconftest -q
          tests/validation/release/cases/issue-147/test_nfnext_dynamic_map_native_parity.py

      - name: Check NFnext full network-free corpus against pinned native NFsim
        env:
          NFSIM_BIN: ${{ runner.temp }}/oracle-nfsim/build/NFsim
          BNG2_PERL: ${{ runner.temp }}/oracle-bionetgen/bng2/BNG2.pl
          BNG3_NFNEXT_CORPUS_REPORT: ${{ runner.temp }}/bng3-nfnext-corpus-report.json
        run: >-
          python -m pytest --noconftest -q
          tests/validation/release/cases/issue-148/test_nfnext_full_corpus_native_parity.py

      - name: Upload NFnext corpus parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue148-nfnext-corpus-${{ github.run_id }}
          path: ${{ runner.temp }}/bng3-nfnext-corpus-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Record Issue 148 NFnext corpus release acceptance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/record_issue148_release.py \
            --report "$RUNNER_TEMP/bng3-nfnext-corpus-report.json" \
            --source-revision "$BNG3_SOURCE_REVISION" \
            --output "$RUNNER_TEMP/bng3-issue-148-release/report.json" \
            --summary-file "$GITHUB_STEP_SUMMARY"
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload Issue 148 release record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue148-release-record-${{ github.run_id }}
          path: ${{ runner.temp }}/bng3-issue-148-release/report.json
          if-no-files-found: error
          retention-days: 30

      - name: Check NFnext ensemble RNG and state isolation (#176)
        run: >-
          python -m pytest --noconftest -q
          tests/python/nfnext/test_nfnext_ensemble_rng_isolation.py

      - name: Concurrent NFnext trajectories vs pinned native NFsim (#176)
        env:
          NFSIM_BIN: ${{ runner.temp }}/oracle-nfsim/build/NFsim
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          BNG3_NF_CONCURRENT_REPORT: ${{ runner.temp }}/issue176-concurrent-native.json
        shell: bash
        run: |
          set -euo pipefail
          NFSIM_REVISION=$(python -c 'import json; print(json.load(open("provenance/upstreams.lock.yml"))["sources"]["nfsim"]["revision"])')
          export NFSIM_REVISION
          python -m pytest --noconftest -q \
            tests/validation/release/cases/issue-176/test_nfnext_concurrent_ensemble.py

      - name: Measure NFnext CPU startup memory and throughput (#176)
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          BNG3_NFNEXT_MEASUREMENT_REPORT: ${{ runner.temp }}/issue176-measurement.json
        run: >-
          python -m pytest --noconftest -q
          tests/validation/release/cases/issue-176/test_nf_performance_measurement.py

      - name: Retain Issue 176 CPU measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue176-cpu-measurement-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/issue176-measurement.json
            ${{ runner.temp }}/issue176-concurrent-native.json
          if-no-files-found: error
          retention-days: 30

      - name: Record Issue 176 CPU ensemble release acceptance
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python scripts/ci/record_issue176_release.py \
            --source-revision "$BNG3_SOURCE_REVISION" \
            --report release-nf-ensemble="$RUNNER_TEMP/issue176-concurrent-native.json" \
            --report release-capability-coverage-176="$RUNNER_TEMP/issue176-measurement.json" \
            --output "$RUNNER_TEMP/issue-176-release-report.json" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload Issue 176 CPU ensemble evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue176-cpu-ensemble-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/issue-176-release-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Check NFnext identical-reactant combinatorial factor
        run: >-
          python -m pytest --noconftest -q
          tests/python/nfnext/test_nfnext_symmetric_reactants.py

      - name: Check NFnext compartment transport against independent binomial law
        run: >-
          python -m pytest --noconftest -q
          tests/python/nfnext/test_nfnext_compartment_transport.py
          tests/python/nfnext/test_nfnext_hybrid_compartments.py

      - name: Check NFnext TotalRate against independent exact Poisson law
        run: >-
          python -m pytest --noconftest -q
          tests/python/nfnext/test_nfnext_totalrate_observable.py

      - name: Check NFnext immigration-death against analytic mean and independent SSA
        run: >-
          python -m pytest --noconftest -q
          tests/python/nfnext/test_nfnext_immigration_death.py

      - name: Check NFnext reactant filters against independent binomial law
        run: >-
          python -m pytest --noconftest -q
          tests/python/nfnext/test_nfnext_filters_observable.py

      - name: Check NFnext reversible conversion against independent two-state law
        run: >-
          python -m pytest --noconftest -q
          tests/python/nfnext/test_nfnext_reversible_conversion.py

      - name: Verify spawned API worker identity
        run: |
          pytest -c tests/validation/pytest.ini \
            tests/validation/test_worker_package_identity.py -q

      - name: Run direct/XML NFsim construction checks
        shell: bash
        run: |
          set -euo pipefail
          NFSIM_BIN="$RUNNER_TEMP/oracle-nfsim/build/NFsim" \
            pytest -c tests/validation/pytest.ini \
              tests/validation/test_parity_nfsim.py \
              -m "nf and not slow" \
              -q

      - name: Run NFsim seed-state parity contracts
