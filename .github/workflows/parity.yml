name: Cross-tool parity

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      bounded:
        description: Use the finite PR scientific selection instead of the scheduled matrix
        required: false
        type: boolean
        default: false

concurrency:
  # Replace superseded PR work; isolate every manual/scheduled/main run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: read

env:
  CMAKE_BUILD_TYPE: Release
  CTEST_OUTPUT_ON_FAILURE: 1
  BNG3_CI_STRICT_ORACLES: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  oracle-lock:
    name: Validate parity source lock
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CI contract dependencies
        run: python -m pip install pytest numpy pyyaml scipy jsonschema python-libsbml sympy

      - name: Validate locked sources
        run: python scripts/ci/checkout_oracle.py --validate-only

      - name: Validate provenance structure
        run: python scripts/validate_provenance.py

      - name: Execute reconciliation prerequisite acceptance
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/ci/record_reconciliation_prerequisite.py \
            --revision "$BNG3_SOURCE_REVISION" \
            --output-dir "$RUNNER_TEMP/reconciliation-prerequisite"

      - name: Retain reconciliation prerequisite acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-prerequisite
          path: ${{ runner.temp }}/reconciliation-prerequisite

      - name: Run CI contract tests
        run: |
          python -m pytest \
            tests/test_ci_contract.py \
            tests/validation/test_parity_workflow_wiring.py \
            tests/validation/test_shared_decision_ownership.py \
            tests/validation/test_cpu_baseline_publication.py \
            tests/validation/test_nf_default_docs_consistency.py \
            tests/validation/test_option_decision_owner.py \
            tests/validation/test_record_issue176_release.py \
            tests/validation/test_record_issue176_honesty.py \
            tests/validation/test_record_issue166_release.py \
            tests/validation/test_record_issue152_release.py \
            tests/validation/test_record_issue152_honesty.py \
            tests/validation/test_record_issue178_release.py \
            tests/validation/test_record_issue178_honesty.py \
            tests/validation/release/cases/issue-178/test_backend_route_contract.py \
            tests/validation/test_release_recorder_scope.py \
            tests/validation/test_record_issue174_release.py \
            tests/validation/test_record_issue174_honesty.py \
            tests/validation/test_reconciliation_evidence.py \
            tests/validation/test_integrated_wiring.py \
            tests/validation/test_integrated.py \
            tests/validation/test_integrated_traces.py \
            tests/validation/test_integrated_cases.py \
            tests/validation/test_integrated_matrix.py \
            tests/validation/test_integrated_consumers.py \
            tests/validation/test_issue_queue.py \
            tests/validation/release/cases/issue-137/test_issue137_checks.py \
            tests/validation/test_acceptance_queue.py \
            tests/validation/test_sprint_s1_contract_projection.py \
            tests/validation/test_reporting.py \
            tests/validation/test_triage.py \
            tests/validation/test_replay.py \
            tests/validation/test_minimize.py \
            tests/validation/test_bngir_adversarial.py \
            tests/validation/test_integrated_boundaries.py \
            tests/validation/test_integrated_protocol.py \
            tests/validation/test_integrated_marginals.py \
            tests/validation/test_integrated_extensions.py \
            tests/validation/test_graph_identity.py \
            tests/validation/test_issue_142_release_record.py \
            tests/validation/test_release_recorder_bypass_truth.py \
            tests/validation/test_issue_147_release_record.py \
            tests/validation/test_issue_150_release_record.py \
            tests/validation/test_issue_154_release_record.py \
            tests/validation/test_issue_473_475_release_records.py \
            tests/validation/test_s6_simulate_receipt_consumer.py \
            tests/validation/test_nfsim_sweep_gate.py \
            tests/validation/test_harness_paths.py::test_required_oracle_fails_in_strict_ci \
            tests/validation/test_harness_paths.py::test_api_fixture_fails_in_strict_ci_and_skips_locally \
            -q -ra

  issue-137-inventory:
    name: Issue 137 capability-inventory reconciliation
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install pytest numpy pyyaml jsonschema

      - name: Run independent inventory-consumer controls
        run: python -m pytest -q tests/validation/release/cases/issue-137/

      - name: Record exact-revision structural inventory case receipts
        id: structural_cases
        continue-on-error: true
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/issue137-inventory"
          python scripts/ci/record_issue137_cases.py \
            --mode structural \
            --root . \
            --revision "$BNG3_SOURCE_REVISION" \
            --report "$RUNNER_TEMP/issue137-inventory/structural-cases.json"

      - name: Record exact-revision inventory acceptance
        id: inventory
        continue-on-error: true
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/issue137-inventory"
          case_args=()
          if [[ -s "$RUNNER_TEMP/issue137-inventory/structural-cases.json" ]]; then
            case_args+=(--case-report "$RUNNER_TEMP/issue137-inventory/structural-cases.json")
          fi
          python tests/validation/release/cases/issue-137/issue137_checks.py inventory \
            --root . --revision "$BNG3_SOURCE_REVISION" \
            "${case_args[@]}" \
            --report "$RUNNER_TEMP/issue137-inventory/report.json"

      - name: Retain inventory acceptance record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue137-inventory-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/issue137-inventory/
          if-no-files-found: error
          retention-days: 30

  corpus-tier-p:
    name: Tier-P corpus conformance (${{ matrix.shard }}/4)
    needs: oracle-lock
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      BNG3_PYTHON_TEST_MODE: installed
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and comparison dependencies
        run: |
          which cmake ninja gcc g++ perl > /dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y build-essential cmake ninja-build perl
          }
          python -m venv .venv
          .venv/bin/python -m pip install scikit-build-core pybind11 pytest numpy scipy pyyaml jsonschema python-libsbml libroadrunner

      - name: Checkout locked BioNetGen oracle
        run: |
          python scripts/ci/checkout_oracle.py \
            --name bionetgen \
            --destination "$RUNNER_TEMP/oracle-bionetgen" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Build locked BNG2 Network3 oracle
        shell: bash
        run: |
          set -euo pipefail
          network3="$RUNNER_TEMP/oracle-bionetgen/bng2/Network3"
          make -C "$network3" -f Makefile.cmake
          run_network="$RUNNER_TEMP/oracle-bionetgen/bng2/bin/run_network"
          test -x "$run_network"
          echo "$(dirname "$run_network")" >> "$GITHUB_PATH"

      - name: Checkout and build locked native NFsim oracle
        run: |
          set -euo pipefail
          python scripts/ci/checkout_oracle.py \
            --name nfsim \
            --destination "$RUNNER_TEMP/oracle-nfsim" \
            --summary-file "$GITHUB_STEP_SUMMARY"
          cmake -S "$RUNNER_TEMP/oracle-nfsim" \
            -B "$RUNNER_TEMP/oracle-nfsim/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DNFSIM_BUILD_EXECUTABLE=ON \
            -DNFSIM_BUILD_LIBRARY=OFF
          cmake --build "$RUNNER_TEMP/oracle-nfsim/build" --target NFsim --parallel 2
          test -x "$RUNNER_TEMP/oracle-nfsim/build/NFsim"

      - name: Install BNG3 package, native extension and CLI in one build
        run: |
          .venv/bin/python -m pip install --no-build-isolation \
            --config-settings=build-dir=build \
            --config-settings=cmake.define.BUILD_CLI=ON \
            ".[full,dev]"
        env:
          CMAKE_ARGS: "-DBUILD_CLI=ON -DBUILD_NFSIM_CLI=OFF -DBUILD_TESTS=OFF"

      - name: Verify installed BNG3 package and native identity
        run: |
          set -euo pipefail
          test -x build/cpp/bng_cpp
          .venv/bin/python scripts/ci/check_python_package_identity.py \
            --source-revision "$BNG3_SOURCE_REVISION" \
            --require-source-head \
            | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          BNG3_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run Tier-P corpus conformance shard
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m tests.validation.conformance \
            --suite harness \
            --corpus-tier p \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 4 \
            --simulate \
            --net-reload \
            --case-timeout 180 \
            --bng-cpp build/cpp/bng_cpp \
            --bng2-root "$RUNNER_TEMP/oracle-bionetgen" \
            --bng2-network-sha256 "$(sha256sum "$RUNNER_TEMP/oracle-bionetgen/bng2/bin/run_network" | cut -d ' ' -f 1)" \
            --nfsim-root "$RUNNER_TEMP/oracle-nfsim" \
            --nfsim-binary "$RUNNER_TEMP/oracle-nfsim/build/NFsim" \
            --nfsim-sha256 "$(sha256sum "$RUNNER_TEMP/oracle-nfsim/build/NFsim" | cut -d ' ' -f 1)" \
            --report-dir "$RUNNER_TEMP/corpus-tier-p-shard-${{ matrix.shard }}"

      - name: Upload Tier-P corpus shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bng3-corpus-tier-p-${{ github.event_name }}-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/corpus-tier-p-shard-${{ matrix.shard }}/report.json
          if-no-files-found: warn
          retention-days: 30

  issue-181-corpus:
    name: Issue 181 capability-driven corpus tiers
    needs: [corpus-tier-p]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install pytest numpy pyyaml jsonschema

      - name: Run independent corpus-consumer controls
        run: python -m pytest -q tests/validation/release/cases/issue-181/

      - name: Validate the frozen corpus manifest
        run: python scripts/validate_corpus_manifest.py

      - name: Produce an interrupted-run shard resume receipt
        run: python scripts/ci/replay_corpus_shard_resume.py --evidence-dir "$RUNNER_TEMP/replay"

      - name: Download exact-revision Tier-P corpus shard results
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: bng3-corpus-tier-p-${{ github.event_name }}-${{ github.run_id }}-shard-*
          path: ${{ runner.temp }}/corpus-shards

      - name: Record exact-revision corpus acceptance
        id: corpus
        continue-on-error: true
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/issue181-corpus"
          shopt -s nullglob
          case_args=()
          for shard_report in \
            "$RUNNER_TEMP"/corpus-shards/*/report.json \
            "$RUNNER_TEMP"/corpus-shards/report.json; do
            if [[ -s "$shard_report" ]]; then
              case_args+=(--case-report "$shard_report")
            fi
          done
          python tests/validation/release/cases/issue-181/corpus_release_checks.py \
            --root . --revision "$BNG3_SOURCE_REVISION" \
            --replay-receipt "$RUNNER_TEMP/replay/replay.json" \
            "${case_args[@]}" \
            --report "$RUNNER_TEMP/issue181-corpus/report.json"

      - name: Retain corpus acceptance record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue181-corpus-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/issue181-corpus/report.json
            ${{ runner.temp }}/replay/replay.json
          if-no-files-found: error
          retention-days: 30

  issue-471-oracle-protection:
    name: Issue 471 independent-oracle protection
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install pytest numpy pyyaml scipy jsonschema

      - name: Run independent oracle-consumer controls
        run: python -m pytest -q tests/validation/release/cases/issue-471/test_issue471_checks.py

      - name: Produce an interrupted-run replay receipt
        run: python scripts/ci/replay_corpus_shard_resume.py --evidence-dir "$RUNNER_TEMP/replay"

      - name: Record protected expectations and mutation controls
        id: tamper
        continue-on-error: true
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/ci/record_issue471_tamper.py \
            --base "${{ github.event.pull_request.base.sha || github.sha }}" \
            --revision "$BNG3_SOURCE_REVISION" \
            --report "$RUNNER_TEMP/tamper.json"

      - name: Record oracle independence declaration audit
        id: oracle
        continue-on-error: true
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/oracle-receipts"
          python tests/validation/release/cases/issue-471/issue471_checks.py oracle \
            --root . --receipts "$RUNNER_TEMP/oracle-receipts" \
            --revision "$BNG3_SOURCE_REVISION" --report "$RUNNER_TEMP/oracle.json"

      - name: Record workflow topology with the replay receipt
        id: topology
        continue-on-error: true
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tests/validation/release/cases/issue-471/issue471_checks.py topology \
            --workflows-dir .github/workflows --all-workflows \
            --revision "$BNG3_SOURCE_REVISION" \
            --replay-receipt "$RUNNER_TEMP/replay/replay.json" \
            --report "$RUNNER_TEMP/topology.json"

      - name: Join the exact-revision issue-471 release record
        id: join
        continue-on-error: true
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/issue471-acceptance"
          python scripts/ci/record_issue471_release.py \
            --revision "$BNG3_SOURCE_REVISION" \
            --oracle-report "$RUNNER_TEMP/oracle.json" \
            --topology-report "$RUNNER_TEMP/topology.json" \
            --tamper-report "$RUNNER_TEMP/tamper.json" \
            --report "$RUNNER_TEMP/issue471-acceptance/report.json"

      - name: Retain issue-471 acceptance record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue471-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/issue471-acceptance/report.json
            ${{ runner.temp }}/oracle.json
            ${{ runner.temp }}/topology.json
            ${{ runner.temp }}/tamper.json
          if-no-files-found: error
          retention-days: 30

  issue-184-cpu-release:
    name: Issue 184 CPU release qualification consumer
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install pytest numpy pyyaml tomli

      - name: Run independent CPU-release consumer controls
        run: python -m pytest -q tests/validation/release/cases/issue-184/

      - name: Record exact-revision CPU release qualification
        id: release
        continue-on-error: true
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/issue184-release"
          python tests/validation/release/cases/issue-184/cpu_release_checks.py \
            --root . --revision "$BNG3_SOURCE_REVISION" \
            --report "$RUNNER_TEMP/issue184-release/report.json"

      - name: Retain CPU release qualification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue184-cpu-release-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/issue184-release/report.json
          if-no-files-found: error
          retention-days: 30

  upstream-reconciliation-history:
    name: release-reconciliation-pins
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out the locked upstream sources
        run: |
          for source in bionetgen nfsim pybionetgen; do
            python scripts/ci/checkout_oracle.py --name "$source" \
              --destination "$RUNNER_TEMP/reconciliation/$source"
          done

      - name: Compare the ledgers with upstream history and fixture bytes
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/validate_reconciliation_tests.py \
            --candidate-revision "$BNG3_SOURCE_REVISION" \
            --bionetgen "$RUNNER_TEMP/reconciliation/bionetgen" \
            --nfsim "$RUNNER_TEMP/reconciliation/nfsim" \
            --pybionetgen "$RUNNER_TEMP/reconciliation/pybionetgen" \
            --history-report "$RUNNER_TEMP/reconciliation-history.json"

      - name: Retain the upstream history report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-reconciliation-history
          path: ${{ runner.temp }}/reconciliation-history.json

  bng2-parity:
    name: BNG3 numerical, expression and export parity
    needs: oracle-lock
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      BNG3_PYTHON_TEST_MODE: installed
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and comparison dependencies
        run: |
          which cmake ninja gcc g++ perl > /dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y build-essential cmake ninja-build perl
          }
          python -m venv .venv
          .venv/bin/python -m pip install scikit-build-core pybind11 pytest numpy scipy libroadrunner

      - name: Checkout locked BioNetGen oracle
        run: |
          python scripts/ci/checkout_oracle.py \
            --name bionetgen \
            --destination "$RUNNER_TEMP/oracle-bionetgen" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Build locked BNG2 Network3 oracle
        shell: bash
        run: |
          set -euo pipefail
          network3="$RUNNER_TEMP/oracle-bionetgen/bng2/Network3"
          make -C "$network3" -f Makefile.cmake
          run_network="$RUNNER_TEMP/oracle-bionetgen/bng2/bin/run_network"
          test -x "$run_network"
          echo "$(dirname "$run_network")" >> "$GITHUB_PATH"
          digest=$(sha256sum "$run_network" | cut -d ' ' -f 1)
          source_revision=$(.venv/bin/python -c 'import json; print(json.load(open("provenance/upstreams.lock.yml", encoding="utf-8"))["sources"]["bionetgen"]["revision"])')
          {
            echo "### BNG2 Network3 oracle build"
            echo ""
            echo "- Locked source revision: $source_revision"
            echo "- Linux run_network SHA-256: $digest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Provide sbmlTranslator for legacy SBML inputs
        run: |
          set -euo pipefail
          python scripts/ci/checkout_oracle.py --name pybionetgen \
            --destination "$RUNNER_TEMP/oracle-pybionetgen" \
            --summary-file "$GITHUB_STEP_SUMMARY"
          python -m venv "$RUNNER_TEMP/oracle-translator-venv"
          "$RUNNER_TEMP/oracle-translator-venv/bin/python" -m pip install \
            -r "$RUNNER_TEMP/oracle-pybionetgen/requirements.txt"
          oracle_bin="$RUNNER_TEMP/oracle-bionetgen/bng2/bin"
          mkdir -p "$oracle_bin"
          printf '%s\n' '#!/bin/sh' 'PYTHONPATH="$RUNNER_TEMP/oracle-pybionetgen" exec "$RUNNER_TEMP/oracle-translator-venv/bin/python" "$RUNNER_TEMP/oracle-pybionetgen/bionetgen/atomizer/sbmlTranslator.py" "$@"' > "$oracle_bin/sbmlTranslator"
          chmod +x "$oracle_bin/sbmlTranslator"
          test -x "$oracle_bin/sbmlTranslator"
          "$oracle_bin/sbmlTranslator" --help > /dev/null

      - name: Checkout and build locked native NFsim oracle
        run: |
          set -euo pipefail
          python scripts/ci/checkout_oracle.py \
            --name nfsim \
            --destination "$RUNNER_TEMP/oracle-nfsim" \
            --summary-file "$GITHUB_STEP_SUMMARY"
          cmake -S "$RUNNER_TEMP/oracle-nfsim" \
            -B "$RUNNER_TEMP/oracle-nfsim/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DNFSIM_BUILD_EXECUTABLE=ON \
            -DNFSIM_BUILD_LIBRARY=OFF
          cmake --build "$RUNNER_TEMP/oracle-nfsim/build" --target NFsim --parallel 2
          nfsim="$RUNNER_TEMP/oracle-nfsim/build/NFsim"
          test -x "$nfsim"
          digest=$(sha256sum "$nfsim" | cut -d ' ' -f 1)
          echo "NFSIM_BIN=$nfsim" >> "$GITHUB_ENV"
          echo "- Conformance lane native NFsim SHA-256: $digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Install BNG3 package, native extension and CLI in one build
        run: |
          .venv/bin/python -m pip install --no-build-isolation \
            --config-settings=build-dir=build \
            --config-settings=cmake.define.BUILD_CLI=ON \
            ".[full,dev]"
        env:
          CMAKE_ARGS: "-DBUILD_CLI=ON -DBUILD_NFSIM_CLI=OFF -DBUILD_TESTS=OFF"

      - name: Verify installed BNG3 package and native identity
        id: bng3_identity
        run: |
          set -euo pipefail
