            tests/validation/release/cases/issue-171/test_python_install_matrix.py \
            --junitxml="$RUNNER_TEMP/issue-171-artifacts/install-matrix.xml"

      - name: Record exact-revision Issue 471 PyBioNetGen differential receipts
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue471-pybionetgen"
          python scripts/ci/record_issue471_pybionetgen_receipts.py \
            --root . \
            --revision "$BNG3_SOURCE_REVISION" \
            --pybionetgen-root "$RUNNER_TEMP/oracle-pybionetgen" \
            --receipts-dir "$RUNNER_TEMP/issue471-pybionetgen/receipts" \
            --artifacts-dir "$RUNNER_TEMP/issue471-pybionetgen/artifacts" \
            --summary-out "$RUNNER_TEMP/issue471-pybionetgen/summary.json"

      - name: Upload Issue 471 PyBioNetGen differential receipts
        if: always()
