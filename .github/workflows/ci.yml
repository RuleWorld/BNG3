name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Keep hosted evidence attached to the exact PR head being evaluated. A
  # checklist/documentation push must not cancel the preceding semantic run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  CMAKE_BUILD_TYPE: Release
  CTEST_OUTPUT_ON_FAILURE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Code Quality
  # ═══════════════════════════════════════════════════════════════════════════

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters and policy dependencies
        # Pinned: unpinned black floated 26.5.1 -> 26.10.0 overnight (2026-10-04/05)
        # and red-lit every PR branch whose content the old version accepted.
        run: pip install "black==26.10.0" "ruff==0.15.1" pytest numpy pyyaml

      - name: Check Python formatting (Black)
        # The whole repository, not a path allowlist: an ungated file is a
        # file whose formatting nobody notices until it is already wrong.
        # Black respects .gitignore, so build/ and other local artefacts
        # stay out without an explicit exclude.
        run: black --check --diff --target-version py312 .

      - name: Run ruff linter
        # bench/ and benchmarks/ are excluded on purpose: they carry F401/F841
        # findings that need a human judgement about dead benchmark locals
        # rather than a mechanical fix. F821 also finds an unresolved
        # shape_models in benchmarks/gpu/run_gpu_bench.py; that experimental
        # benchmark stays outside this maintained runtime/test/tooling gate.
        # Vendored Atomizer/assets exclusions are documented in pyproject.toml.
        run: ruff check python/ tests/ scripts/ formal/

      - name: Validate integration provenance structure
        run: python scripts/validate_provenance.py

      - name: Validate frozen corpus selection
        run: python scripts/validate_corpus_manifest.py

      - name: Check corpus selection is generated
        run: python scripts/generate_corpus_manifest.py --check

      - name: Validate committed golden manifests
        shell: bash
        run: |
          set -eu
          found=0
          while IFS= read -r -d '' manifest; do
            found=1
            python scripts/validate_golden_manifest.py --manifest "$manifest"
          done < <(find provenance/golden -type f -name manifest.json -print0)
          if [ "$found" -eq 0 ]; then
            echo "No golden bundle manifests committed; source/oracle lock approval is still pending."
          fi

      - name: Enforce validation exception budget
        run: python -m tests.validation.exception_ledger --max-exceptions 1

      - name: Run CI contract tests
        run: python -m pytest tests/test_ci_contract.py -q

  # ═══════════════════════════════════════════════════════════════════════════
  # C++ Build & Test (BNG engine with embedded NFsim library)
  # ═══════════════════════════════════════════════════════════════════════════

  cpp-build:
    name: C++ (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: macos-14
            compiler: clang-arm64
            cc: clang
            cxx: clang++
          - os: windows-2022
            compiler: msvc
            cc: cl
            cxx: cl

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation harness dependencies
        run: python -m pip install pytest numpy

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install cmake ninja

      - name: Setup MSVC (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake (Unix)
        if: "!startsWith(matrix.os, 'windows')"
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_CLI=ON \
            -DBUILD_NFSIM_CLI=OFF \
            -DBUILD_TESTS=ON

      - name: Configure CMake (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_CLI=ON \
            -DBUILD_NFSIM_CLI=OFF \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }}

      - name: Run C++ unit tests
        run: ctest --test-dir build --output-on-failure -C ${{ env.CMAKE_BUILD_TYPE }}

      - name: Upload bng_cpp artifact
        uses: actions/upload-artifact@v4
        with:
          name: bng_cpp-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/cpp/bng_cpp*

  # ═══════════════════════════════════════════════════════════════════════════
  # C++ with AddressSanitizer (catch memory bugs)
  # ═══════════════════════════════════════════════════════════════════════════

  cpp-asan:
    name: C++ ASan (Ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          python -m pip install pytest numpy

      - name: Configure with ASan
        env:
          CC: gcc-12
          CXX: g++-12
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_CLI=ON \
            -DBUILD_TESTS=ON

      - name: Build
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: cmake --build build

      - name: Run tests under ASan
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build --output-on-failure


  # ═══════════════════════════════════════════════════════════════════════════
  # CUDA batch-SSA backend
  #
  # GitHub-hosted runners ship neither an NVIDIA device nor a CUDA toolkit, so
  # this job installs a pinned toolkit from NVIDIA's apt repository in order to
  # prove that engine/gpu/CudaSsaBackend.cu actually compiles. It then runs the
  # CUDA-enabled build with no device attached, which must still produce
  # correct CPU-pool results.
  #
  # The toolkit install is deliberately NOT optional. Until 2026-10-03 this job
  # probed for nvcc and gated every subsequent step on finding one. A hosted
  # runner never has one, so the job was permanently green having compiled no
  # CUDA at all — a vacuous pass. It now fails loudly if nvcc cannot be
  # installed, and asserts that the CUDA object file actually reached the
  # build.
  #
  # What this job still does NOT cover: timed kernel behaviour on real
  # hardware, which needs a self-hosted runner with an NVIDIA GPU attached.
  # ═══════════════════════════════════════════════════════════════════════════

  cpp-cuda:
    name: C++ batch SSA (CUDA backend, Ubuntu)
    runs-on: ubuntu-22.04
    env:
      # Series-level pin: NVIDIA keeps every published series in the repo, so
      # this keeps resolving, unlike a full patch pin that can be withdrawn.
      # CUDA 12.x is required because CMakeLists.txt defaults
      # CMAKE_CUDA_ARCHITECTURES to "70;80", which CUDA 13 no longer accepts.
      CUDA_TOOLKIT_SERIES: "12-4"
      CUDA_TOOLKIT_ROOT: "/usr/local/cuda-12.4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build curl ca-certificates binutils
          python -m pip install pytest numpy

      - name: Install the CUDA toolkit
        run: |
          set -euo pipefail
          repo="https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/x86_64"
          curl -fsSL -o /tmp/cuda-keyring.deb "$repo/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "cuda-nvcc-${CUDA_TOOLKIT_SERIES}" \
            "cuda-cudart-dev-${CUDA_TOOLKIT_SERIES}"
          echo "${CUDA_TOOLKIT_ROOT}/bin" >> "$GITHUB_PATH"
          echo "CUDA_HOME=${CUDA_TOOLKIT_ROOT}" >> "$GITHUB_ENV"

      - name: Require nvcc
        run: |
          set -euo pipefail
          command -v nvcc
          nvcc --version
          test -x "${CUDA_TOOLKIT_ROOT}/bin/nvcc"

      - name: Configure with the CUDA backend
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -DBNG3_ENABLE_CUDA=ON \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_CLI=ON \
            -DBUILD_TESTS=ON 2>&1 | tee configure.log

      - name: Assert the CUDA backend was compiled in
        run: |
          grep -q "BNG3 batch SSA GPU backends: .*cuda" configure.log

      - name: Build
        run: cmake --build build

      - name: Assert the CUDA translation unit really compiled
        run: |
          set -euo pipefail
          obj="$(find build -name 'CudaSsaBackend.cu.o' -print -quit)"
          test -n "$obj"
          echo "compiled object: $obj"
          nm -C "$obj" | grep -q 'probeCudaBackend'
          echo "::notice::CudaSsaBackend.cu produced a real object file."

      - name: Run tests with the CUDA backend compiled in
        run: ctest --test-dir build --output-on-failure

      - name: Batch SSA still runs without a CUDA device
        run: |
          cat > /tmp/cuda_batch.bngl <<'BNGL'
          begin parameters
            k 0.5
          end parameters
          begin species
            S1() 20
          end species
          begin reactions
            S1() -> S1() k
          end reactions
          begin observables
            Species S1Total S1() #S1Total
          end observables
          simulate_ssa({t_end=>5, n_steps=>10, batch_size=>64})
          BNGL
          ./build/cpp/bng_cpp /tmp/cuda_batch.bngl
          test -f /tmp/cuda_batch.gdat

  # ═══════════════════════════════════════════════════════════════════════════
  # Batch SSA CPU reference parity
  #
  # The GPU comparison in tests/test_batch_ssa_statistical_parity.py needs an
  # accelerator and therefore only runs on a maintainer's machine. Its
  # CPU-mode counterpart needs nothing but a CPU and is the part CI can gate
  # on: exact conservation identities and the closed-form Binomial(20, 1/6)
  # equilibrium of models/isomerization.bngl, with a fixed seed so the run is
  # reproducible on any libc or CPU.
  # ═══════════════════════════════════════════════════════════════════════════

  batch-ssa-cpu-reference:
    name: Batch SSA CPU reference parity (Ubuntu)
    runs-on: ubuntu-22.04
    env:
      CC: gcc-12
      CXX: g++-12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          python -m pip install pytest numpy scipy

      - name: Configure with the Python bindings
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -DBUILD_PYTHON_BINDINGS=ON \
            -DBUILD_CLI=OFF \
            -DBUILD_NFSIM_CLI=OFF \
            -DBUILD_TESTS=OFF

      - name: Build
        run: cmake --build build

      - name: Assert the batch SSA CPU entry point was built
        run: ls -1 build/cpp/_bionetgen_cpp*

      - name: Batch SSA CPU pool matches exact analytical results
        run: python tests/test_batch_ssa_statistical_parity.py --mode cpu

      - name: Summarise the batch SSA reference result
        if: always()
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          BATCH_SSA_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo "### Batch SSA CPU reference parity"
            echo ""
            echo "| Source revision | Result |"
            echo "| --- | --- |"
            echo "| \`$BNG3_SOURCE_REVISION\` | $BATCH_SSA_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════════════
  # Network Generation Validation (C++ vs Perl reference .net files)
  # ═══════════════════════════════════════════════════════════════════════════

  validation:
    name: Validation (full corpus, ${{ matrix.os }})
    needs: cpp-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: bng_cpp-ubuntu-22.04-gcc-12
          - os: macos-14
            artifact: bng_cpp-macos-14-clang-arm64
          - os: windows-2022
            artifact: bng_cpp-windows-2022-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install comparison dependencies
        run: python -m pip install numpy

      - name: Download bng_cpp artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/cpp/

      - name: Make executable (Unix)
        if: "!startsWith(matrix.os, 'windows')"
        run: chmod +x build/cpp/bng_cpp*

      - name: Run full validation corpus with no exclusions
        shell: bash
        run: |
          BNG=build/cpp/bng_cpp${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
          python scripts/validate.py --bng-cpp "$BNG" --strict-references \
            --validation-manifest tests/validation/validation_manifest.json \
            --summary-file "$GITHUB_STEP_SUMMARY" --verbose

  # ═══════════════════════════════════════════════════════════════════════════
  # BNGL corpus parse inventory (not an NFsim simulation check)
  # ═══════════════════════════════════════════════════════════════════════════

  corpus-parse:
    name: BNGL Corpus Parse Inventory
    needs: cpp-build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download bng_cpp artifact
        uses: actions/download-artifact@v4
        with:
          name: bng_cpp-ubuntu-22.04-gcc-12
          path: build/cpp/

      - name: Make executable
        run: chmod +x build/cpp/bng_cpp

      - name: Inventory parser coverage
        run: |
          set -euo pipefail
          PASS=0
          UNSUPPORTED=0
          TOTAL=0
          while IFS= read -r -d '' bngl; do
            TOTAL=$((TOTAL + 1))
            model_name=$(basename "$bngl" .bngl)
            echo -n "  $model_name... "

            if build/cpp/bng_cpp --check "$bngl" > /dev/null 2>&1; then
              echo "PASS (parse)"
              PASS=$((PASS + 1))
            else
              echo "UNSUPPORTED (parse error)"
              UNSUPPORTED=$((UNSUPPORTED + 1))
            fi
          done < <(find models -type f -name '*.bngl' -print0)
          if [ "$TOTAL" -eq 0 ]; then
            echo "ERROR: no BNGL models were discovered"
            exit 1
          fi
          SOURCE_REVISION="${BNG3_SOURCE_REVISION:-${GITHUB_SHA:-unknown}}"
          BNG_CPP_DIGEST=$(sha256sum build/cpp/bng_cpp | cut -d ' ' -f 1)
          {
            echo "### BNGL Corpus Parse Inventory"
            echo ""
            echo "This check inventories parser acceptance only; it does not run NFsim."
            echo ""
            echo "| Source revision | bng_cpp SHA-256 |"
            echo "| --- | --- |"
            echo "| `$SOURCE_REVISION` | `$BNG_CPP_DIGEST` |"
            echo ""
            echo "| Total | Parsed | Unsupported |"
            echo "| ---: | ---: | ---: |"
            echo "| $TOTAL | $PASS | $UNSUPPORTED |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          BNG3_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

  # ═══════════════════════════════════════════════════════════════════════════
  # Python Package Build & Test (full matrix)
  # ═══════════════════════════════════════════════════════════════════════════

  python-jax:
    name: Optional JAX CPU (ODE and SSA availability)
    runs-on: ubuntu-22.04
    env:
      BNG3_PYTHON_TEST_MODE: installed
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install package with optional JAX dependencies
        run: python -m pip install '.[jax]' pytest

      - name: Verify installed package identity
        run: python scripts/ci/check_python_package_identity.py
        env:
          BNG3_SOURCE_REVISION: ${{ github.sha }}
          BNG3_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Require optional dependencies and CPU device
        run: |
          python -c 'import jax, jaxlib; print(jax.__version__, jaxlib.__version__, jax.devices()); assert jax.default_backend() == "cpu"'

      - name: Test JAX ODE and explicit SSA unavailability
        # SSA is unavailable, even with JAX installed. Flattening is a native
        # data export and does not establish accelerator simulation support.
        run: python -m pytest tests/python/test_jax_ode.py tests/python/test_jax_ssa.py -q

  python-test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    needs: [cpp-build]
    runs-on: ${{ matrix.os }}
    env:
      BNG3_PYTHON_TEST_MODE: installed
      BNG_CPP: ${{ github.workspace }}/build/cpp/bng_cpp${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-22.04
            cpp_artifact: bng_cpp-ubuntu-22.04-gcc-12
          - os: macos-14
            cpp_artifact: bng_cpp-macos-14-clang-arm64
          - os: windows-2022
            cpp_artifact: bng_cpp-windows-2022-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Download matching bng_cpp artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.cpp_artifact }}
          path: build/cpp/

      - name: Make bng_cpp executable (Unix)
        if: "!startsWith(matrix.os, 'windows')"
        run: chmod +x build/cpp/bng_cpp

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install system dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install cmake ninja

      - name: Setup MSVC (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Python build dependencies
        run: pip install scikit-build-core pybind11 numpy click packaging pytest pytest-cov cement colorlog pyparsing pylru pandas matplotlib python-libsbml pyyaml lxml networkx sympy seaborn xmltodict

      - name: Build and install package (Windows)
        if: startsWith(matrix.os, 'windows')
        run: pip install . -v
        env:
          CMAKE_ARGS: "-DBUILD_TESTS=OFF -DBUILD_CLI=OFF -DCMAKE_VERBOSE_MAKEFILE=ON"
          SKBUILD_VERBOSE: "1"

      - name: Build and install package (Unix)
        if: "!startsWith(matrix.os, 'windows')"
        run: |
          python -m pip wheel . --no-deps --wheel-dir wheelhouse -v
          python -m pip install --force-reinstall --no-deps wheelhouse/*.whl
        env:
          CMAKE_ARGS: "-DBUILD_TESTS=OFF -DBUILD_CLI=OFF"

      - name: Verify installed package identity
        run: python scripts/ci/check_python_package_identity.py
        env:
          BNG3_SOURCE_REVISION: ${{ github.sha }}
          BNG3_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Seed isolated Matplotlib font cache (Unix)
        if: matrix.os == 'ubuntu-22.04' && (matrix.python-version == '3.9' || matrix.python-version == '3.10')
        run: python scripts/prepare_matplotlib_cache.py
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib

      - name: Run Python tests
        run: pytest tests/python/test_sbml_import.py -v --tb=short
        env:
          SYMPY_USE_GMPY: "0"
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib

      - name: Run Python tests
        run: pytest tests/python/ -v --tb=short --cov=bionetgen --cov-report=xml --ignore=tests/python/test_sbml_import.py
        env:
          SYMPY_USE_GMPY: "0"
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib

      - name: Upload coverage
        if: matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ═══════════════════════════════════════════════════════════════════════════
  # Python Integration Tests (atomizer, legacy compat)
  # ═══════════════════════════════════════════════════════════════════════════

  python-integration:
    name: Integration Tests
    needs: [cpp-build, python-test]
    runs-on: ubuntu-22.04
    env:
      BNG3_PYTHON_TEST_MODE: installed
      BNG_CPP: ${{ github.workspace }}/build/cpp/bng_cpp
    steps:
      - uses: actions/checkout@v4

      - name: Download bng_cpp artifact
        uses: actions/download-artifact@v4
        with:
          name: bng_cpp-ubuntu-22.04-gcc-12
          path: build/cpp/

      - name: Make bng_cpp executable
        run: chmod +x build/cpp/bng_cpp

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          pip install scikit-build-core pybind11 numpy pytest
          pip install ".[full]"
        env:
          CMAKE_ARGS: "-DBUILD_TESTS=OFF -DBUILD_CLI=OFF"

      - name: Verify installed package identity
        run: python scripts/ci/check_python_package_identity.py
        env:
          BNG3_SOURCE_REVISION: ${{ github.sha }}
          BNG3_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run atomizer tests
        run: pytest tests/python/ -v -k "atomizer" --tb=short
        env:
          SYMPY_USE_GMPY: "0"

      - name: Run model loading tests
        run: pytest tests/python/ -v -k "model" --tb=short
        env:
          SYMPY_USE_GMPY: "0"

      - name: Check workflow YAML integrity and test-selector reachability
        # The full extra supplies PyYAML for the root-level workflow contracts.
        run: pytest tests/test_workflow_contract.py -q --tb=short
        env:
          SYMPY_USE_GMPY: "0"

      - name: Test CLI commands
        run: |
          bionetgen --version
          echo 'begin model
          begin parameters
            k 0.1
          end parameters
          begin molecule types
            A()
          end molecule types
          begin seed species
            A() 100
          end seed species
          begin observables
            Molecules Atot A()
          end observables
          begin reaction rules
            A() -> 0 k
          end reaction rules
          end model' > /tmp/test.bngl
          bionetgen check /tmp/test.bngl
          bionetgen run /tmp/test.bngl --method ode --t-end 10
        env:
          SYMPY_USE_GMPY: "0"

  # ═══════════════════════════════════════════════════════════════════════════
  # Source Distribution Installation Smoke Test
  # ═══════════════════════════════════════════════════════════════════════════

  package-smoke:
    name: Package Smoke (sdist)
    needs: [python-test]
    runs-on: ubuntu-22.04
    env:
      BNG3_PYTHON_TEST_MODE: installed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging and native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          python -m pip install build

      - name: Build source distribution
        run: python -m build --sdist

      - name: Install source distribution in clean environment
        shell: bash
        run: |
          set -eu
          python -m venv "$RUNNER_TEMP/bng3-package-smoke"
          "$RUNNER_TEMP/bng3-package-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/bng3-package-smoke/bin/python" -m pip install numpy click packaging pytest
          "$RUNNER_TEMP/bng3-package-smoke/bin/python" -m pip install --no-deps dist/*.tar.gz
        env:
          CMAKE_ARGS: "-DBUILD_TESTS=OFF -DBUILD_CLI=OFF"

      - name: Verify sdist package identity
        run: >-
          "$RUNNER_TEMP/bng3-package-smoke/bin/python"
          scripts/ci/check_python_package_identity.py
        env:
          BNG3_SOURCE_REVISION: ${{ github.sha }}
          BNG3_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Smoke installed package
        shell: bash
        run: |
          set -eu
          "$RUNNER_TEMP/bng3-package-smoke/bin/python" -m pytest \
            tests/python/test_thermodynamic_parse_path.py -q --tb=short
          "$RUNNER_TEMP/bng3-package-smoke/bin/bionetgen" --version
          "$RUNNER_TEMP/bng3-package-smoke/bin/bionetgen" --help

  # ═══════════════════════════════════════════════════════════════════════════
  # Wheel Building (binary distribution)
  # ═══════════════════════════════════════════════════════════════════════════

  wheels:
    name: Wheels (${{ matrix.os }})
    needs: [cpp-build, python-test, validation]
    runs-on: ${{ matrix.os }}
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            macos_arch: x86_64
            macos_deployment_target: "11.0"
          # macos-13 is retired; macos-15-intel is the supported x86_64 label
          # for public GitHub-hosted runners. Its deployment target is 11.0,
          # not 10.13: libc++ annotates all of <filesystem> with
          # availability(macos, introduced = 10.15), so anything below that
          # turns std::filesystem::path into a hard compile error.
          - os: macos-15-intel
            macos_arch: x86_64
            macos_deployment_target: "11.0"
          - os: macos-14
            macos_arch: arm64
            macos_deployment_target: "11.0"
          - os: windows-2022
            macos_arch: x86_64
            macos_deployment_target: "11.0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup MSVC (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install cibuildwheel
        run: pip install cibuildwheel==4.2.1

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_* *-manylinux_i686 *-win32"
          CIBW_BUILD_VERBOSITY: 1
          CIBW_TEST_REQUIRES: pytest numpy click
          CIBW_TEST_COMMAND: >-
            pytest {project}/tests/python/test_cpp_backend.py -v --tb=short &&
            bionetgen --version &&
            bionetgen --help
          CIBW_ENVIRONMENT: CMAKE_ARGS="-DBUILD_TESTS=OFF -DBUILD_CLI=OFF"
          # Build one native architecture per macOS runner; macos-15-intel
          # supplies x86_64 and macos-14 supplies arm64 without duplication.
          CIBW_ARCHS_MACOS: ${{ matrix.macos_arch }}
          CIBW_ENVIRONMENT_MACOS: >-
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}
            CMAKE_ARGS="-DBUILD_TESTS=OFF -DBUILD_CLI=OFF
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}"
          # NumPy 2.5+ wheels require a newer compiler/glibc baseline than
          # manylinux2014; manylinux_2_28 provides a binary wheel target.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # ═══════════════════════════════════════════════════════════════════════════
  # Source Distribution
  # ═══════════════════════════════════════════════════════════════════════════

  sdist:
    name: Source Distribution
    needs: [python-test]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ═══════════════════════════════════════════════════════════════════════════
  # Publish to PyPI (on tagged release)
  # ═══════════════════════════════════════════════════════════════════════════

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ═══════════════════════════════════════════════════════════════════════════
  # Docker Image (for containerized use)
  # ═══════════════════════════════════════════════════════════════════════════

  docker:
    name: Docker Image
    needs: [python-test]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
