name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  # Keep hosted evidence attached to the exact PR head being evaluated. A
  # checklist/documentation push must not cancel the preceding semantic run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  CMAKE_BUILD_TYPE: Release
  CTEST_OUTPUT_ON_FAILURE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Code Quality
  # ═══════════════════════════════════════════════════════════════════════════

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters and policy dependencies
        run: pip install black ruff pytest numpy

      - name: Check Python formatting (Black)
        run: black --check --diff --target-version py312 python/ tests/python/ scripts/

      - name: Run ruff linter
        run: ruff check python/ tests/python/ scripts/

      - name: Validate integration provenance structure
        run: python scripts/validate_provenance.py

      - name: Validate frozen corpus selection
        run: python scripts/validate_corpus_manifest.py

      - name: Check corpus selection is generated
        run: python scripts/generate_corpus_manifest.py --check

      - name: Validate committed golden manifests
        shell: bash
        run: |
          set -eu
          found=0
          while IFS= read -r -d '' manifest; do
            found=1
            python scripts/validate_golden_manifest.py --manifest "$manifest"
          done < <(find provenance/golden -type f -name manifest.json -print0)
          if [ "$found" -eq 0 ]; then
            echo "No golden bundle manifests committed; source/oracle lock approval is still pending."
          fi

      - name: Enforce validation exception budget
        run: python -m tests.validation.exception_ledger --max-exceptions 1

      - name: Run CI contract tests
        run: python -m pytest tests/test_ci_contract.py -q

  # ═══════════════════════════════════════════════════════════════════════════
  # C++ Build & Test (BNG engine with embedded NFsim library)
  # ═══════════════════════════════════════════════════════════════════════════

  cpp-build:
    name: C++ (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: macos-14
            compiler: clang-arm64
            cc: clang
            cxx: clang++
          - os: windows-2022
            compiler: msvc
            cc: cl
            cxx: cl

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install cmake ninja

      - name: Setup MSVC (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake (Unix)
        if: "!startsWith(matrix.os, 'windows')"
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_CLI=ON \
            -DBUILD_NFSIM_CLI=OFF \
            -DBUILD_TESTS=ON

      - name: Configure CMake (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_CLI=ON \
            -DBUILD_NFSIM_CLI=OFF \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }}

      - name: Run C++ unit tests
        run: ctest --test-dir build --output-on-failure -C ${{ env.CMAKE_BUILD_TYPE }}

      - name: Upload bng_cpp artifact
        uses: actions/upload-artifact@v4
        with:
          name: bng_cpp-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/cpp/bng_cpp*

  # ═══════════════════════════════════════════════════════════════════════════
  # C++ with AddressSanitizer (catch memory bugs)
  # ═══════════════════════════════════════════════════════════════════════════

  cpp-asan:
    name: C++ ASan (Ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Configure with ASan
        env:
          CC: gcc-12
          CXX: g++-12
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_CLI=ON \
            -DBUILD_TESTS=ON

      - name: Build
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: cmake --build build

      - name: Run tests under ASan
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build --output-on-failure

  # ═══════════════════════════════════════════════════════════════════════════
  # Network Generation Validation (C++ vs Perl reference .net files)
  # ═══════════════════════════════════════════════════════════════════════════

  validation:
    name: Validation (supported reference subset, ${{ matrix.os }})
    needs: cpp-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: bng_cpp-ubuntu-22.04-gcc-12
          - os: macos-14
            artifact: bng_cpp-macos-14-clang-arm64
          - os: windows-2022
            artifact: bng_cpp-windows-2022-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install comparison dependencies
        run: python -m pip install numpy

      - name: Download bng_cpp artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/cpp/

      - name: Make executable (Unix)
        if: "!startsWith(matrix.os, 'windows')"
        run: chmod +x build/cpp/bng_cpp*

      - name: Run supported validation against reference .net files
        shell: bash
        run: |
          BNG=build/cpp/bng_cpp${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
          python scripts/validate.py --bng-cpp "$BNG" --strict-references \
            --skip-file tests/validation/reference_exclusions.json \
            --skip-profile pull_request --verbose

  # ═══════════════════════════════════════════════════════════════════════════
  # BNGL corpus parse inventory (not an NFsim simulation check)
  # ═══════════════════════════════════════════════════════════════════════════

  corpus-parse:
    name: BNGL Corpus Parse Inventory
    needs: cpp-build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download bng_cpp artifact
        uses: actions/download-artifact@v4
        with:
          name: bng_cpp-ubuntu-22.04-gcc-12
          path: build/cpp/

      - name: Make executable
        run: chmod +x build/cpp/bng_cpp

      - name: Inventory parser coverage
        run: |
          set -eu
          PASS=0
          UNSUPPORTED=0
          TOTAL=0
          while IFS= read -r -d '' bngl; do
            TOTAL=$((TOTAL + 1))
            model_name=$(basename "$bngl" .bngl)
            echo -n "  $model_name... "

            if build/cpp/bng_cpp --check "$bngl" > /dev/null 2>&1; then
              echo "PASS (parse)"
              PASS=$((PASS + 1))
            else
              echo "UNSUPPORTED (parse error)"
              UNSUPPORTED=$((UNSUPPORTED + 1))
            fi
          done < <(find models -type f -name '*.bngl' -print0)
          if [ "$TOTAL" -eq 0 ]; then
            echo "ERROR: no BNGL models were discovered"
            exit 1
          fi
          {
            echo "### BNGL Corpus Parse Inventory"
            echo ""
            echo "This check inventories parser acceptance only; it does not run NFsim."
            echo ""
            echo "| Total | Parsed | Unsupported |"
            echo "| ---: | ---: | ---: |"
            echo "| $TOTAL | $PASS | $UNSUPPORTED |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════════════
  # Python Package Build & Test (full matrix)
  # ═══════════════════════════════════════════════════════════════════════════

  python-test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install system dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install cmake ninja

      - name: Setup MSVC (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Python build dependencies
        run: pip install scikit-build-core pybind11 numpy click pytest pytest-cov cement colorlog pyparsing pylru pandas matplotlib python-libsbml pyyaml lxml networkx sympy seaborn xmltodict

      - name: Build and install package (Windows)
        if: startsWith(matrix.os, 'windows')
        run: pip install . -v
        env:
          CMAKE_ARGS: "-DBUILD_TESTS=OFF -DBUILD_CLI=OFF -DCMAKE_VERBOSE_MAKEFILE=ON"
          SKBUILD_VERBOSE: "1"

      - name: Build and install package (Unix)
        if: "!startsWith(matrix.os, 'windows')"
        run: |
          python -m pip wheel . --no-deps --wheel-dir wheelhouse -v
          python -m pip install --force-reinstall --no-deps wheelhouse/*.whl
        env:
          CMAKE_ARGS: "-DBUILD_TESTS=OFF -DBUILD_CLI=OFF"

      - name: Seed isolated Matplotlib font cache (Unix)
        if: matrix.os == 'ubuntu-22.04' && (matrix.python-version == '3.9' || matrix.python-version == '3.10')
        run: python scripts/prepare_matplotlib_cache.py
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib

      - name: Run Python tests
        run: pytest tests/python/test_sbml_import.py -v --tb=short
        env:
          SYMPY_USE_GMPY: "0"
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib

      - name: Run Python tests
        run: pytest tests/python/ -v --tb=short --cov=bionetgen --cov-report=xml --ignore=tests/python/test_sbml_import.py
        env:
          SYMPY_USE_GMPY: "0"
          MPLBACKEND: Agg
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib

      - name: Upload coverage
        if: matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ═══════════════════════════════════════════════════════════════════════════
  # Python Integration Tests (atomizer, legacy compat)
  # ═══════════════════════════════════════════════════════════════════════════

  python-integration:
    name: Integration Tests
    needs: python-test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          pip install scikit-build-core pybind11 numpy pytest
          pip install -e .[full]
        env:
          CMAKE_ARGS: "-DBUILD_TESTS=OFF -DBUILD_CLI=OFF"

      - name: Run atomizer tests
        run: pytest tests/python/ -v -k "atomizer" --tb=short
        env:
          SYMPY_USE_GMPY: "0"

      - name: Run model loading tests
        run: pytest tests/python/ -v -k "model" --tb=short
        env:
          SYMPY_USE_GMPY: "0"

      - name: Test CLI commands
        run: |
          bionetgen --version
          echo 'begin model
          begin parameters
            k 0.1
          end parameters
          begin molecule types
            A()
          end molecule types
          begin seed species
            A() 100
          end seed species
          begin observables
            Molecules Atot A()
          end observables
          begin reaction rules
            A() -> 0 k
          end reaction rules
          end model' > /tmp/test.bngl
          bionetgen check /tmp/test.bngl
          bionetgen run /tmp/test.bngl --method ode --t-end 10
        env:
          SYMPY_USE_GMPY: "0"

  # ═══════════════════════════════════════════════════════════════════════════
  # Source Distribution Installation Smoke Test
  # ═══════════════════════════════════════════════════════════════════════════

  package-smoke:
    name: Package Smoke (sdist)
    needs: [python-test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging and native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          python -m pip install build

      - name: Build source distribution
        run: python -m build --sdist

      - name: Install source distribution in clean environment
        shell: bash
        run: |
          set -eu
          python -m venv "$RUNNER_TEMP/bng3-package-smoke"
          "$RUNNER_TEMP/bng3-package-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/bng3-package-smoke/bin/python" -m pip install numpy click
          "$RUNNER_TEMP/bng3-package-smoke/bin/python" -m pip install --no-deps dist/*.tar.gz
        env:
          CMAKE_ARGS: "-DBUILD_TESTS=OFF -DBUILD_CLI=OFF"

      - name: Smoke installed package
        shell: bash
        run: |
          set -eu
          "$RUNNER_TEMP/bng3-package-smoke/bin/python" -c \
            "import bionetgen; import bionetgen._bionetgen_cpp"
          "$RUNNER_TEMP/bng3-package-smoke/bin/bionetgen" --version
          "$RUNNER_TEMP/bng3-package-smoke/bin/bionetgen" --help

  # ═══════════════════════════════════════════════════════════════════════════
  # Wheel Building (binary distribution)
  # ═══════════════════════════════════════════════════════════════════════════

  wheels:
    name: Wheels (${{ matrix.os }})
    needs: [cpp-build, python-test, validation]
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-13, macos-14, windows-2022]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup MSVC (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.21.3

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_* *-manylinux_i686 *-win32"
          CIBW_BUILD_VERBOSITY: 1
          CIBW_TEST_REQUIRES: pytest numpy click
          CIBW_TEST_COMMAND: pytest {project}/tests/python/test_cpp_backend.py -v --tb=short
          CIBW_ENVIRONMENT: CMAKE_ARGS="-DBUILD_TESTS=OFF -DBUILD_CLI=OFF"
          # macOS: build universal2 wheels
          CIBW_ARCHS_MACOS: "arm64 x86_64"
          # Linux: manylinux2014 for broad compatibility
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # ═══════════════════════════════════════════════════════════════════════════
  # Source Distribution
  # ═══════════════════════════════════════════════════════════════════════════

  sdist:
    name: Source Distribution
    needs: [python-test]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ═══════════════════════════════════════════════════════════════════════════
  # Publish to PyPI (on tagged release)
  # ═══════════════════════════════════════════════════════════════════════════

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ═══════════════════════════════════════════════════════════════════════════
  # Docker Image (for containerized use)
  # ═══════════════════════════════════════════════════════════════════════════

  docker:
    name: Docker Image
    needs: [python-test]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
