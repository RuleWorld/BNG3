schema_version: 1
status: pending-maintainer-approval
description: >-
  The BNG3 capability-union inventory: one row per behaviour that the
  supported surfaces expose.  A row records the support status, the review
  owner, the acceptance gate that would qualify it and the explicit
  exclusions, so no boundary is left implicit.  This file is the machine
  readable form of docs/CAPABILITY_UNION_INVENTORY.md; it records availability
  and the plan, it does not approve a support policy.  The approval of the
  per-row policy remains a maintainer decision (issue #137).

surfaces:
- bionetgen
- pybionetgen
- nfsim
- nfsim-rasi
- atomizer
- optional-tool

policy_vocabulary:
- supported
- experimental
- compatibility-only
- deprecated
- out-of-scope
- decision-required

capabilities:
- id: bngl.ast.model
  surface: bionetgen
  behaviour: BNGL lexical and syntactic parsing, model declarations, source diagnostics and AST construction.
  matrix_row: bngl.ast.model
  support: partial
  policy: decision-required
  owner: BNGL language semantics
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/python/test_bng_parsing.py
  - tests/cpp/test_correctness_regressions.cpp
  exclusions:
  - Grammar and declaration forms outside the named regressions are not claimed as supported.
  notes: The parser AST represents source syntax while the compiled model owns resolved semantics.

- id: bngl.network-expansion
  surface: bionetgen
  behaviour: Rule expansion, graph matching, canonical species, generated networks and structural .net identity.
  support: partial
  policy: decision-required
  owner: graph and network semantics
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/validation/test_parity_net.py
  - tests/cpp/test_network_generator.cpp
  exclusions:
  - A single cross-domain label identity between the BNGcore and NFsim encodings is not claimed.
  notes: The structural comparator and the network tests exist; the identity relation stays open.

- id: bngl.simulation-methods
  surface: bionetgen
  behaviour: Finite ODE and SSA trajectories, observable projection and repeated-seed behaviour.
  support: partial
  policy: decision-required
  owner: numerical and stochastic validation
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/validation/test_parity_ode.py
  - tests/validation/test_parity_stochastic.py
  exclusions:
  - Parameter and sensitivity scans are qualified only by their own recorded fixtures.
  notes: The deterministic and seeded harnesses exist; wider method claims need their own rows.

- id: bngl.protocol-actions
  surface: bionetgen
  behaviour: Protocol actions, their arguments and the files and results they produce.
  support: partial
  policy: decision-required
  owner: action and runtime semantics
  owner_assignment: pending-maintainer
  acceptance_gate:
  - scripts/validate_actions.py
  - tests/validation/test_export_formats.py
  exclusions:
  - Action names that are not enumerated by the action contract are not claimed as supported.
  notes: The separated protocol representation exists; the argument values are still strings.

- id: bngl.rate-laws-functions
  surface: bionetgen
  behaviour: Rate laws, global and local functions, table functions and expression built-ins.
  support: partial
  policy: decision-required
  owner: expression and rate-law semantics
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/validation/test_parity_expressions.py
  - tests/validation/test_parity_rhs.py
  exclusions:
  - Nested, local and time-dependent function forms without a differential fixture are not claimed.
  notes: The implemented subset is bounded and feature-specific rejections exist.

- id: bngl.setoption
  surface: bionetgen
  behaviour: setOption validation, the SpeciesLabel spellings and the compatibility options.
  matrix_row: bngl.actions.setoption
  support: partial
  policy: decision-required
  owner: language and API compatibility
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/cpp/test_model_options.cpp
  exclusions:
  - The deprecated option spellings have no approved replacement or removal window.
  notes: Recognised options fail closed when their semantics are not implemented.

- id: bngl.observable-counting-modes
  surface: bionetgen
  behaviour: Molecules and Species observable counting, including the CountUnique algorithms.
  matrix_row: bngl.observables.counting-modes
  support: implemented
  policy: decision-required
  owner: observable semantics
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/cpp/test_observable_counting.cpp
  exclusions:
  - The two CountUnique algorithms are implemented; the remaining counting variants are not covered by this row.
  notes: Molecules and Species CountUnique are distinct algorithms and are tested separately.

- id: bngl.exporters
  surface: bionetgen
  behaviour: The BNG-XML, .net, SBML and the historic writer list.
  support: partial
  policy: decision-required
  owner: interchange and compatibility
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/validation/test_export_formats.py
  - tests/validation/export_format_tier.py
  exclusions:
  - The MATLAB/MEX, LaTeX, SSC and MDL writers are not claimed as supported.
  notes: The current writer paths and the selected export contracts exist.

- id: pybionetgen.api-cli
  surface: pybionetgen
  behaviour: The modern load, builder, model and result methods, scans, sensitivities and the command line.
  matrix_row: pybionetgen.api-cli-atomizer
  support: partial
  policy: decision-required
  owner: Python API and packaging
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/python/test_cpp_backend.py
  - tests/python/test_cli.py
  - tests/python/test_parameter_scan.py
  - tests/python/test_sensitivity.py
  exclusions:
  - Notebook execution and third-party integrations are outside this gate.
  notes: The core API and the CLI share the in-process backend.

- id: pybionetgen.legacy-imports
  surface: pybionetgen
  behaviour: The legacy imports, wrappers, output shape and legacy API behaviour.
  support: unverified
  policy: decision-required
  owner: Python compatibility
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/python/test_compatibility_contract.py
  exclusions:
  - The public legacy entry points that the compatibility matrix has not mapped are not claimed.
  notes: Some modules and shims remain; the complete public inventory is still open.

- id: pybionetgen.legacy-perl-runner
  surface: pybionetgen
  behaviour: The BIONETGEN_USE_PERL subprocess runner and the deprecated subprocess simulation entry point.
  support: unverified
  policy: decision-required
  owner: Python compatibility and release policy
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/python/test_compatibility_contract.py
  - "decision: the retained or replaced status of the subprocess runner is a maintainer decision"
  exclusions:
  - The subprocess .simulate() method raises and is not claimed as a supported simulation route.
  notes: The opt-in runner exists; the migration guide still documents it.

- id: nfsim.options-parameters
  surface: nfsim
  behaviour: Direct AST-to-NFsim construction of parameters and options.
  matrix_row: nfsim.options.parameters
  support: partial
  policy: decision-required
  owner: NFsim semantics and stochastic validation
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/cpp/test_nfsim_ast_adapter.cpp
  exclusions:
  - Option and parameter forms outside the mapped subset remain fail-closed.
  notes: NumberPerQuantityUnit and typed parameter values are mapped.

- id: nfsim.compartments
  surface: nfsim
  behaviour: Direct AST-to-NFsim construction of compartments and their hierarchy.
  matrix_row: nfsim.compartments
  support: partial
  policy: decision-required
  owner: NFsim semantics and stochastic validation
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/cpp/test_nfsim_ast_adapter.cpp
  exclusions:
  - Compartment semantics beyond the mapped hierarchy and name validation are not claimed.
  notes: The hierarchy and the duplicate and name validation are mapped.

- id: nfsim.molecule-types
  surface: nfsim
  behaviour: Direct AST-to-NFsim construction of molecule types, their states and their symmetry.
  matrix_row: nfsim.molecule-types
  support: partial
  policy: decision-required
  owner: NFsim semantics and stochastic validation
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/cpp/test_nfsim_ast_adapter.cpp
  exclusions:
  - Molecule type features outside the mapped state expansion and symmetry renaming are not claimed.
  notes: Integer state expansion and symmetric-site renaming are mapped.

- id: nfsim.global-functions
  surface: nfsim
  behaviour: Direct AST-to-NFsim construction of global functions, local functions and table functions.
  matrix_row: nfsim.global-functions.safe-subset
  support: partial
  policy: decision-required
  owner: NFsim semantics and stochastic validation
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/cpp/test_nfsim_ast_adapter.cpp
  exclusions:
  - Unbounded function-counter composites and the remaining rate-law forms remain gated.
  notes: The mapped safe subset is enumerated in the capability matrix.

- id: nfsim.seed-species
  surface: nfsim
  behaviour: Direct AST-to-NFsim construction of seed species, including particle and population seeds.
  matrix_row: nfsim.seed-species
  support: partial
  policy: decision-required
  owner: NFsim semantics and stochastic validation
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/cpp/test_nfsim_ast_adapter.cpp
  - tests/validation/test_parity_nfsim_seed.py
  exclusions:
  - Seed forms without independent native evidence are not claimed.
  notes: The direct conversion exists; the semantic obligations are recorded in the matrix.

- id: nfsim.observables
  surface: nfsim
  behaviour: Direct AST-to-NFsim construction of observables and their counting modes.
  matrix_row: nfsim.observables
  support: partial
  policy: decision-required
  owner: NFsim semantics and stochastic validation
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/cpp/test_nfsim_ast_adapter.cpp
  - tests/validation/test_parity_nfsim.py
  exclusions:
  - Symmetry, stoichiometry and disjoint-pattern observable modes are not claimed.
  notes: The direct mappings exist; the modes have different gates.

- id: nfsim.reaction-rules
  surface: nfsim
  behaviour: Direct AST-to-NFsim construction of reaction rules, their rates and their filters.
  matrix_row: nfsim.reaction-rules
  support: partial
  policy: decision-required
  owner: NFsim semantics and stochastic validation
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/cpp/test_nfsim_ast_adapter.cpp
  - tests/validation/test_parity_nfsim_deletion.py
  exclusions:
  - Context-only symmetric reaction centres and the other dynamic forms remain fail-closed.
  notes: The broad bounded rule and rate lowering exists.

- id: nfsim.energy-and-time-functions
  surface: nfsim-rasi
  behaviour: Energy patterns, Arrhenius expansion, time-dependent functions and the newer protocol semantics.
  matrix_row: nfsim.energy-and-time-functions
  support: partial
  policy: experimental
  owner: NFsim energy and performance semantics
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/energy
  - tests/validation/real_model_fixtures.py
  exclusions:
  - Symmetric-site exact statistical parity is not claimed; the legacy XML energy lookup does not match that fixture.
  - The fork's source cutoff and its independent parity are not approved, so canonical NFsim support is not inferred from the fork.
  notes: The bounded compiler and lowering exist; the Rasi reconciliation stays open.

- id: nfsim.xml-construction
  surface: nfsim
  behaviour: The in-memory XML construction route and its explicit fallback.
  support: partial
  policy: compatibility-only
  owner: NFsim integration
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/cpp/test_nfsim_ast_adapter.cpp
  exclusions:
  - The XML fallback is not counted as direct-construction evidence and is never selected silently.
  notes: Direct AST initialisation is the default route.

- id: nfsim.hybrid-populations
  surface: nfsim
  behaviour: Hybrid particle and population execution and the population-map storage.
  support: unsupported
  policy: decision-required
  owner: network-free backend architecture
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/cpp/test_hybrid_model_generator.cpp
  exclusions:
  - Direct NFsim execution of a population map is refused rather than approximated.
  notes: The storage and the generation are separate from an execution refinement.

- id: nfsim.nfcore2-nfnext
  surface: nfsim
  behaviour: The NFcore2 lowering, the NFnext execution route and their maintained roles.
  support: unverified
  policy: decision-required
  owner: network-free backend architecture
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/cpp/test_nfcore2_parity.cpp
  - "decision: the maintained role of NFcore2 and NFnext is a maintainer decision"
  exclusions:
  - The small NFnext bridge is not a full backend equivalence.
  notes: The architecture contracts exist and state the boundary explicitly.

- id: atomizer.sbml-core-lowering
  surface: atomizer
  behaviour: The modern Atomizer and the SBML Core lowering of representable reactions, rules, parameters, units and MathML.
  support: partial
  policy: decision-required
  owner: SBML and Atomizer semantics
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/python/test_modern_atomizer_sbml_parity.py
  - tests/python/test_sbml_validation_contracts.py
  exclusions:
  - SBML classes without a named transformation condition and an observable-level comparison are not claimed.
  notes: The dated SBML feature inventory describes the per-class lowering.

- id: atomizer.sbml-multi
  surface: atomizer
  behaviour: The SBML Multi representable structural subset and its round trip.
  support: partial
  policy: experimental
  owner: SBML Multi
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/python/test_modern_atomizer_multi.py
  - tests/cpp/test_sbml_reader.cpp
  exclusions:
  - Broad Multi execution parity is not established.
  notes: The parser and the lowering support bounded structures.

- id: atomizer.events
  surface: atomizer
  behaviour: The lowering of fixed-time, constant-valued SBML events.
  support: partial
  policy: supported
  owner: SBML runtime semantics
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/python/test_modern_atomizer_events.py
  exclusions:
  - Dynamic trigger scheduling is not supported and fails closed.
  notes: The exact finite-schedule lowering exists for a bounded class.

- id: atomizer.unsupported-packages
  surface: atomizer
  behaviour: The detection and refusal of the unsupported SBML package families and semantic classes.
  support: unsupported
  policy: decision-required
  owner: SBML semantics and product policy
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/python/test_sbml_package_severity.py
  - tests/python/test_sbml_validation_contracts.py
  exclusions:
  - The comp, fbc, qual, spatial, arrays, distrib and dyn packages, algebraic rules, constraints and dynamic stoichiometry are refused, not approximated.
  notes: Detection with an explicit diagnostic is not an implementation of the class.

- id: bngir.serialization
  surface: optional-tool
  behaviour: The BNGIR serialization versions and the native structural deserialization.
  support: partial
  policy: experimental
  owner: serialization and API semantics
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/python/test_bngir.py
  - tests/validation/bngir_adversarial.py
  exclusions:
  - Direct native structural deserialization is not claimed.
  notes: The serialization, the snapshots and the round-trip tests exist.

- id: optional.bngsim-backend
  surface: optional-tool
  behaviour: The optional BNGsim execution route for generated finite networks.
  support: partial
  policy: experimental
  owner: finite backend and numerical validation
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/cpp/test_bngsim_adapter.cpp
  - tests/validation/bngsim_boundary.py
  exclusions:
  - The adapter is off by default and is not a migration or retirement claim.
  notes: The bounded accept and reject surfaces are documented.

- id: optional.jax-backend
  surface: optional-tool
  behaviour: The optional JAX ODE and SSA backends.
  support: unverified
  policy: experimental
  owner: optional backend and Python API
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/python/test_jax_ode.py
  - tests/python/test_jax_ssa.py
  - tests/validation/jax_backend_measurement.py
  exclusions:
  - Neither JAX module is advertised as a generally supported simulator.
  notes: The opt-in modules and their measurement harness exist.

- id: optional.cuda-batch-ssa
  surface: optional-tool
  behaviour: The Metal and CUDA batched finite-network SSA path.
  support: unverified
  policy: experimental
  owner: accelerator and stochastic validation
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/cpp/test_gpu_batch_ssa_backend.cpp
  exclusions:
  - No NVIDIA device kernel has been qualified and the CPU fallback is not device evidence.
  notes: The infrastructure and the fallback contracts exist.

- id: optional.crnt-bridge
  surface: optional-tool
  behaviour: The optional CRNT and model-property verification bridge.
  support: unsupported
  policy: decision-required
  owner: scientific tooling and product policy
  owner_assignment: pending-maintainer
  acceptance_gate:
  - "decision: the source surface and the maintained role of the bridge are a maintainer decision"
  exclusions:
  - No maintained BNG3 bridge contract was identified, so no bridge behaviour is claimed.
  notes: The product and design decision is open.

- id: optional.validation-corpus-tools
  surface: optional-tool
  behaviour: The RuleHub, curated BioModels, official SBML Test Suite and benchmark runners.
  support: partial
  policy: decision-required
  owner: scientific validation and provenance
  owner_assignment: pending-maintainer
  acceptance_gate:
  - scripts/validate_corpus_manifest.py
  - scripts/ci/validate_sbml_test_suite.py
  exclusions:
  - The corpus selectors and the external tier membership require maintainer approval.
  notes: These are qualification tools, not user-facing capabilities.

- id: core.graph.canonicalization
  surface: optional-tool
  behaviour: The single compiled Nauty dependency and the canonicalization contract.
  matrix_row: core.graph.canonicalization.single-nauty
  support: partial
  policy: decision-required
  owner: graph semantics
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/python/test_single_nauty_contract.py
  exclusions:
  - One cross-domain graph identity semantic contract is not claimed by the build and linkage contract.
  notes: The implementation is complete; the oracle evidence is still pending.

- id: expression.builtins
  surface: optional-tool
  behaviour: The shared built-in name, arity and semantics table and its evaluators.
  matrix_row: expression.builtins.shared-table
  support: partial
  policy: decision-required
  owner: expression semantics
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/cpp/test_expression_evaluator.cpp
  exclusions:
  - Built-in names and contexts without a differential fixture are not claimed.
  notes: The evaluators are shared by the compiler and by NFsim.

- id: io.sbml.structured-bng2
  surface: optional-tool
  behaviour: The native reader for the legacy structured BNG2 SBML dialect.
  matrix_row: io.sbml.structured-bng2
  support: partial
  policy: compatibility-only
  owner: interchange compatibility
  owner_assignment: pending-maintainer
  acceptance_gate:
  - tests/cpp/test_sbml_reader.cpp
  exclusions:
  - The structured dialect is not general SBML support.
  notes: The native reader path is distinct from the modern SBML import.

- id: validation.oracles-goldens-release
  surface: optional-tool
  behaviour: The immutable upstream sources, the oracle recipes, the golden artifacts and the release gates.
  matrix_row: validation.oracles-goldens-release
  support: unverified
  policy: decision-required
  owner: provenance and release
  owner_assignment: pending-maintainer
  acceptance_gate:
  - scripts/validate_provenance.py
  - scripts/validate_corpus_manifest.py
  exclusions:
  - It is a release prerequisite rather than a product capability.
  notes: The source approvals, the artifact digests and the release gates remain pending.
