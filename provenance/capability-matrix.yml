    status: implemented-subset
    direct_path: direct
    tests: tests/cpp/test_nfsim_ast_adapter.cpp
    oracle: pending
    owner: pending-maintainer
    notes: Parameter, zero-argument observable/time references, zero-argument composites over base globals, inline and file-backed TFUN (linear/step with time, parameter, or observable counters; relative files resolve beside the supplied BNGL source), and one-argument local functions with molecule- or species-scoped observable and time references are direct; nested composites, local TFUNs, other rate-law forms, and non-percent scopes remain gated.
