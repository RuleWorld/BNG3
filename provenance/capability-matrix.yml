  - id: nfsim.reaction-rules
    source: legacy NFinput::initReactionRules
    bng3_reference: cpp/nfsim/NFinput/NFinput_fromAst.cpp:addReactionRulesFromAst
    status: implemented-subset
    direct_path: direct
    tests: tests/cpp/test_nfsim_ast_adapter.cpp
    oracle: pending
    owner: pending-maintainer
    notes: Elementary state, bond, degradation, product-creation, and compartment-transport rules are direct; bidirectional, zero-order, static MM, Sat, Hill, zero-argument functional, bounded molecule- or species-scoped local-function, bounded two-factor FunctionProduct rates, and bounded unidirectional reactant include/exclude filters are covered. Reversible or product-filtered rules, symmetric reaction centers, and other non-static forms remain fail-closed.
  - id: nfsim.energy-and-time-functions
    source: legacy NFinput::initEnergyFunctions and initFunctions
    bng3_reference: cpp/nfsim/NFinput/NFinput_fromAst.cpp
    status: implemented-subset
    direct_path: direct-subset
    tests: tests/cpp/test_nfsim_ast_adapter.cpp
    oracle: pending
    owner: pending-maintainer
    notes: Energy patterns plus bounded Arrhenius binding/state-change expansion, time-dependent global functions, file-backed/inline TFUN, time-bearing local functions, and bounded composites are direct; context variants use NFsim EnergyFunction. Local TFUN and other energy/rate-law forms remain fail-closed on the direct path.
