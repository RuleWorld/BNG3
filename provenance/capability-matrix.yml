schema_version: 1
status: working-inventory
description: >-
  Source-to-BNG3 capability inventory for the full-port effort. This is not a
  release approval ledger; pending rows require implementation, differential
  evidence, or an explicit maintainer compatibility decision.
baseline_date: 2026-08-28
source_lock: provenance/upstreams.lock.yml
rows:
  - id: bngl.ast.model
    source: cpp/ast/Model.hpp
    bng3_reference: cpp/ast/Model.hpp
    status: implemented
    direct_path: canonical
    tests: tests/cpp/test_nfsim_ast_adapter.cpp
    oracle: pending
    owner: pending-maintainer
    notes: Canonical forward-development model; parser and writers still need complete feature coverage.
  - id: nfsim.options.parameters
    source: legacy NFinput::initializeFromModel and initParameters
    bng3_reference: cpp/nfsim/NFinput/NFinput_fromAst.cpp:addOptionsFromAst/addParametersFromAst
    status: implemented-subset
    direct_path: direct
    tests: tests/cpp/test_nfsim_ast_adapter.cpp
    oracle: pending
    owner: pending-maintainer
    notes: NumberPerQuantityUnit and typed parameter values are mapped; remaining options are explicit gates.
  - id: nfsim.compartments
    source: legacy NFinput::initCompartments
    bng3_reference: cpp/nfsim/NFinput/NFinput_fromAst.cpp:addCompartmentsFromAst
    status: implemented-subset
    direct_path: direct
    tests: tests/cpp/test_nfsim_ast_adapter.cpp
    oracle: pending
    owner: pending-maintainer
    notes: Hierarchy and duplicate/name validation are mapped; compartment semantics need differential coverage.
  - id: nfsim.molecule-types
    source: legacy NFinput::initMoleculeTypes
    bng3_reference: cpp/nfsim/NFinput/NFinput_fromAst.cpp:addMoleculeTypesFromAst
    status: implemented-subset
    direct_path: direct
    tests: tests/cpp/test_nfsim_ast_adapter.cpp
    oracle: pending
    owner: pending-maintainer
    notes: Integer state expansion and symmetric-site renaming are mapped.
  - id: nfsim.global-functions.safe-subset
    source: legacy NFinput::initFunctions
    bng3_reference: cpp/nfsim/NFinput/NFinput_fromAst.cpp:addFunctionsFromAst
    status: implemented-subset
    direct_path: direct
    tests: tests/cpp/test_nfsim_ast_adapter.cpp
    oracle: pending
    owner: pending-maintainer
    notes: Parameter, zero-argument observable/time references, zero-argument composites over base globals, normalized zero-argument composite chains, inline and file-backed TFUN (linear/step with time, parameter, or observable counters; relative files resolve beside the supplied BNGL source), and one-argument local functions with molecule- or species-scoped observable and time references are direct; time/parameter/observable-backed local TFUNs, bounded one-level nested local composites, and bounded function-counter TFUNs over one zero-argument base global are also direct, while unbounded function-counter composites, other rate-law forms, and non-percent scopes remain gated.
  - id: nfsim.seed-species
    source: legacy NFinput::initStartSpecies
    bng3_reference: cpp/nfsim/NFinput/NFinput_fromAst.cpp:addSpeciesFromAst
    status: implemented-subset
    direct_path: direct
    tests: tests/cpp/test_nfsim_ast_adapter.cpp
    oracle: pending
    owner: pending-maintainer
    notes: Must preserve particle/population, state, bond, compartment, and fixed-species semantics.
  - id: nfsim.observables
    source: legacy NFinput::initObservables/readObservableForTemplateMolecules
    bng3_reference: cpp/nfsim/NFinput/NFinput_fromAst.cpp:addObservablesFromAst
    status: implemented-subset
    direct_path: direct
    tests: tests/cpp/test_nfsim_ast_adapter.cpp
    oracle: pending
    owner: pending-maintainer
    notes: Molecules, Species, stoichiometric constraints, symmetry, and disjoint-pattern behavior require parity evidence.
  - id: nfsim.reaction-rules
    source: legacy NFinput::initReactionRules
    bng3_reference: cpp/nfsim/NFinput/NFinput_fromAst.cpp:addReactionRulesFromAst
    status: implemented-subset
    direct_path: direct
    tests: tests/cpp/test_nfsim_ast_adapter.cpp
    oracle: pending
    owner: pending-maintainer
    notes: Elementary state, bond, degradation, product-creation, compartment-transport, and MoveConnected rules are direct; bidirectional, zero-order, static MM, Sat, Hill, zero-argument functional, bounded molecule- or species-scoped local-function, bounded nested local, bounded function-counter TFUN, bounded two-factor FunctionProduct rates, bounded unidirectional reactant/product bare-molecule include/exclude filters, bounded reversible filter swapping, bounded symmetric state-change and bond reaction-center permutations with context symmetry, and dynamic rates over parameters, observables, time, one TFUN, base global functions, or bounded zero-argument model-function chains are covered. Dynamic symmetric state-change and bond permutations retain generated live rate functions. Dynamic rates mixing direct observables with base global functions use generated observable aliases; context-only symmetric reaction centers and other non-static forms remain fail-closed.
  - id: nfsim.energy-and-time-functions
    source: legacy NFinput::initEnergyFunctions and initFunctions
    bng3_reference: cpp/nfsim/NFinput/NFinput_fromAst.cpp
    status: implemented-subset
    direct_path: direct-subset
    tests: tests/cpp/test_nfsim_ast_adapter.cpp
    oracle: pending
    owner: pending-maintainer
    notes: Energy patterns plus bounded Arrhenius binding/state-change expansion, time-dependent global functions, file-backed/inline TFUN, time-bearing local functions, bounded nested local and function-counter TFUN composites, and bounded composites are direct; context variants use NFsim EnergyFunction. Symmetric Arrhenius reaction-center multiplicity is preserved and source-derived in CTest. The independent constant-binding gate passes with 1024 seeds; symmetric-site exact statistical parity remains explicitly unqualified because the legacy XML energy lookup does not match that fixture. Local TFUN inside energy/rate-law forms and other energy/rate-law forms remain fail-closed on the direct path.
  - id: io.sbml.structured-bng2
    source: legacy BNG2 structured SBML dialect and cpp/io/SbmlReader.cpp
    bng3_reference: cpp/io/SbmlReader.cpp:isStructuredBng2Sbml/stoichiometry
    status: implemented-subset
    direct_path: native-structured-subset
    tests: tests/cpp/test_sbml_reader.cpp
    oracle: pending
    owner: pending-maintainer
    notes: Native atomize=true admission is semantic rather than tied to model/species IDs, and stoichiometry accepts only finite positive integers. The query-backed runner accounts for the complete manually curated BioModels inventory and records non-SBML formats explicitly; SBML records receive modern import, C++ writer/native re-import, and all-observable BNG3-CVODE versus libRoadRunner-CVODE checks. Unsupported constructs, solver failures, and parity failures remain explicit rather than being promoted to support.
  - id: pybionetgen.api-cli-atomizer
    source: python/bionetgen and legacy/PyBioNetGen
    bng3_reference: python/bionetgen
    status: implemented-subset
    direct_path: in-process
    tests: tests/python/test_cpp_backend.py, tests/python/test_cli.py, tests/python/test_parameter_scan.py, tests/python/test_sensitivity.py
    oracle: pending
    owner: pending-maintainer
    notes: Core API and CLI share the in-process backend; source-build and wheel imports, solver controls, scans, and sensitivity have smoke coverage. The bounded legacy method/time override writes PyBioNetGen-style gdat output and is checked against a locked source signature; an isolated CPython 3.14 arm64 wheel qualification runs modern and legacy contracts. The Playground-derived Atomizer has a complete manually curated BioModels inventory runner, direct BNG3-CVODE/libRoadRunner observable comparison, and SBML Level 2 reaction-local-parameter handling. Unsupported constructs and failed cross-engine parity remain explicitly reported.
  - id: validation.oracles-goldens-release
    source: provenance/upstreams.lock.yml and provenance/golden
    bng3_reference: provenance/
    status: pending-maintainer-approval
    direct_path: governance
    tests: scripts/validate_provenance.py
    oracle: pending
    owner: pending-maintainer
    notes: Immutable BNG2/NFsim/PyBioNetGen sources, manifests, tolerances, owners, and release gates are required. The material-gap evidence runner records exact local source revisions and independent-oracle commands, but maintainer approval, full corpus coverage, cross-platform qualification, and release gates remain pending.
  - id: core.graph.canonicalization.single-nauty
    source: cpp/nauty (BNG) and cpp/nfsim/nauty24 (NFsim), nauty 2.4
    bng3_reference: cpp/nauty (sole compiled tree); consumers cpp/core/PatternGraph.cpp and cpp/nfsim/NFcore/complex.cpp
    status: implemented
    direct_path: canonical
    tests: tests/python/test_single_nauty_contract.py
    oracle: pending
    owner: pending-maintainer
    notes: >-
      WO-1b, applied 2026-09-17 and locally build-verified 2026-09-17 (cmake + 408/408 CTest, 10/10 Python contract). The two bundled trees were verified identical
      after normalizing the documented set->nset typedef rename; the
      unification adopted the nset variant, which additionally carries an MSVC
      HAVE_SYSTYPES_H guard the cpp/nauty copy lacked. Implementation status is
      complete; oracle status is explicitly pending. Independent evidence that
      a single low-level Nauty dependency preserves NFsim complex identity,
      reaction counts, and seeded trajectories still requires hosted CI and a native NFsim oracle.
  - id: expression.builtins.shared-table
    source: legacy/perl/Perl2/Expression.pm %functions (BNG2 oracle)
    bng3_reference: cpp/ast/ExpressionBuiltins.hpp; consumers cpp/ast/Expression.cpp and cpp/nfsim/NFinput/NFinput_fromAst.cpp
    status: implemented-subset
    direct_path: canonical
    tests: tests/cpp/test_expression_evaluator.cpp
    oracle: partial-static
    owner: pending-maintainer
    notes: >-
      Unifies builtin name/arity/semantics metadata and, as of WO-3/3b on 2026-09-17, the evaluators themselves: NFsim now uses `bng::parser::parseExpression` + `bng::eval::evaluate` via `nfsim_funcparser.h` and `NFSIM_USE_EXPRTK`/`exprtk` are removed. Locally build-verified (408/408 CTest, `test_expression_evaluator` 4 new cases). Oracle status is
      partial-static: the BNG2 rint definition (floor(x + 0.5)) was executed
      directly in Perl and both engines corrected to match, but no numerical
      cross-backend comparison under hosted CI has been run. Corrected rint in two places, added
      sign to the shared evaluator, rejected bare log in favor of
      ln/log10/log2, admitted avg, and made the NFsim gate case-sensitive.
  - id: bngl.actions.setoption
    source: legacy/perl/Perl2/BNGModel.pm:1911 setOption; SpeciesGraph.pm:128; Observable.pm:236
    bng3_reference: cpp/ast/ModelOptions.hpp; validated at cpp/ast/Model.cpp Model::setOption
    status: implemented-subset
    direct_path: canonical
    tests: tests/cpp/test_model_options.cpp
    oracle: partial-static
    owner: pending-maintainer
    notes: >-
      Options were previously stored unvalidated and silently ignored.
      Validation now fails closed on recognized options whose semantics BNG3
      does not implement. SpeciesLabel Auto and HNauty are accepted as no-ops
      because both are exact canonical labelings yielding the same species
      partition; Quasi is rejected as approximate. Locally build-verified 2026-09-17 (408/408 CTest, `test_model_options` 4 cases; `stripQuotes` fix for `getText()`).
  - id: bngl.observables.counting-modes
    source: legacy/perl/Perl2/Observable.pm:236 (Molecules) and :260 (Species)
    bng3_reference: cpp/engine/ObservableProjection.cpp
    status: implemented
    direct_path: canonical
    tests: tests/cpp/test_observable_counting.cpp
    oracle: partial-static
    owner: pending-maintainer
    notes: >-
      MoleculesObservables/SpeciesObservables CountUnique was previously ABSENT
      from BNG3 entirely (zero occurrences in cpp, python, tests, models), so a
      model requesting it silently received CountAll values. Both modes are now
      implemented. The two keys are NOT the same operation: Molecules
      CountUnique divides each pattern match count by the pattern automorphism
      count, while Species CountUnique short-circuits the term loop so a
      species contributes once regardless of how many patterns it matches
      (BNG2 has symmetry correction commented out on the Species branch). The
      exactness of the Molecules division rests on Aut(P) acting freely on
      embeddings; verified numerically over 32 pattern/target combinations with
      zero non-divisible cases, and asserted at runtime rather than truncated.
      Oracle status is partial-static: no BNG2 differential run was possible
      offline. Locally build-verified 2026-09-17 (408/408 CTest, 5 cases; fixed dangling `BNGcoreLoweringContext` in test helper).

