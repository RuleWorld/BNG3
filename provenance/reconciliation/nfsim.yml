        "tests/validation/test_reconciliation_nfsim.py::test_record_complex_flag_reconciliation",
        "tests/validation/test_reconciliation_nfsim.py::test_record_totalrate_reconciliation",
        "tests/validation/test_nfsim_totalrate_local_function_parity.py::test_totalrate_local_function_source_rejects_product_executes"
      ],
      "reviewer": "Codex technical reconciliation; maintainer review pending",
      "rationale": "The start-time and time() tests cover NFsim Issue78 (action.simulate_nf.t_start, action.simulate_nf.sample_times, nfsim.energy-and-time-functions). The focused Issue86 test compares post-event Species-observable propensity refresh with an analytic endpoint law (nfsim.observables). For Issue51, test_record_complex_flag_reconciliation establishes parity with pinned NFsim across default, -cb, -bscb, and -no-bscb while test_cpp_backend.py covers explicit control rejection and strict-molecularity defaults (action.simulate_nf.complex, nf.option.cb, nf.option.bscb). For Issue91, cpp/nfsim/NFinput/NFinput.cpp and NFinput_reactions_fromCompiled.cpp (#1028) reject TotalRate with local functions, built-in saturating rates (MM/Sat), and Arrhenius rates on both compiled/direct and XML paths, verified by test_record_totalrate_reconciliation ([mm] and [local-function], semantic_result=PASS) and test_totalrate_local_function_source_rejects_product_executes (semantic_result=PASS, classification=agreement), alongside C++/Python unit coverage in tests/cpp/test_nfsim_ast_adapter.cpp and test_simulate_nf_rejects_totalrate_with_local_functions."
    },
