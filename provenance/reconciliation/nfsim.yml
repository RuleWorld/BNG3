      "capability": "Repair NFsim absolute-start-time, time-function, observable propensity refresh, and unsupported-rate/flag regressions",
      "classification": "incorporated-equivalently",
      "bng3_reference": "cpp/nfsim/NFinput/NFinput.cpp; cpp/nfsim/NFinput/NFinput_reactions_fromCompiled.cpp; cpp/actions/ActionDispatch.cpp; tests/python/test_cpp_backend.py",
      "tests": [
        "tests/python/test_cpp_backend.py::TestSimulation::test_nf_simulation_honors_absolute_start_time",
        "tests/python/test_cpp_backend.py::TestSimulation::test_simulate_nf_rejects_unsupported_continue",
        "tests/python/test_cpp_backend.py::TestSimulation::test_simulate_nf_rejects_unhandled_controls",
        "tests/python/test_cpp_backend.py::TestSimulation::test_simulate_nf_defaults_to_strict_molecularity_with_explicit_opt_out",
