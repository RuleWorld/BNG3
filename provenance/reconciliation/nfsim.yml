      "reviewer": "Codex technical reconciliation; maintainer review pending",
      "rationale": "The start-time and time() tests cover NFsim Issue78 (action.simulate_nf.t_start, action.simulate_nf.sample_times, nfsim.energy-and-time-functions). The focused Issue86 test compares post-event Species-observable propensity refresh with an analytic endpoint law (nfsim.observables). Issue51 is a separate product difference: the pinned NFsim CLI applies the distinct-complex binding policy for either -cb or -bscb, while the BNG3 compiled action route distinguishes the options (action.simulate_nf.complex, nf.option.cb, nf.option.bscb). For Issue91, the MM probe agrees: both pinned NFsim and the BNG3 direct route reject TotalRate with an MM rate law. The scoped-local-function case is mapped only to test_nfsim_totalrate_local_function_parity.py, which reduces the pinned test/testSuite/t3.xml (Issue91 local functions) fixture to a self-contained counterexample and runs the native CLI and the public bionetgen.load(...).simulate(method='nf') route at the accepted 9b00d42f pin with seed 1. At that pin the native oracle rejects with 'TotalRate keyword is not compatible with local functions' and emits no trajectory, while BNG3 executes through the direct construction path: the check records semantic_result=FAIL and this remains a pending product difference, not incorporated behavior. Arrhenius, Sat and local function products still need independent checks (bngl.totalrate)."
